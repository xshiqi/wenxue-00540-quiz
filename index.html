》描绘了王政复辟时期激烈的政治斗争，具有强烈的政治倾向。①对侯爵府第的描写，广泛地展现了复辟王朝时期贵族社会的画面。②对神学院的描写，是作者对传统宗教及其罪恶的绝妙讽刺，神学院和教区内充满着阴谋及钩"},{"id":"s00109","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1810论述","1704名词","2110简答"],"stem":"名词解释：《红与黑》的人物形象","points":["论述于连·索雷尔的形象","于连·索雷尔是斯丹达尔小说《红与黑》的主人公。他是小资产阶级知识分子个人奋斗的典型。","于连是法国复辟时期小资产阶级知识分子个人奋斗的典型，但他既不同于只求温饱的青年，也不属于甘愿出卖灵魂、最终与上流社会同流合污的一类，他是有理想、有抱负、不满现状、要求民主平等、富有反抗精神的“理想型”青年。","于连也是“性格分裂”的人物，是一个自尊自爱、勇敢真诚而又自卑怯懦、虚伪的矛盾统一体。于连的一生都在追求，曾以不凡的勇气、激情、自尊和胆量与命运进行抗争。但他不是命运的宠儿，每一次努力都在即将达到胜利彼岸时成为泡影。","于连的悲剧告诉我们：在复辟时期，一个有进取心的平民青年，试图通过个人奋斗跻身上流社会，却又不愿厚颜无耻地讨好主子，丧尽天良地利用他人的鲜血来染红自己的肩章，最终只能成为上流社会的“局外人”。"],"src":"论述于连·索雷尔的形象／于连·索雷尔是斯丹达尔小说《红与黑》的主人公。他是小资产阶级知识分子个人奋斗的典型。／于连是法国复辟时期小资产阶级知识分子个人奋斗的典型，但他既不同于只求温饱的青年，也不属于甘愿出卖灵魂、最终与上流社会同流合污的一类，他是有理想、有抱负、不满现状、要求民主平等、富有反抗精神的“理想型”青年。／于连也是“性格分裂”的人物，是一个自尊自爱、勇敢真诚而又自卑怯懦、虚伪的矛盾统一体"},{"id":"s00110","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1110","1510论述","2504论述"],"stem":"论述斯丹达尔《红与黑》的艺术成就","points":["从传统封闭结构向现代开放结构过渡。以于连的仕途、爱情为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景，形成了主干明显，疏密得当的结构。作品所表现的是1830年这样一个“特定时代”的“空间”的“心灵变化”，时间、地点的迅速变换，人物的忽隐忽现，对话的紧张而不连贯等，更增加了作品的现代因素。","塑造了众多性格鲜明的人物形象。除塑造了于连这个不朽的艺术形象之外，还塑造很多既有个性又有某一类型性格的人物。如德·瑞那市长的利欲熏心而又迂腐可笑、哇列诺的飞扬跋扈、老索雷尔的市侩习气等。","对人物行为的深刻心理分析，是《红与黑》的主要艺术魅力所在。斯丹达尔具有数学家那样的天才，能准确无误地刻画出男女主人公的细致心理变化及其发展过程，尤其是他们的爱情心理变化。于连一生的追求，他的爱恨情仇，就始终伴随着深刻、细腻的心理描写。"],"src":"从传统封闭结构向现代开放结构过渡。以于连的仕途、爱情为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景，形成了主干明显，疏密得当的结构。作品所表现的是1830年这样一个“特定时代”的“空间”的“心灵变化”，时间、地点的迅速变换，人物的忽隐忽现，对话的紧张而不连贯等，更增加了作品的现代因素。／塑造了众多性格鲜明的人物形象。除塑造了于连这个不朽的艺术形象之外，还塑造很多既有个性又有某一类型性格的"},{"id":"s00111","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1910名词"],"stem":"名词解释：巴尔扎克","points":["19世纪法国现实主义作家；创作了由九十多部小说组成的《人间喜剧》，","深刻反映了波旁王朝复辟时期法国生活，被誉为法国社会生活的百科全书。人间喜剧：【0510名词；作品—2410多选】【★★★★★】","巴尔扎克创作的总称，包括风俗研究、哲学研究、分析研究三部分，共90余部。","主要用现实主义手法，通过资产者的发家、贵族的没落、金钱的万能来揭露和批判资本主义金钱社会。人间喜剧作品：哲理小说《驴皮记》，《欧也妮·葛朗台》，《高老头》，《邦斯舅舅》。【2410多选】14.巴尔扎克的《欧也妮·葛朗台》：","通过葛朗台一家的故事描绘了资本主义社会里人与人之间赤裸裸的利害关系和冷酷的现金交易。无情地揭去了温情脉脉的面纱，披露资本主义社会里夫妻、兄弟、儿女、亲戚、朋友间的人际关系。","葛朗台形象：①暴发户，大革命后得势的资产阶级的代表，复辟王朝时期的大财主。②反映复辟王朝时期土地/金融资产阶级主宰一切的社会现实。③写出法国大革命后资产阶级暴发户的发家过程，揭示在新的历史条件下资产阶级聚敛财富的特点。葛朗台的形象是对资产阶级金钱拜物教的生动写照。"],"src":"19世纪法国现实主义作家；创作了由九十多部小说组成的《人间喜剧》，／深刻反映了波旁王朝复辟时期法国生活，被誉为法国社会生活的百科全书。人间喜剧：【0510名词；作品—2410多选】【★★★★★】／巴尔扎克创作的总称，包括风俗研究、哲学研究、分析研究三部分，共90余部。／主要用现实主义手法，通过资产者的发家、贵族的没落、金钱的万能来揭露和批判资本主义金钱社会。人间喜剧作品：哲理小说《驴皮记》，《欧也"},{"id":"s00112","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1510","1001论述","2110简答"],"stem":"简述：结合作品分析巴尔扎克《人间喜剧》的思想内容","points":["《人间喜剧》反映了资产阶级取代贵族阶级的罪恶发家史。巴尔扎克用编年史的方式几乎逐年地把上升的资产阶级在1816至1848年这一时期对贵族社会日甚一日的冲击描写出来。","《人间喜剧》反映了贵族阶级的没落衰亡史。巴尔扎克描写了贵族社会在1815年以后企图重整旗鼓，尽力恢复旧日法国生活方式，但却在庸俗的、满身铜臭的暴发户的逼攻下逐渐灭亡，或者被暴发户所腐化。","描写了一幕幕围绕着争夺金钱而展开的惨剧，创作了一部金钱统治一切的社会风俗史。也描写到底层人物，尤其塑造了共和主义的英雄克雷斯蒂安（《幻灭》），并把这个政治上的死对头看作未来真正的人。"],"src":"《人间喜剧》反映了资产阶级取代贵族阶级的罪恶发家史。巴尔扎克用编年史的方式几乎逐年地把上升的资产阶级在1816至1848年这一时期对贵族社会日甚一日的冲击描写出来。／《人间喜剧》反映了贵族阶级的没落衰亡史。巴尔扎克描写了贵族社会在1815年以后企图重整旗鼓，尽力恢复旧日法国生活方式，但却在庸俗的、满身铜臭的暴发户的逼攻下逐渐灭亡，或者被暴发户所腐化。／描写了一幕幕围绕着争夺金钱而展开的惨剧，创作了"},{"id":"s00113","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["简答题考点","2310论述"],"stem":"简述：巴尔扎克《人间喜剧》的艺术成就","points":["巴尔扎克在艺术上也取得了巨大成就，这集中表现在对典型的塑造上。","把环境描写与人物心理变化和精神状态糅合在一起，用高度集中和概括的手法塑造了众多的典型性格。","独创的手法，塑造人物使用“人物再现法”，使《人间喜剧》形成一个艺术整体。【2204名词】①即在《人间喜剧》不同的小说中人物反复出现，以表现他们的性格发展和不同生活阶段，最后形成这个人物的整体形象。 ②这种手法能使各种作品联结起来，也使《人间喜剧》形成一个艺术整体。","巴尔扎克在小说结构和叙述方面也进行了富有成效的探索。","由于巴尔扎克在小说方面的卓越建树，他被尊为法国现代小说之父。"],"src":"巴尔扎克在艺术上也取得了巨大成就，这集中表现在对典型的塑造上。／把环境描写与人物心理变化和精神状态糅合在一起，用高度集中和概括的手法塑造了众多的典型性格。／独创的手法，塑造人物使用“人物再现法”，使《人间喜剧》形成一个艺术整体。【2204名词】①即在《人间喜剧》不同的小说中人物反复出现，以表现他们的性格发展和不同生活阶段，最后形成这个人物的整体形象。 ②这种手法能使各种作品联结起来，也使《人间喜剧"},{"id":"s00114","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["简答","论述"],"stem":"简述：巴尔扎克《高老头》的思想主题","points":["《高老头》淋漓尽致地揭露了金钱的统治作用和拜金主义的种种罪恶。","从不同角度写出政治野心家的成长过程，揭露了统治阶层的卑鄙丑恶，抨击了资产阶级的道德原则。","还通过鲍赛昂子爵夫人情场失意的描写，显示复辟时期贵族被资产阶级取代的历史过程。"],"src":"《高老头》淋漓尽致地揭露了金钱的统治作用和拜金主义的种种罪恶。／从不同角度写出政治野心家的成长过程，揭露了统治阶层的卑鄙丑恶，抨击了资产阶级的道德原则。／还通过鲍赛昂子爵夫人情场失意的描写，显示复辟时期贵族被资产阶级取代的历史过程。"},{"id":"s00115","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1610简答"],"stem":"简析高老头的父爱","points":["高老头是在饥荒年代牟取暴利的商人，把全部感情都放在女儿身上。","随着钱财日益减少，被女儿抛弃。","他的遭遇表现了世态炎凉，社会教育和社会风气对人的败坏。","其悲剧是对赤裸裸金钱关系的愤怒谴责。高老头“父爱”的悲剧意义：高老头是一个典型的资产者形象；他爱钱，但更爱女儿；父爱的片面发展形象地说明了资产阶级家庭“单纯的金钱”关系。【0701简答】"],"src":"高老头是在饥荒年代牟取暴利的商人，把全部感情都放在女儿身上。／随着钱财日益减少，被女儿抛弃。／他的遭遇表现了世态炎凉，社会教育和社会风气对人的败坏。／其悲剧是对赤裸裸金钱关系的愤怒谴责。高老头“父爱”的悲剧意义：高老头是一个典型的资产者形象；他爱钱，但更爱女儿；父爱的片面发展形象地说明了资产阶级家庭“单纯的金钱”关系。【0701简答】"},{"id":"s00116","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1804","1301论述","2510简答"],"stem":"分析《高老头》拉斯蒂涅形象；论述“人生三课”对拉斯蒂涅形象的意义","points":["➤ 分析拉斯蒂涅蜕变的主要过程。【2008考期/2010考期论述/2210名词】【★★★★★】","《高老头》中的主人公拉斯蒂涅是复辟王朝后期到七月王朝时期的资产阶级政治家和野心家的典型。","他到巴黎上大学，想通过勤奋努力，刻苦攻读争取一番功名。但是经不起上流社会的诱惑。3年的巴黎生活使他看清了社会的本质：法律和道德对有钱人无效，财产才是金科玉律。于是他决定走另一条道路：往上爬！不顾一切地往上爬。","其蜕变是由于经历了“人生三课”：鲍赛昂子爵夫人的“教导”，伏脱冷的教训，高老头被女儿抛弃的惨剧。鲍赛昂夫人亲自教他读“人生这部书”培养他自私自利的人生观，传授他以牙还牙对付社会和个人的伎俩。最后鲍赛昂夫人的隐退使他进一步认识到金钱的重要作用。伏脱冷要求拉斯蒂涅同自己合伙，教他与维多莉恋爱，自己杀死维多莉的哥哥，以获取泰伊番的财产。他还用赤裸裸的语言剖析社会的本质。伏脱冷后来被米旭诺以3000法郎卖给当局，使拉斯蒂涅进一步相信伏脱冷利己主义社会本质的剖析。","高老头的苦难和死亡，最后完成了他的社会教育。当他埋葬了高老头后，埋掉了最后一点人性。这曾清白的青年，已堕落成向财富和权势进攻的资产阶级野心家。"],"src":"➤ 分析拉斯蒂涅蜕变的主要过程。【2008考期/2010考期论述/2210名词】【★★★★★】／《高老头》中的主人公拉斯蒂涅是复辟王朝后期到七月王朝时期的资产阶级政治家和野心家的典型。／他到巴黎上大学，想通过勤奋努力，刻苦攻读争取一番功名。但是经不起上流社会的诱惑。3年的巴黎生活使他看清了社会的本质：法律和道德对有钱人无效，财产才是金科玉律。于是他决定走另一条道路：往上爬！不顾一切地往上爬。／其蜕"},{"id":"s00117","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1201论述","2110多选","2504多选"],"stem":"论述巴尔扎克小说《高老头》的艺术成就","points":["《高老头》在人物塑造、心理描写、情节结构等方面达到了很高的成就。","将人物性格的塑造与人物活动舞台的描写结合起来，反映社会风俗。如伏盖公寓。描写下层人物的活动舞台—伏盖公寓，坐落在偏僻角落，各层居室分出等级，如同一个小社会。","重要人物性格鲜明，描写方法各有不同。如高里奥、拉斯蒂涅、伏脱冷和德·鲍赛昂子爵夫人。运用心理描写刻画拉斯蒂涅作为野心家的形成过程，接受罪恶的教育，由热情的幻想家变成冷静的挑战者。","次要人物也跃然纸上，各有特色。","（小蒋说：需答“人物再现法”）➢ “人物再现法”：【1010/2204 名词】【★★★★★】是巴尔扎克在《人间喜剧》中独创的一种塑造人物形象的手法，即同一人物在不同的作品中反复出现，以表现他们的性格发展和不同生活阶段；并使多部作品联结成一个艺术整体。"],"src":"《高老头》在人物塑造、心理描写、情节结构等方面达到了很高的成就。／将人物性格的塑造与人物活动舞台的描写结合起来，反映社会风俗。如伏盖公寓。描写下层人物的活动舞台—伏盖公寓，坐落在偏僻角落，各层居室分出等级，如同一个小社会。／重要人物性格鲜明，描写方法各有不同。如高里奥、拉斯蒂涅、伏脱冷和德·鲍赛昂子爵夫人。运用心理描写刻画拉斯蒂涅作为野心家的形成过程，接受罪恶的教育，由热情的幻想家变成冷静的挑战者"},{"id":"s00118","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1904 名词","2410 单选"],"stem":"名词解释：狄更斯","points":["狄更斯是19世纪英国的杰出小说家，他的创作反映了19世纪英国的人情世态和社会风貌，具有强烈的人道主义思想，代表了19世纪英国文学的最高成就。【1704 单选】","代表作是《双城记》。"],"src":"狄更斯是19世纪英国的杰出小说家，他的创作反映了19世纪英国的人情世态和社会风貌，具有强烈的人道主义思想，代表了19世纪英国文学的最高成就。【1704 单选】／代表作是《双城记》。"},{"id":"s00119","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1510","1010 简答题"],"stem":"简述狄更斯小说创作的人道主义思想","points":["人道主义是贯穿狄更斯小说创作的一条红线。作者批判了维多利亚时代的英国资本主义社会，提倡与弘扬宽恕、博爱之类的伦理道德，并对人性作了广泛而深入的探索。","人性是狄更斯人道主义的基础与出发点，宽恕、爱、和解等道德信条是狄更斯人道主义思想的主要内容，而社会批判则是狄更斯从人道主义出发对社会进行观察和评价的结果。"],"src":"人道主义是贯穿狄更斯小说创作的一条红线。作者批判了维多利亚时代的英国资本主义社会，提倡与弘扬宽恕、博爱之类的伦理道德，并对人性作了广泛而深入的探索。／人性是狄更斯人道主义的基础与出发点，宽恕、爱、和解等道德信条是狄更斯人道主义思想的主要内容，而社会批判则是狄更斯从人道主义出发对社会进行观察和评价的结果。"},{"id":"s00120","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1910 论述","2104 简答"],"stem":"论述狄更斯《双城记》的人道主义思想","points":["肯定法国大革命的必然性与正义性，反对革命暴力和大规模的群众运动。","宣扬仁爱、宽恕，塑造了梅尼特、代尔那、卡尔登等一系列道德高尚的人物。","人道主义贯穿狄更斯创作的始终，是评价人物和各种现象的基本出发点。"],"src":"肯定法国大革命的必然性与正义性，反对革命暴力和大规模的群众运动。／宣扬仁爱、宽恕，塑造了梅尼特、代尔那、卡尔登等一系列道德高尚的人物。／人道主义贯穿狄更斯创作的始终，是评价人物和各种现象的基本出发点。"},{"id":"s00121","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["选择","简答考点"],"stem":"简述：狄更斯《双城记》的思想内容","points":["《双城记》是部历史小说，但处理的却是现实问题。","反映了当时英国社会的尖锐矛盾、贫富的悬殊，下层群众中普遍存在着的愤懑与不满，指出这与大革命前的法国类似，警告英国统治者提防发生类似法国大革命的悲剧。","肯定了法国大革命的必然性与正义性，反对革命暴力与大规模的群众运动，否定贵族和革命的领导者们。"],"src":"《双城记》是部历史小说，但处理的却是现实问题。／反映了当时英国社会的尖锐矛盾、贫富的悬殊，下层群众中普遍存在着的愤懑与不满，指出这与大革命前的法国类似，警告英国统治者提防发生类似法国大革命的悲剧。／肯定了法国大革命的必然性与正义性，反对革命暴力与大规模的群众运动，否定贵族和革命的领导者们。"},{"id":"s00122","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1110","1410 论述"],"stem":"论述狄更斯《双城记》的艺术成就","points":["小说采用典型的多元整一结构，严谨有序。小说由五个叙事单元组成：①梅尼特一家的故事，②得伐石夫妇的故事，③厄弗里蒙地家族的故事，④卡尔登的生活与献身，⑤克朗丘的生活与经历。五个单元之间互相独立、平行发展，又有紧密联系，整一的：人物、情节和线索三种因素。","体现了狄更斯侧重描写“感受世界”的现实主义创作方法。","成功地运用了悬念与象征的艺术手法。如梅尼特与厄弗里蒙地家族的关系及他在狱中写下的那份文件。","采用一些象征性的标题，如“复活”等，不少细节描写采用象征手法，以暗示某种意象或预兆，渲染气氛。如得伐石太太“编织罪恶”的描写，鲜红的酒象征着鲜红的血。"],"src":"小说采用典型的多元整一结构，严谨有序。小说由五个叙事单元组成：①梅尼特一家的故事，②得伐石夫妇的故事，③厄弗里蒙地家族的故事，④卡尔登的生活与献身，⑤克朗丘的生活与经历。五个单元之间互相独立、平行发展，又有紧密联系，整一的：人物、情节和线索三种因素。／体现了狄更斯侧重描写“感受世界”的现实主义创作方法。／成功地运用了悬念与象征的艺术手法。如梅尼特与厄弗里蒙地家族的关系及他在狱中写下的那份文件。／采"},{"id":"s00123","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1310 简答","2010 单选"],"stem":"简述：《双城记》的人物形象","points":["《双城记》中梅尼特医生的形象","梅尼特医生是一个具有人道主义思想的形象。（青年时的梅尼特医生正直高尚）","因揭发厄弗里蒙地侯爵虐杀农民的罪行被关进巴士底狱。","出狱后，成为仁爱与宽恕的化身。（出狱后有新信仰，要为爱/为别人的幸福而活）卡尔登：对露茜的爱使本性善良的卡尔登获得精神上的新生。利他主义发展到顶峰，放射出基督般的光环。厄弗里蒙地侯爵：反动贵族的典型。 得伐石太太：革命群众的代表。"],"src":"《双城记》中梅尼特医生的形象／梅尼特医生是一个具有人道主义思想的形象。（青年时的梅尼特医生正直高尚）／因揭发厄弗里蒙地侯爵虐杀农民的罪行被关进巴士底狱。／出狱后，成为仁爱与宽恕的化身。（出狱后有新信仰，要为爱/为别人的幸福而活）卡尔登：对露茜的爱使本性善良的卡尔登获得精神上的新生。利他主义发展到顶峰，放射出基督般的光环。厄弗里蒙地侯爵：反动贵族的典型。 得伐石太太：革命群众的代表。"},{"id":"s00124","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["选择","名词","简答"],"stem":"名词解释：陀思妥耶夫斯基《穷人》","points":["1846年，陀思妥耶夫斯基完成的处女作《穷人》发展了“小人物”主题。主人公杰符什金是年老而失业的公务员，收留孤苦无依的少女瓦莲卡，虽然他无法改变自己和少女的悲惨命运，但其天性中的善良、美好的品质彰显出他未被泯灭的人性和对幸福生活的向往。","杰符什金形象体现出作者的人道主义思想，他继承并深化了由普希金和果戈理描写“小人物”的主题。包括别林斯基在内的俄国革命民主主义者给予极高的评价，誉之为“新的果戈理”。","在社会意义中，作家本人心里已经开始了他对“人”的进一步的探索，看到了人性的复杂。"],"src":"1846年，陀思妥耶夫斯基完成的处女作《穷人》发展了“小人物”主题。主人公杰符什金是年老而失业的公务员，收留孤苦无依的少女瓦莲卡，虽然他无法改变自己和少女的悲惨命运，但其天性中的善良、美好的品质彰显出他未被泯灭的人性和对幸福生活的向往。／杰符什金形象体现出作者的人道主义思想，他继承并深化了由普希金和果戈理描写“小人物”的主题。包括别林斯基在内的俄国革命民主主义者给予极高的评价，誉之为“新的果戈理”"},{"id":"s00125","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["选择","名词","简答"],"stem":"名词解释：陀思妥耶夫斯基《卡拉马佐夫兄弟》","points":["《卡拉马佐夫兄弟》：陀思妥耶夫斯基最后一部长篇小说，也是陀思妥耶夫斯基创作的总结。小说通过一个“偶合家庭”的内部关系，写出了一个社会的缩影，同时也对不同类型的人进行了无情的解剖。","父亲老卡拉马佐夫：病态而又恶毒的灵魂的代表，好色淫虐，无恶不作。","长子德米特里：复杂性格，放纵自然欲望/灵性。为和父亲争夺情妇扬言弑父。","次子伊凡：推崇理智，冷静的无神论者，对现实社会的清醒认识，思想上的凶手。","小弟弟阿辽沙：作者笔下的理想人物，“要为全人类受苦”的正面人物。","私生子斯麦尔佳科夫：恶的典型，十分卑劣的灵魂，没有信仰/原则，完全听命于自己欲望的支配。为三千卢布，杀害生父。"],"src":"《卡拉马佐夫兄弟》：陀思妥耶夫斯基最后一部长篇小说，也是陀思妥耶夫斯基创作的总结。小说通过一个“偶合家庭”的内部关系，写出了一个社会的缩影，同时也对不同类型的人进行了无情的解剖。／父亲老卡拉马佐夫：病态而又恶毒的灵魂的代表，好色淫虐，无恶不作。／长子德米特里：复杂性格，放纵自然欲望/灵性。为和父亲争夺情妇扬言弑父。／次子伊凡：推崇理智，冷静的无神论者，对现实社会的清醒认识，思想上的凶手。／小弟弟阿"},{"id":"s00126","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1904 论述题"],"stem":"简述：陀思妥耶夫斯基《罪与罚》的思想内容","points":["《罪与罚》的思想内容深刻而复杂，其中对人性的探索关系着当时尚未完全流行的社会思潮。一是关于“超人哲学”和“权力真理”等论题的探讨，再就是对人的行为中“潜意识”的考察。","与上述相关的是“权力”问题，这两个问题可以说其本质是作者对社会不公平的抗议，是对社会中“弱肉强食”现象的艺术描绘。","陀思妥耶夫斯基19岁触及了社会犯罪的根源，只是没有找到能解决这种不合理现象的办法，最后只能求助于宗教赎罪思想。"],"src":"《罪与罚》的思想内容深刻而复杂，其中对人性的探索关系着当时尚未完全流行的社会思潮。一是关于“超人哲学”和“权力真理”等论题的探讨，再就是对人的行为中“潜意识”的考察。／与上述相关的是“权力”问题，这两个问题可以说其本质是作者对社会不公平的抗议，是对社会中“弱肉强食”现象的艺术描绘。／陀思妥耶夫斯基19岁触及了社会犯罪的根源，只是没有找到能解决这种不合理现象的办法，最后只能求助于宗教赎罪思想。"},{"id":"s00127","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["简答","论述","2410 单选"],"stem":"简述：陀思妥耶夫斯基《罪与罚》的人物形象 — 拉斯柯尔尼科夫","points":["《罪与罚》的情节是围绕着主人公拉斯柯尔尼科夫的“哲学”开展的。","主人公拉斯柯尔尼科夫是一个具有双重人格的人物形象，其人格的两面具有不可调和性。","小说真实地揭示了拉斯柯尔尼科夫的理论内核。这种理论尽管也是对社会不公的一种抗议，却是无政府主义的抗议。他不仅不能使主人公获得梦寐以求的穷人的生存权，反而肯定了少数人奴役和掠夺他人的权利。","深刻地写出了这种理论的必然破产，指出了他的极端个人主义的实质。拉斯柯尔尼科夫得到的最高的审判不是来自法庭，而是来自内心的道德审判，最严厉的惩罚不是苦役，而是良心的惩罚。","作者对这一理论的批判始终停留在伦理道德、宗教思想的基点上，并把拉斯柯尔尼科夫的犯罪行为归结为主人公抛弃了对上帝的信仰。 作者把索尼娅看作是人类苦难的象征，在她身上体现了虔诚信仰上帝，通过苦难净化灵魂的思想。拉斯柯尔尼科夫的精神新生来自索尼娅的影响和信仰的感召。","陀思妥耶夫斯基19岁就触及了社会犯罪的根源，只是没有找到能解决这种不合理现象的办法，最后只能求助于宗教赎罪思想。"],"src":"《罪与罚》的情节是围绕着主人公拉斯柯尔尼科夫的“哲学”开展的。／主人公拉斯柯尔尼科夫是一个具有双重人格的人物形象，其人格的两面具有不可调和性。／小说真实地揭示了拉斯柯尔尼科夫的理论内核。这种理论尽管也是对社会不公的一种抗议，却是无政府主义的抗议。他不仅不能使主人公获得梦寐以求的穷人的生存权，反而肯定了少数人奴役和掠夺他人的权利。／深刻地写出了这种理论的必然破产，指出了他的极端个人主义的实质。拉斯柯"},{"id":"s00128","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"stem":"简述：陀思妥耶夫斯基《罪与罚》的艺术成就","points":["分析《罪与罚》中的心理描写。【2104 论述/2008 简答】【★★★★★】①人物心理刻画是《罪与罚》突出的艺术特点。如拉斯柯尔尼科夫杀人前的噩梦，重现杀人的心理体验。②作品里许多章节都有关于心理、意识、“潜意识”的描绘。③以许多梦境和幻觉场面表现潜在意识的过程。如斯维德里加依洛夫自杀前梦境/幻觉。","体现了“复调小说”的特点。【1404 名词；简答/论述考点】【★★★★★】①陀思妥耶夫斯基的小说表现出强烈的“复调”色彩。巴赫金认为陀思妥耶夫斯基创造了一种全新的艺术思维类型——复调型的艺术思维。②复调小说是一种小说结构样式，是由众多的似乎平等的声音的对话构成的。如在《罪与罚》里，几乎所有的重要主人公都有他自己的声音，拉斯柯尔尼科夫的“超人哲学”，女主人公索尼娅的“正教观念”，预审员波尔菲里的“生活求实和法律的观念”，卢仁的极端个人主义，列别佳特尼科夫的“利己主义”等。③几乎每一种声音都是振振有词的。显得好像是众多的地位平等的意识，相互对话却不发生融合。④“复调”形成的根源在于作家没有能在小说里解决他揭示的问题，似乎书中的人物都各自表明了自己的立场和态度，但始终叫人说不清正确的结论在哪里。"],"src":"分析《罪与罚》中的心理描写。【2104 论述/2008 简答】【★★★★★】①人物心理刻画是《罪与罚》突出的艺术特点。如拉斯柯尔尼科夫杀人前的噩梦，重现杀人的心理体验。②作品里许多章节都有关于心理、意识、“潜意识”的描绘。③以许多梦境和幻觉场面表现潜在意识的过程。如斯维德里加依洛夫自杀前梦境/幻觉。／体现了“复调小说”的特点。【1404 名词；简答/论述考点】【★★★★★】①陀思妥耶夫斯基的小说表"},{"id":"s00129","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["选择","简答题考点"],"stem":"简述：莫泊桑中短篇小说的思想内容和艺术特点","points":["思想内容：第一篇成名作《羊脂球》；“短篇小说之王”。①表现普法战争中法国民众以微薄之力维护国家利益、民族尊严的可贵品德和爱国主义精神，揭露敌人残暴和法国当权者的腐败，上流社会体面人士的怯懦、自私。②描写小职员的生活，展现他们的精神世界。③以诺曼底农村生活为背景，描写农民的淳朴、愚昧以及悲惨处境。","艺术特点：①文字简洁、结构严密。②以平淡的口吻叙述故事。③语言朴素无华，字字珠玑。"],"src":"思想内容：第一篇成名作《羊脂球》；“短篇小说之王”。①表现普法战争中法国民众以微薄之力维护国家利益、民族尊严的可贵品德和爱国主义精神，揭露敌人残暴和法国当权者的腐败，上流社会体面人士的怯懦、自私。②描写小职员的生活，展现他们的精神世界。③以诺曼底农村生活为背景，描写农民的淳朴、愚昧以及悲惨处境。／艺术特点：①文字简洁、结构严密。②以平淡的口吻叙述故事。③语言朴素无华，字字珠玑。"},{"id":"s00130","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["选择","简答题考点"],"stem":"简述：契诃夫的短篇小说的特色","points":["契诃夫：19世纪后期著名的短篇小说巨匠","多选取普通生活中的平常事，人物对话和细节的朴素描绘，揭示生活本质。","不动声色的叙述态度，主观态度融入冷静客观的艺术描写中。","语言简洁，人物个性化语言。➢ 契诃夫：短篇小说：《小公务员之死》《变色龙》《哀伤》《苦恼》《套中人》《姚内奇》。➢ 契诃夫《套中人》：【1710名词】 （1）《套中人》是俄国作家契诃夫创作的短篇小说。","塑造了别里科夫这个“套中人”形象。","反映了沙皇专制统治的残暴和对人的摧残。"],"src":"契诃夫：19世纪后期著名的短篇小说巨匠／多选取普通生活中的平常事，人物对话和细节的朴素描绘，揭示生活本质。／不动声色的叙述态度，主观态度融入冷静客观的艺术描写中。／语言简洁，人物个性化语言。➢ 契诃夫：短篇小说：《小公务员之死》《变色龙》《哀伤》《苦恼》《套中人》《姚内奇》。➢ 契诃夫《套中人》：【1710名词】 （1）《套中人》是俄国作家契诃夫创作的短篇小说。／塑造了别里科夫这个“套中人”形象。"},{"id":"s00131","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["名词考点"],"stem":"名词解释：自然主义","points":["19世纪60年代在龚古尔兄弟的首倡下诞生于法国，后以左拉为中心掀起了自然主义文学运动，影响到欧美和日本等其他国家。","强调写真实，文学完整再现自然；强调客观性，避免主观情感的流露；突出科学性，主张作家用实验方法从事写作，描写达到科学式的精确。","代表作家有龚古尔兄弟和左拉。"],"src":"19世纪60年代在龚古尔兄弟的首倡下诞生于法国，后以左拉为中心掀起了自然主义文学运动，影响到欧美和日本等其他国家。／强调写真实，文学完整再现自然；强调客观性，避免主观情感的流露；突出科学性，主张作家用实验方法从事写作，描写达到科学式的精确。／代表作家有龚古尔兄弟和左拉。"},{"id":"s00132","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["0710名词"],"stem":"名词解释：前期象征主义","points":["象征主义：19世纪70年代崛起于法国，是现代主义文学中产生最早、影响最大、波及面最广的文学流派。","象征主义者认为现实世界是虚幻的，只有内心感受才是真实和美的；诗歌应该摆脱描写外界事物的倾向，努力写出“内心的真实”；内心感受必须借助于具体的形象才能表达，诗人应当找出与之对应的“象征的森林”，用物质可感性表现隐藏的内心世界。","象征主义注重联想和暗示，讲究诗歌的神秘性、音乐性以及“通感”手法。","代表诗人有魏尔伦、兰波和马拉美等。"],"src":"象征主义：19世纪70年代崛起于法国，是现代主义文学中产生最早、影响最大、波及面最广的文学流派。／象征主义者认为现实世界是虚幻的，只有内心感受才是真实和美的；诗歌应该摆脱描写外界事物的倾向，努力写出“内心的真实”；内心感受必须借助于具体的形象才能表达，诗人应当找出与之对应的“象征的森林”，用物质可感性表现隐藏的内心世界。／象征主义注重联想和暗示，讲究诗歌的神秘性、音乐性以及“通感”手法。／代表诗人"},{"id":"s00133","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1201","1404名词"],"stem":"名词解释：唯美主义文学","points":["唯美主义文学是19世纪中期起源于法国、后兴盛于英国的文学流派。【2404 单选】","标榜不与丑恶的现实为伍，主张“为艺术而艺术”，讲究辞藻、韵律。","代表作家有戈蒂耶、王尔德等。"],"src":"唯美主义文学是19世纪中期起源于法国、后兴盛于英国的文学流派。【2404 单选】／标榜不与丑恶的现实为伍，主张“为艺术而艺术”，讲究辞藻、韵律。／代表作家有戈蒂耶、王尔德等。"},{"id":"s00134","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["名词考点"],"stem":"名词解释：巴黎公社文学","points":["19世纪30—40年代，欧洲出现萌芽状态的无产阶级文学，如法国工人诗歌、英国宪章派文学、德国的革命诗歌等。","这一时期成就最大的是巴黎公社文学，包括公社诞生前后约20年间公社社员的大量文学创作。它是巴黎公社革命的直接产物，是早期无产阶级文学的继续和发展。鲍狄埃《国际歌》。"],"src":"19世纪30—40年代，欧洲出现萌芽状态的无产阶级文学，如法国工人诗歌、英国宪章派文学、德国的革命诗歌等。／这一时期成就最大的是巴黎公社文学，包括公社诞生前后约20年间公社社员的大量文学创作。它是巴黎公社革命的直接产物，是早期无产阶级文学的继续和发展。鲍狄埃《国际歌》。"},{"id":"s00135","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1310","1810名词","2404名词","2204","2504多选"],"stem":"名词解释：“威塞克斯小说”","points":["“威塞克斯小说”是英国作家哈代创作的一系列“性格与环境小说”。","故事发生在英国西南部的威塞克斯地区。（以故乡道赛特郡及其附近为背景）","代表作品《德伯家的苔丝》。其他：《绿荫下》《远离尘嚣》《还乡》《卡斯特桥市长》《无名的裘德》"],"src":"“威塞克斯小说”是英国作家哈代创作的一系列“性格与环境小说”。／故事发生在英国西南部的威塞克斯地区。（以故乡道赛特郡及其附近为背景）／代表作品《德伯家的苔丝》。其他：《绿荫下》《远离尘嚣》《还乡》《卡斯特桥市长》《无名的裘德》"},{"id":"s00136","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2110名词"],"stem":"名词解释：哈代《德伯家的苔丝》","points":["是哈代的代表作，欧洲现实主义文学的优秀作品之一。描写农家女子苔丝短促而不幸的一生。","描写苔丝一家的遭遇，形象反映19世纪末英国资本主义入侵农村后广大农民命运的悲剧性转变。","思想主题：通过对苔丝无辜受害的描绘，对资产阶级社会及其法律、道德和虚伪的宗教做有力的揭露，进行了愤怒的控诉。"],"src":"是哈代的代表作，欧洲现实主义文学的优秀作品之一。描写农家女子苔丝短促而不幸的一生。／描写苔丝一家的遭遇，形象反映19世纪末英国资本主义入侵农村后广大农民命运的悲剧性转变。／思想主题：通过对苔丝无辜受害的描绘，对资产阶级社会及其法律、道德和虚伪的宗教做有力的揭露，进行了愤怒的控诉。"},{"id":"s00137","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1904 论述","1410 简答","2410 论述"],"stem":"简述：《德伯家的苔丝》的人物形象及悲剧的根源","points":["苔丝的人物形象：坚强、勤劳而富有反抗性；身上残存某些旧道德观念和宿命观点；悲剧是社会的悲剧。①小说塑造得最成功的形象是苔丝，作品副标题“一个纯洁的女人”体现出作者对苔丝同情、肯定的态度。作者从人道主义立场塑造苔丝，对资产阶级道德做了尖锐的批判。②苔丝具有劳动妇女的美好品质：坚强、勤劳而富于反抗性。苔丝是一个被损害、被侮辱但又不向命运屈服的纯洁少女形象，体现劳动人民的优秀品质：勤劳、善良、刚强，又不能摆脱命运的安排。③苔丝生活在新旧交替时代，出生在没落小贵族世家的农民家庭，残存于农民身上的某些旧道德观念和宿命观点，都对她的思想意识产生影响。她把人的苦难归结为命运作祟，所以常常陷入自卑自叹和悲观失望。","悲剧根源：①社会悲剧：资产阶级社会取代宗法制社会。②命运悲剧：表现出作家浓厚的宿命论色彩。苔丝具有劳动妇女的美好品质，灵魂纯洁、道德高尚，但遭到不可避免的毁灭。代表了破产后的威塞克斯农民的悲惨命运。"],"src":"苔丝的人物形象：坚强、勤劳而富有反抗性；身上残存某些旧道德观念和宿命观点；悲剧是社会的悲剧。①小说塑造得最成功的形象是苔丝，作品副标题“一个纯洁的女人”体现出作者对苔丝同情、肯定的态度。作者从人道主义立场塑造苔丝，对资产阶级道德做了尖锐的批判。②苔丝具有劳动妇女的美好品质：坚强、勤劳而富于反抗性。苔丝是一个被损害、被侮辱但又不向命运屈服的纯洁少女形象，体现劳动人民的优秀品质：勤劳、善良、刚强，又不"},{"id":"s00138","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答考点"],"stem":"简述：哈代《德伯家的苔丝》的艺术成就","points":["哈代塑造具有多重意蕴的人物形象，血肉丰满、性格复杂多样，体现作家对于“一个灵魂就是一个世界”的人本质性的把握及对人的深刻理解。","大量的自然景色的描写，与人物的思想感情、命运紧密相连，也成为小说中不可忽视的形象。","对人物心理描写的分量大大增加。11. 列夫·托尔斯泰《战争与和平》：","史诗性质的长篇历史小说。俄国的卫国战争，以包尔康斯基、罗斯托夫、别竺号夫、库拉金四个贵族家庭的纪事为线索，从战争与和平两个方面来表现俄罗斯人民同拿破仑侵略者、俄国社会制度同人民意愿之间的矛盾，肯定了俄国人民在战争中的伟大历史作用，赞扬了他们的爱国热情和积极的乐观主义精神。","塑造了安德烈、彼埃尔、娜达莎等众多性格迥异血肉丰满的人物形象。"],"src":"哈代塑造具有多重意蕴的人物形象，血肉丰满、性格复杂多样，体现作家对于“一个灵魂就是一个世界”的人本质性的把握及对人的深刻理解。／大量的自然景色的描写，与人物的思想感情、命运紧密相连，也成为小说中不可忽视的形象。／对人物心理描写的分量大大增加。11. 列夫·托尔斯泰《战争与和平》：／史诗性质的长篇历史小说。俄国的卫国战争，以包尔康斯基、罗斯托夫、别竺号夫、库拉金四个贵族家庭的纪事为线索，从战争与和平"},{"id":"s00139","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2010 考期名词"],"stem":"名词解释：长篇小说《安娜·卡列尼娜》","points":["通过安娜追求爱情自由和列文探索社会出路两条平行发展的情节线索，形象地反映了俄国社会的变动，表达了作者对理想社会、理想人生的苦苦探求。","以史诗性的笔调描写了资本主义冲击下俄国社会生活和人的内心世界的躁动不安，展现了“一切都翻了个身，一切都刚刚开始安排”的时代特点。","列文：带有自传性的精神探索者形象，探索道路反映作者当时的思想和生活体验，表现了他的悲观主义、不抵抗主义和向“精神”呼吁。"],"src":"通过安娜追求爱情自由和列文探索社会出路两条平行发展的情节线索，形象地反映了俄国社会的变动，表达了作者对理想社会、理想人生的苦苦探求。／以史诗性的笔调描写了资本主义冲击下俄国社会生活和人的内心世界的躁动不安，展现了“一切都翻了个身，一切都刚刚开始安排”的时代特点。／列文：带有自传性的精神探索者形象，探索道路反映作者当时的思想和生活体验，表现了他的悲观主义、不抵抗主义和向“精神”呼吁。"},{"id":"s00140","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1710","2204 论述—安娜·卡列尼娜的形象与悲剧根源"],"stem":"简述：安娜·卡列尼娜悲剧的原因","points":["她的性格与社会环境发生冲突的必然结果。（“我是人，我要生活，我要爱情”）","内在原因她独特的个性。安娜不屈从于她认为不合理的社会环境，敢于追求所向往的幸福生活。在卡列宁与渥伦斯基的对比中，她的天性决定了她要和卡列宁的生活告别。她对爱情的执着追求，体现了贵族妇女追求个性解放的要求，具有反封建的性质。","外在原因是虚伪的上流社会和冷酷的官僚世界。安娜的悲剧从根本上说，是由那个罪恶的社会造成的。安娜公开与丈夫决裂和不“体面”的行为，是上流社会不能容忍的，上流社会对其进行了严厉的惩罚。爱情的破裂也使安娜失去了精神的依靠，上流社会通过渥伦斯基杀死了安娜。","形象：追求个性解放的贵族妇女，一个被虚伪道德所束缚和扼杀的悲剧人物。"],"src":"她的性格与社会环境发生冲突的必然结果。（“我是人，我要生活，我要爱情”）／内在原因她独特的个性。安娜不屈从于她认为不合理的社会环境，敢于追求所向往的幸福生活。在卡列宁与渥伦斯基的对比中，她的天性决定了她要和卡列宁的生活告别。她对爱情的执着追求，体现了贵族妇女追求个性解放的要求，具有反封建的性质。／外在原因是虚伪的上流社会和冷酷的官僚世界。安娜的悲剧从根本上说，是由那个罪恶的社会造成的。安娜公开与丈"},{"id":"s00141","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2510 论述"],"stem":"简述：列夫·托尔斯泰《安娜·卡列尼娜》的艺术成就","points":["小说具有出色的心理描写，通过“心灵的辩证法”、人物的外部特征和内心话语揭示其内心世界。","结构独特，谋篇布局缜密严谨。安娜的爱情悲剧和列文的精神探索两条主线联结成严整的拱形结构。"],"src":"小说具有出色的心理描写，通过“心灵的辩证法”、人物的外部特征和内心话语揭示其内心世界。／结构独特，谋篇布局缜密严谨。安娜的爱情悲剧和列文的精神探索两条主线联结成严整的拱形结构。"},{"id":"s00142","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1301","2110 名词"],"stem":"名词解释：“心灵辩证法”","points":["“心灵辩证法”是车尔尼雪夫斯基对托尔斯泰早期自传性小说的评价。","“心灵辩证法”是托尔斯泰在小说中常用的心理描写方法。","不仅注意心理发展变化的结果，而且注意表现心理变化的全过程。"],"src":"“心灵辩证法”是车尔尼雪夫斯基对托尔斯泰早期自传性小说的评价。／“心灵辩证法”是托尔斯泰在小说中常用的心理描写方法。／不仅注意心理发展变化的结果，而且注意表现心理变化的全过程。"},{"id":"s00143","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["名词考点"],"stem":"名词解释：“忏悔贵族”","points":["是托尔斯泰创造的人物画廊中一个特殊的典型。","他们出身贵族，对统治阶级及其国家机器的专横与残暴、对人民的苦难和不幸的社会根源有清醒的认识，意识到本阶级罪恶深重，不时地忏悔，并力图与本阶级决裂，致力于道德的自我修养与行善。","聂赫留朵夫是一个“忏悔贵族”的典型。【2404单选】"],"src":"是托尔斯泰创造的人物画廊中一个特殊的典型。／他们出身贵族，对统治阶级及其国家机器的专横与残暴、对人民的苦难和不幸的社会根源有清醒的认识，意识到本阶级罪恶深重，不时地忏悔，并力图与本阶级决裂，致力于道德的自我修养与行善。／聂赫留朵夫是一个“忏悔贵族”的典型。【2404单选】"},{"id":"s00144","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2310名词"],"stem":"名词解释：“托尔斯泰主义”","points":["托尔斯泰通过文学创作对现存的制度和现实生活中一切虚伪、荒谬与不人道、不道德的东西进行了无情的、毁灭性的揭露和批判。","同时宣扬悔罪、拯救灵魂、禁欲主义、“勿以暴力抗恶”、“道德自我完善”等观点，宣扬一种属于托尔斯泰自己的宗教“博爱”思想，人们称为“托尔斯泰主义”。"],"src":"托尔斯泰通过文学创作对现存的制度和现实生活中一切虚伪、荒谬与不人道、不道德的东西进行了无情的、毁灭性的揭露和批判。／同时宣扬悔罪、拯救灵魂、禁欲主义、“勿以暴力抗恶”、“道德自我完善”等观点，宣扬一种属于托尔斯泰自己的宗教“博爱”思想，人们称为“托尔斯泰主义”。"},{"id":"s00145","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2304简答题"],"stem":"简述：托尔斯泰《复活》的思想内容","points":["《复活》是一部具有深刻的社会内容和鲜明的政治倾向的作品。","小说以“最清醒的现实主义”撕下一切假面具，对地主资产阶级社会进行了全面而无情地批判。揭露了法庭的草菅人命，法律的反人民本质；谴责了官方教会的伪善和欺骗；揭示了地主和农民的矛盾，指出农民赤贫的原因是土地私有制。","一方面反映了农民对土地的强烈要求，另一方面也反映了他们阶级的、历史的局限性和不彻底性。《复活》是一面反映俄国农民在革命中各种矛盾状况的镜子。"],"src":"《复活》是一部具有深刻的社会内容和鲜明的政治倾向的作品。／小说以“最清醒的现实主义”撕下一切假面具，对地主资产阶级社会进行了全面而无情地批判。揭露了法庭的草菅人命，法律的反人民本质；谴责了官方教会的伪善和欺骗；揭示了地主和农民的矛盾，指出农民赤贫的原因是土地私有制。／一方面反映了农民对土地的强烈要求，另一方面也反映了他们阶级的、历史的局限性和不彻底性。《复活》是一面反映俄国农民在革命中各种矛盾状况"},{"id":"s00146","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答考点"],"stem":"简述：《复活》中玛丝洛娃的形象","points":["玛丝洛娃是一个被侮辱与被损害的下层妇女的典型。","她对聂赫留朵夫的怒斥，表达了一个受尽凌辱的妇女对贵族社会的控诉和抗议。","聂赫留朵夫的转变使她重新看到了人身上的善。在监狱中和难友们患难与共，使她的爱憎荣辱观念也变得和被压迫的底层人民相同。她放弃旧的恶习，内心有了对新生活的渴望。西蒙松等革命者解除人们的苦难而甘愿牺牲的精神感动了她，促使她迅速向新生的道路上迈进，她最终在精神上得到“复活”。"],"src":"玛丝洛娃是一个被侮辱与被损害的下层妇女的典型。／她对聂赫留朵夫的怒斥，表达了一个受尽凌辱的妇女对贵族社会的控诉和抗议。／聂赫留朵夫的转变使她重新看到了人身上的善。在监狱中和难友们患难与共，使她的爱憎荣辱观念也变得和被压迫的底层人民相同。她放弃旧的恶习，内心有了对新生活的渴望。西蒙松等革命者解除人们的苦难而甘愿牺牲的精神感动了她，促使她迅速向新生的道路上迈进，她最终在精神上得到“复活”。"},{"id":"s00147","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答","论述考点","2410单选"],"stem":"分析托尔斯泰《复活》中聂赫留朵夫的形象","points":["聂赫留朵夫是“忏悔贵族”的典型。青年时期单纯善良，追求真挚的爱情。【2404单选】","他的思想开始升华，从地主阶级立场转到宗法制农民的立场。为玛丝洛娃申冤上诉认识了社会的弊病。最后在《福音书》中找到了消灭恶势力的办法：那就是在上帝面前永远承认自己有罪，要宽恕一切人，按照上帝的意志为人类的幸福而工作。","作者认为聂赫留朵夫获得了精神上的“复活”，集中体现了托尔斯泰主义思想。","聂赫留朵夫的形象在那个时代具有典型意义，虽然没有归附于革命的阶级，但他从贵族阶级中游离出来，愿意与本阶级决裂，这在俄国1905年革命前夕动荡的年代里无疑是个有本质意义的社会现象。"],"src":"聂赫留朵夫是“忏悔贵族”的典型。青年时期单纯善良，追求真挚的爱情。【2404单选】／他的思想开始升华，从地主阶级立场转到宗法制农民的立场。为玛丝洛娃申冤上诉认识了社会的弊病。最后在《福音书》中找到了消灭恶势力的办法：那就是在上帝面前永远承认自己有罪，要宽恕一切人，按照上帝的意志为人类的幸福而工作。／作者认为聂赫留朵夫获得了精神上的“复活”，集中体现了托尔斯泰主义思想。／聂赫留朵夫的形象在那个时代具"},{"id":"s00148","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1704","1604论述"],"stem":"论述托尔斯泰《复活》的艺术成就","points":["以单线的情节线索描绘了广阔的社会生活。通过聂赫留朵夫为玛丝洛娃上诉、奔走求情，最后去西伯利亚，广泛而深入地描写了俄国社会、展现了一幅生动的社会生活画面。","在描绘艺术画面和人物形象时，大量使用了对比手法。","对人物的心理刻画细致入微。用“心灵的辩证法”表现人物内心思想感情的矛盾和斗争。","重视细节的描写，包括对人物的外貌和生活环境的描绘。"],"src":"以单线的情节线索描绘了广阔的社会生活。通过聂赫留朵夫为玛丝洛娃上诉、奔走求情，最后去西伯利亚，广泛而深入地描写了俄国社会、展现了一幅生动的社会生活画面。／在描绘艺术画面和人物形象时，大量使用了对比手法。／对人物的心理刻画细致入微。用“心灵的辩证法”表现人物内心思想感情的矛盾和斗争。／重视细节的描写，包括对人物的外貌和生活环境的描绘。"},{"id":"s00149","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1610名词","2304名词"],"stem":"名词解释：易卜生","points":["易卜生是19世纪挪威戏剧家，欧洲现代戏剧的创始人。","他创造了以日常生活为题材、揭露社会弊端的“社会问题剧”。其代表作是《玩偶之家》。"],"src":"易卜生是19世纪挪威戏剧家，欧洲现代戏剧的创始人。／他创造了以日常生活为题材、揭露社会弊端的“社会问题剧”。其代表作是《玩偶之家》。"},{"id":"s00150","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1101","1504","1904名词","2410单选"],"stem":"名词解释：“社会问题剧”","points":["易卜生创作的一系列戏剧作品。剧作：《社会支柱》、《玩偶之家》、《群鬼》和《人民公敌》。","以日常生活为素材，从多方面剖析社会问题，层层揭开，使矛盾突出，启发观众思考，从而引导人们起来改革社会弊端。","代表作品是《玩偶之家》。"],"src":"易卜生创作的一系列戏剧作品。剧作：《社会支柱》、《玩偶之家》、《群鬼》和《人民公敌》。／以日常生活为素材，从多方面剖析社会问题，层层揭开，使矛盾突出，启发观众思考，从而引导人们起来改革社会弊端。／代表作品是《玩偶之家》。"},{"id":"s00151","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答","论述考点"],"stem":"简述：易卜生《玩偶之家》的思想意义","points":["易卜生通过娜拉逐渐觉醒的过程，深刻揭露出资产阶级社会的法律、宗教、道德、爱情、婚姻等的虚伪和不合理。","揭露了资本主义制度下妇女在家庭中所处的从属地位，具有深远意义。","《玩偶之家》是一部典型的“社会问题剧”，易卜生在剧中提出了许多敏感而迫切需要解决的社会问题。①资本主义制度下，妇女在家庭中的地位问题。②拥有特权的资产阶级社会上层男性自私、虚伪的问题。③女性如何争取平等权利的问题。通过娜拉反抗的举动强调，妇女只有争取自己做人的权利，才有可能获得幸福的生活。"],"src":"易卜生通过娜拉逐渐觉醒的过程，深刻揭露出资产阶级社会的法律、宗教、道德、爱情、婚姻等的虚伪和不合理。／揭露了资本主义制度下妇女在家庭中所处的从属地位，具有深远意义。／《玩偶之家》是一部典型的“社会问题剧”，易卜生在剧中提出了许多敏感而迫切需要解决的社会问题。①资本主义制度下，妇女在家庭中的地位问题。②拥有特权的资产阶级社会上层男性自私、虚伪的问题。③女性如何争取平等权利的问题。通过娜拉反抗的举动强"},{"id":"s00152","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答","论述考点","0610论述"],"stem":"简述：《玩偶之家》的人物形象——娜拉的形象","points":["娜拉是《玩偶之家》中塑造得十分成功的女性形象。性格坚定、意志坚强、吃苦耐劳的女性。","从品性方面看，娜拉是善良、诚恳的女性。","在爱情观念上，娜拉爱情的最高理想：为所爱的人舍弃一切，甚至生命。","娜拉的离家出走显示了她坚决摆脱玩偶之家的决心。她勇敢地关闭玩偶之家的大门，是思想上自觉向男性权威的宣战。海尔茂：作为男权社会的典型人物出现。既是男权既得利益的维护者，也是这种虚伪自私观念的体现者。"],"src":"娜拉是《玩偶之家》中塑造得十分成功的女性形象。性格坚定、意志坚强、吃苦耐劳的女性。／从品性方面看，娜拉是善良、诚恳的女性。／在爱情观念上，娜拉爱情的最高理想：为所爱的人舍弃一切，甚至生命。／娜拉的离家出走显示了她坚决摆脱玩偶之家的决心。她勇敢地关闭玩偶之家的大门，是思想上自觉向男性权威的宣战。海尔茂：作为男权社会的典型人物出现。既是男权既得利益的维护者，也是这种虚伪自私观念的体现者。"},{"id":"s00153","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["1404简答","0710简答"],"stem":"简述易卜生《玩偶之家》的艺术特色","points":["剧作避免选择重大题材，而是选择日常生活题材。","在戏剧情节结构方面，作家运用了“追溯法”。","作家创造性地将“讨论”引进戏剧。","善用伏笔。剧作发展过程中的许多情节都不只是对前情的延续，更是对以后剧情的铺垫。"],"src":"剧作避免选择重大题材，而是选择日常生活题材。／在戏剧情节结构方面，作家运用了“追溯法”。／作家创造性地将“讨论”引进戏剧。／善用伏笔。剧作发展过程中的许多情节都不只是对前情的延续，更是对以后剧情的铺垫。"},{"id":"s00154","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2504简答"],"stem":"简述马克·吐温《哈克贝利·费恩历险记》的主题思想","points":["表达强烈的追求自由的思想。是美国现实主义作家马克·吐温的代表作。","作品反映了作者反对种族歧视的民主立场。","反映当时美国的社会现实，揭露和批判资本发展迅猛、精神道德堕落的美国社会。"],"src":"表达强烈的追求自由的思想。是美国现实主义作家马克·吐温的代表作。／作品反映了作者反对种族歧视的民主立场。／反映当时美国的社会现实，揭露和批判资本发展迅猛、精神道德堕落的美国社会。"},{"id":"s00155","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["2210简答"],"stem":"简述：马克·吐温《哈克贝利·费恩历险记》","points":["简析哈克贝利·费恩的人物形象-哈克","马克·吐温长篇小说《哈克贝利·费恩历险记》中的主人公。","美国“文明社会”的叛逆者。在帮助吉姆获得自由的痛苦斗争中，叛逆性格进一步成长起来。","具有善良淳朴、正直无私和勇敢机智的性格。哈克与奴隶制观念彻底决裂。吉姆：黑人逃奴，不屈不挠地追求自由的精神，善良诚实、忠于友谊；无知迷信。种族歧视对他的压制和扭曲。"],"src":"简析哈克贝利·费恩的人物形象-哈克／马克·吐温长篇小说《哈克贝利·费恩历险记》中的主人公。／美国“文明社会”的叛逆者。在帮助吉姆获得自由的痛苦斗争中，叛逆性格进一步成长起来。／具有善良淳朴、正直无私和勇敢机智的性格。哈克与奴隶制观念彻底决裂。吉姆：黑人逃奴，不屈不挠地追求自由的精神，善良诚实、忠于友谊；无知迷信。种族歧视对他的压制和扭曲。"},{"id":"s00156","type":"short","ch":"第一部分 西方文学 · 第八章 19世纪文学（下）","sec":"","tags":["简答","论述题考点"],"stem":"简述：马克·吐温《哈克贝利·费恩历险记》的艺术特色","points":["总结：是马克·吐温现实主义艺术的高峰，集中反映了马克·吐温的创作特点。","出色地刻画儿童的心理，以孩子稚拙却真实的眼光观察世界，形成了夸张变形而又不失真实的现实景象。","将大量的似乎不登大雅之堂的方言口语写进作品，创造了迥异于欧洲优雅文学的语体风格。风格幽默。➢ 马克·吐温：【2404名词】 十九世纪中后期美国现实主义作家。写作风格幽默、巧妙运用方言土语。代表作品《哈克贝利·费恩历险记》。"],"src":"总结：是马克·吐温现实主义艺术的高峰，集中反映了马克·吐温的创作特点。／出色地刻画儿童的心理，以孩子稚拙却真实的眼光观察世界，形成了夸张变形而又不失真实的现实景象。／将大量的似乎不登大雅之堂的方言口语写进作品，创造了迥异于欧洲优雅文学的语体风格。风格幽默。➢ 马克·吐温：【2404名词】 十九世纪中后期美国现实主义作家。写作风格幽默、巧妙运用方言土语。代表作品《哈克贝利·费恩历险记》。"},{"id":"s00157","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["选择","名词考点"],"stem":"名词解释：“白银时代”","points":["始于1890年，现实主义文学依然繁荣，稍后象征主义、未来主义、阿克梅派等各种流派纷纷登场。文艺政策宽松，国内文坛上涌动着文艺思潮，“无产阶级文化协会”。高尔基是“白银时代”著名的俄罗斯作家，创作活动持续到十月革命后的苏联时代，是俄苏文学的代表作家。"],"src":"始于1890年，现实主义文学依然繁荣，稍后象征主义、未来主义、阿克梅派等各种流派纷纷登场。文艺政策宽松，国内文坛上涌动着文艺思潮，“无产阶级文化协会”。高尔基是“白银时代”著名的俄罗斯作家，创作活动持续到十月革命后的苏联时代，是俄苏文学的代表作家。"},{"id":"s00158","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["选择","名词考点","2310多选"],"stem":"名词解释：长河小说","points":["都是百万字以上的鸿篇巨制，比一般的长篇小说容量更大，展现社会生活画卷更广泛。","描写的往往是整整一代人或几代人的生活与精神面貌，再现法国社会、整个西欧社会的风貌和时代风云，作品具有史诗的壮阔性、历史的深刻性和反映现实生活的宏观性。","代表是罗曼·罗兰的《约翰·克里斯朵夫》、马丁·杜·伽尔的《蒂博一家》。","罗曼·罗兰：法国著名作家，伟大的人道主义者和社会活动家。多部著名人物传记：《贝多芬传》《米开朗基罗传》《托尔斯泰传》《甘地传》。4卷本的长篇小说《欣悦的灵魂》、10卷本的长篇小说《约翰·克里斯朵夫》都是法国“长河小说”的杰作，《约翰·克里斯朵夫》是他的代表作。主人公约翰·克里斯多夫是平民音乐家，也是有着鲜明个人主义色彩的英雄，通过他一生反抗、失败、妥协的经历和遭遇，抨击了艺术因依附于金钱与权势而导致的虚伪与堕落。"],"src":"都是百万字以上的鸿篇巨制，比一般的长篇小说容量更大，展现社会生活画卷更广泛。／描写的往往是整整一代人或几代人的生活与精神面貌，再现法国社会、整个西欧社会的风貌和时代风云，作品具有史诗的壮阔性、历史的深刻性和反映现实生活的宏观性。／代表是罗曼·罗兰的《约翰·克里斯朵夫》、马丁·杜·伽尔的《蒂博一家》。／罗曼·罗兰：法国著名作家，伟大的人道主义者和社会活动家。多部著名人物传记：《贝多芬传》《米开朗基罗"},{"id":"s00159","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["0810名词"],"stem":"名词解释：音乐小说","points":["罗曼·罗兰《约翰·克里斯朵夫》一个非常鲜明的特色就是音乐性，评论界公认为它是一部“音乐小说”。因为这部小说从结构上形式上都具有浓郁的音乐色彩。克里斯朵夫从“诞生、发展、磨难、升华”，四个生命的流程恰好构成了一部交响乐的四个乐章。"],"src":"罗曼·罗兰《约翰·克里斯朵夫》一个非常鲜明的特色就是音乐性，评论界公认为它是一部“音乐小说”。因为这部小说从结构上形式上都具有浓郁的音乐色彩。克里斯朵夫从“诞生、发展、磨难、升华”，四个生命的流程恰好构成了一部交响乐的四个乐章。"},{"id":"s00160","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["选择","名词"],"stem":"名词解释：陌生化效果—“间离效果”","points":["陌生化效果，布莱希特创造的一种艺术方法，即有意识地在角色、演员和观众之间制造感情上的距离。要求演员与角色保持一定的距离，不要融进角色之中，而是高于角色、驾驭角色、表演角色；通过舞台布置和演员表演，在观众与剧情之间制造适当距离，使观众用探讨/批判的态度看剧情，激发他们改变现实的愿望。"],"src":"陌生化效果，布莱希特创造的一种艺术方法，即有意识地在角色、演员和观众之间制造感情上的距离。要求演员与角色保持一定的距离，不要融进角色之中，而是高于角色、驾驭角色、表演角色；通过舞台布置和演员表演，在观众与剧情之间制造适当距离，使观众用探讨/批判的态度看剧情，激发他们改变现实的愿望。"},{"id":"s00161","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["选择","简答"],"stem":"简述：德莱赛《美国的悲剧》的思想内容","points":["《美国的悲剧》：通过写出身贫寒的克莱德被判死刑的悲剧，指出克莱德的悲剧是美国社会的典型性悲剧——在社会等级分化严重、消费文化至上的物质主义时代，一个年轻人紧逐金色的“美国梦”，却一步步沉沦。6.高尔基《克里姆·萨姆金的一生》：被称为“俄罗斯精神生活的编年史”。40年俄国社会的变迁，萨姆金：个人主义者、市侩知识分子的典型；他自私渺小又目空一切，缺乏信仰又怀疑一切，孤芳自赏又才疏学浅，自视清高又灵魂空虚—萨姆金习气。"],"src":"《美国的悲剧》：通过写出身贫寒的克莱德被判死刑的悲剧，指出克莱德的悲剧是美国社会的典型性悲剧——在社会等级分化严重、消费文化至上的物质主义时代，一个年轻人紧逐金色的“美国梦”，却一步步沉沦。6.高尔基《克里姆·萨姆金的一生》：被称为“俄罗斯精神生活的编年史”。40年俄国社会的变迁，萨姆金：个人主义者、市侩知识分子的典型；他自私渺小又目空一切，缺乏信仰又怀疑一切，孤芳自赏又才疏学浅，自视清高又灵魂空"},{"id":"s00162","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["简答题考点"],"stem":"简述：高尔基《母亲》的思想内容（在世界文学史上的地位）","points":["《母亲》的问世，揭开了无产阶级文学的历史新纪元。[思想主题]①第一部重点写巴威尔·符拉索夫在马克思主义理论指导下和革命实践中成长的过程。②第二部通过母亲彼拉盖雅·尼洛夫娜的精神觉醒，描写人民群众在革命运动中所显示的巨大力量。（以1905年俄国革命中的工人运动为背景。）","《母亲》的创作成功，标志着高尔基在艺术反映现实的美学探索中，达到一个新的境界。","《母亲》既有由于残酷的现实所激起的愤世嫉俗和批判激情，又有目睹旧生活秩序的动摇而引发出对未来的憧憬和浪漫主义感受。无论是揭示老一代工人的悲惨命运，还是再现新一代工人的觉醒，高尔基都力求在现实的发展进程中把握现实。"],"src":"《母亲》的问世，揭开了无产阶级文学的历史新纪元。[思想主题]①第一部重点写巴威尔·符拉索夫在马克思主义理论指导下和革命实践中成长的过程。②第二部通过母亲彼拉盖雅·尼洛夫娜的精神觉醒，描写人民群众在革命运动中所显示的巨大力量。（以1905年俄国革命中的工人运动为背景。）／《母亲》的创作成功，标志着高尔基在艺术反映现实的美学探索中，达到一个新的境界。／《母亲》既有由于残酷的现实所激起的愤世嫉俗和批判激"},{"id":"s00163","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["简答题考点"],"stem":"简述：《母亲》的人物形象","points":["分析巴威尔的形象","巴威尔·符拉索夫从一个缺乏阶级意识的工人，成长为具有无产阶级觉悟的新人，每一个步履都洋溢着对未来的憧憬，对阶级力量和智慧的赞美。","整部作品都在写人的成长，表现觉醒后的无产阶级革命者可以焕发出多么大的力量去完成他的历史使命。","符拉索夫的形象，不仅启迪人们憎恶旧社会，而且激发人们向往新生活。在高尔基笔下，无产阶级的社会理想被具体化为生动的艺术形象，无产阶级革命者的英雄形象。"],"src":"分析巴威尔的形象／巴威尔·符拉索夫从一个缺乏阶级意识的工人，成长为具有无产阶级觉悟的新人，每一个步履都洋溢着对未来的憧憬，对阶级力量和智慧的赞美。／整部作品都在写人的成长，表现觉醒后的无产阶级革命者可以焕发出多么大的力量去完成他的历史使命。／符拉索夫的形象，不仅启迪人们憎恶旧社会，而且激发人们向往新生活。在高尔基笔下，无产阶级的社会理想被具体化为生动的艺术形象，无产阶级革命者的英雄形象。"},{"id":"s00164","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["选择","简答"],"stem":"简述：高尔基《母亲》的艺术特点","points":["艺术构思显示出传统与创新的密切结合。","小说的叙事角度也富有现代性。建立起尼洛夫娜的视点，主体性强化，成为叙事的中心。通过她的观察，写儿子巴威尔的觉醒、知识分子和农民的觉醒，各种事件在她内心引起的反响。"],"src":"艺术构思显示出传统与创新的密切结合。／小说的叙事角度也富有现代性。建立起尼洛夫娜的视点，主体性强化，成为叙事的中心。通过她的观察，写儿子巴威尔的觉醒、知识分子和农民的觉醒，各种事件在她内心引起的反响。"},{"id":"s00165","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["名词","简答考点"],"stem":"名词解释：肖洛霍夫短篇小说《一个人的遭遇》（也叫人的命运）","points":["一个普通战士安德烈·索科洛夫的故事。他在卫国战争中经受了集中营生活的考验和亲人相继死亡的痛苦，在非人的环境里他保持了一个战士的高尚品质。战后他收养了一个孤儿，两个人相依为命，继续生活下去。","是对苏联战士不可摧毁的坚毅精神的讴歌，但已不同于从前的玫瑰色的英雄主义，而是关于战争苦难的倾诉，是从人道主义的立场对于战争、对于既往历史的深入思考；为处理战争题材的文学作品开辟了新道路。"],"src":"一个普通战士安德烈·索科洛夫的故事。他在卫国战争中经受了集中营生活的考验和亲人相继死亡的痛苦，在非人的环境里他保持了一个战士的高尚品质。战后他收养了一个孤儿，两个人相依为命，继续生活下去。／是对苏联战士不可摧毁的坚毅精神的讴歌，但已不同于从前的玫瑰色的英雄主义，而是关于战争苦难的倾诉，是从人道主义的立场对于战争、对于既往历史的深入思考；为处理战争题材的文学作品开辟了新道路。"},{"id":"s00166","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["简答题考点"],"stem":"简述：肖洛霍夫《静静的顿河》的思想内容","points":["《静静的顿河》是哥萨克社会历史上的一面镜子，具有深刻的思想内容。它通过20世纪头20年的社会巨变，广泛、深刻、感人地表现了哥萨克的历史命运。","作家在书中着重写的是：在旧政权和新政权、红军和白军、新世界和旧世界斗争过程中，以葛利高里为代表的劳动哥萨克走向新生活的艰难曲折的历史道路和他们中许多人充满迷误和痛苦的悲剧命运，以及在两个时代急剧转变中的整个哥萨克世界。"],"src":"《静静的顿河》是哥萨克社会历史上的一面镜子，具有深刻的思想内容。它通过20世纪头20年的社会巨变，广泛、深刻、感人地表现了哥萨克的历史命运。／作家在书中着重写的是：在旧政权和新政权、红军和白军、新世界和旧世界斗争过程中，以葛利高里为代表的劳动哥萨克走向新生活的艰难曲折的历史道路和他们中许多人充满迷误和痛苦的悲剧命运，以及在两个时代急剧转变中的整个哥萨克世界。"},{"id":"s00167","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1910","0901 简答"],"stem":"简述：《静静的顿河》的人物形象——葛利高里的形象与悲剧意义","points":["葛利高里是一个地道的哥萨克，一个复杂的人物。 [时代复杂因素/社会尖锐矛盾冲突]①具有哥萨克中下层人民的优秀品质，勇敢善战、勤劳热情、诚实正直和富于同情心；②又受到哥萨克落后的传统和道德偏见的影响，盲目崇拜军人荣誉。","是一个爱好思想，勤于探索的年轻人，富有“人的魅力”。","是中农哥萨克的一个独特象征，在歧路上的徘徊，是走上新生活的必不可少的蜕变。","意义：他是鞑靼村哥萨克中最早的觉醒者，又是最迟的归来者。葛利高里堕入匪帮，深刻地说明客观形势的复杂，说明革命过程中某些政策执行者的过激做法会使一个历史包袱过于沉重的优秀哥萨克在人生的迷途中走得很远，要克服这种迷惘和彻底卸掉自己肩上的包袱，又需要付出多么高昂的代价和作出多么重大的牺牲。"],"src":"葛利高里是一个地道的哥萨克，一个复杂的人物。 [时代复杂因素/社会尖锐矛盾冲突]①具有哥萨克中下层人民的优秀品质，勇敢善战、勤劳热情、诚实正直和富于同情心；②又受到哥萨克落后的传统和道德偏见的影响，盲目崇拜军人荣誉。／是一个爱好思想，勤于探索的年轻人，富有“人的魅力”。／是中农哥萨克的一个独特象征，在歧路上的徘徊，是走上新生活的必不可少的蜕变。／意义：他是鞑靼村哥萨克中最早的觉醒者，又是最迟的归来"},{"id":"s00168","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1904 简答","1310","0701 论述"],"stem":"简述：肖洛霍夫《静静的顿河》的艺术成就","points":["这是一部气势雄浑的史诗性作品，作家的笔触伸向了广阔的空间，将波澜壮阔的历史事件与丰富、深邃的人物命运水乳交融。","小说塑造人物形象极其成功。葛利高里的形象塑造得极为鲜明，作家明确表示要通过展示这个形象的“心灵的运动”来体现“人的魅力”。","不仅描写人物感情，而且描绘其复杂而细微的心理变化。","肖洛霍夫描写人物，始终把他们置于社会生活之中，置于大自然的背景之中。在他的作品中，人、社会、自然和谐地构成一个统一体。"],"src":"这是一部气势雄浑的史诗性作品，作家的笔触伸向了广阔的空间，将波澜壮阔的历史事件与丰富、深邃的人物命运水乳交融。／小说塑造人物形象极其成功。葛利高里的形象塑造得极为鲜明，作家明确表示要通过展示这个形象的“心灵的运动”来体现“人的魅力”。／不仅描写人物感情，而且描绘其复杂而细微的心理变化。／肖洛霍夫描写人物，始终把他们置于社会生活之中，置于大自然的背景之中。在他的作品中，人、社会、自然和谐地构成一个统"},{"id":"s00169","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1210 名词","2304 名词"],"stem":"名词解释：“迷惘的一代”","points":["“迷惘的一代”是第一次世界大战后在美国文坛出现的作家群。（一战之后的一代美国青年，信仰崩溃）","他们消极沉闷、生活空虚，被人称为“迷惘的一代”。","代表作家海明威、菲茨杰拉德、帕索斯等。"],"src":"“迷惘的一代”是第一次世界大战后在美国文坛出现的作家群。（一战之后的一代美国青年，信仰崩溃）／他们消极沉闷、生活空虚，被人称为“迷惘的一代”。／代表作家海明威、菲茨杰拉德、帕索斯等。"},{"id":"s00170","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["2104 名词","《老人与海》-2504 名词"],"stem":"名词解释：海明威","points":["海明威：是美国著名作家，1954年诺贝尔文学奖获得者。","除是一位伟大作家外，还是富有传奇色彩的“英雄”，他的一生就是冒险的一生。代表作《老人与海》。16. 海明威《永别了，武器》：","是继《太阳照常升起》之后揭示“迷惘的一代”又一部力作。","主题：通过亨利被战争摧毁的生活，营造了浓郁的反战氛围，控诉了战争的罪恶。","特点：整体采用现实主义的创作手法，平实地叙述故事的内容。创作主题带有明显的现代主义色彩，揭露文明世界的荒诞与无情，人在世界中的绝望与无处可逃。"],"src":"海明威：是美国著名作家，1954年诺贝尔文学奖获得者。／除是一位伟大作家外，还是富有传奇色彩的“英雄”，他的一生就是冒险的一生。代表作《老人与海》。16. 海明威《永别了，武器》：／是继《太阳照常升起》之后揭示“迷惘的一代”又一部力作。／主题：通过亨利被战争摧毁的生活，营造了浓郁的反战氛围，控诉了战争的罪恶。／特点：整体采用现实主义的创作手法，平实地叙述故事的内容。创作主题带有明显的现代主义色彩，"},{"id":"s00171","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1510","2510论述","2310简答"],"stem":"分析海明威《老人与海》中的圣地亚哥形象","points":["海明威所塑造的“硬汉子”形象的代表。[圣地亚哥鲜明地代表了海明威塑造的“硬汉子”的形象]","其性格特点是坚韧刚强，勇敢正直，在肉体上可以被打败，但在精神上绝对不可以被击垮。在圣地亚哥所生活的世界里，结局注定是要走向衰亡。无论他曾经多么强壮，身体却依然无情地老去。但他坚持奋斗与抗争，老人骄傲地说：“然而人不是为失败而生的，一个人可以被毁灭，但不能被打败。”","圣地亚哥坚持奋斗与抗争，体现出了硬汉的价值，维持了人的尊严和意义。硬汉子性格是海明威对待人类命运的基本态度的体现。"],"src":"海明威所塑造的“硬汉子”形象的代表。[圣地亚哥鲜明地代表了海明威塑造的“硬汉子”的形象]／其性格特点是坚韧刚强，勇敢正直，在肉体上可以被打败，但在精神上绝对不可以被击垮。在圣地亚哥所生活的世界里，结局注定是要走向衰亡。无论他曾经多么强壮，身体却依然无情地老去。但他坚持奋斗与抗争，老人骄傲地说：“然而人不是为失败而生的，一个人可以被毁灭，但不能被打败。”／圣地亚哥坚持奋斗与抗争，体现出了硬汉的价值，"},{"id":"s00172","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1510论述","2310简答-可结合圣地亚哥"],"stem":"简述：《老人与海》的人物形象中的硬汉形象","points":["圣地亚哥是西方文学史上的不朽形象之一，最鲜明地代表了海明威所创作的“硬汉”形象。“硬汉”形象是海明威自20年代以来的创作中其笔下所有男性主人公形象。","他们具有的性格特点是坚韧刚强，勇敢正直，面对苦难与折磨毫不惧怕，面对痛苦与死亡面不改色，表现在肉体上可以被打败，但精神上绝不可以被击垮的崇高气概，如《在我们的时代》中的男主人公尼克·亚当斯、《打不败的人》中的斗牛士曼努埃尔、《五百万》中的拳击手杰克、《丧钟为谁而鸣》中的乔丹等。","《老人与海》中的圣地亚哥，是“硬汉”形象的代表。在他所生活的世界里，结局注定是要走向衰亡。无论他曾经多么强壮，身体却依然无情地老去，但他坚持奋斗与抗争，他骄傲地说：“人不是为失败而生的，一个人可以被毁灭，但不能被打败。”正是基于这种悲壮感，他体现出了硬汉的价值，维持了人的尊严和人生的意义。","硬汉性格既是参加过两次世界大战和西班牙内战的海明威本人形象的集中概括，也是他对待人类命运的认知态度的体现。➢ “硬汉子”形象：【1710/1301名词；2310简答】【★★★★★★】","“硬汉子”形象是海明威笔下的系列男性形象。","具有坚韧刚强、勇敢正直，精神上不能被打垮的崇高气概。","《老人与海》中的圣地亚哥是这类形象的代表。"],"src":"圣地亚哥是西方文学史上的不朽形象之一，最鲜明地代表了海明威所创作的“硬汉”形象。“硬汉”形象是海明威自20年代以来的创作中其笔下所有男性主人公形象。／他们具有的性格特点是坚韧刚强，勇敢正直，面对苦难与折磨毫不惧怕，面对痛苦与死亡面不改色，表现在肉体上可以被打败，但精神上绝不可以被击垮的崇高气概，如《在我们的时代》中的男主人公尼克·亚当斯、《打不败的人》中的斗牛士曼努埃尔、《五百万》中的拳击手杰克、"},{"id":"s00173","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["象征意义和艺术风格","简答","论述"],"stem":"简述：海明威《老人与海》的艺术成就","points":["《老人与海》是一部寓意深刻的具有象征意义的作品。【论述《老人与海》的象征意义-2210论述题】①老人圣地亚哥作为“硬汉子”形象的代表，是人类精神的体现，马林鱼是人生理想的象征，老人与大鱼的关系是人类为追求美好生活理想而不息奋斗精神的写照。②大海象征变幻无常的社会生活，鲨鱼象征无法摆脱的悲剧命运，狮子象征勇气和力量。老人与大海的关系以及与鲨鱼的搏斗是人类面对不可知的生活及其命运所表现出的一种积极抗争精神。③已进入老年状态的圣地亚哥作为海明威笔下所有硬汉子形象的代表，他在自然的王国里历经挫折而奋斗不息，也是创作上进入老年的海明威在艺术的王国里奋力拼搏的象征，尽管圣地亚哥梦里的狮子可能不再是威猛的，但却是男子汉威武气概的最好象征。《老人与海》正是海明威在艺术王国中历经失败后所钓到的一条大马林鱼。","《老人与海》是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。"],"src":"《老人与海》是一部寓意深刻的具有象征意义的作品。【论述《老人与海》的象征意义-2210论述题】①老人圣地亚哥作为“硬汉子”形象的代表，是人类精神的体现，马林鱼是人生理想的象征，老人与大鱼的关系是人类为追求美好生活理想而不息奋斗精神的写照。②大海象征变幻无常的社会生活，鲨鱼象征无法摆脱的悲剧命运，狮子象征勇气和力量。老人与大海的关系以及与鲨鱼的搏斗是人类面对不可知的生活及其命运所表现出的一种积极抗争"},{"id":"s00174","type":"short","ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":["1504名词","2008考期名词","2404名词"],"stem":"名词解释：“冰山原则”","points":["海明威在《死在午后》中提出的创作主张，","冰山在海里移动很是庄严宏伟，是因为它只有八分之一露在水面上。","创作风格简约、含蓄、凝练。"],"src":"海明威在《死在午后》中提出的创作主张，／冰山在海里移动很是庄严宏伟，是因为它只有八分之一露在水面上。／创作风格简约、含蓄、凝练。"},{"id":"s00175","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1810论述题"],"stem":"论述现代主义文学基本特征","points":["现代主义文学以表现现代社会人的异化及现代人的孤独感、危机感、荒诞感、悲剧感等现代意识为基本主题。","在人与社会的关系上，现代主义文学从个人角度全面反抗社会。","在人与人的关系上，现代主义文学揭示出人们彼此隔膜、倾轧、无法沟通的可怕图景。","在人与自然（人与自然/人与物质世界/人与人的本性）的关系上，现代主义文学持以全面否定的态度。","在人与自我的关系上，现代主义文学从非理性主义出发，抱以不可知论的态度。艺术方面特色：","表现主观自我，挖掘、展示人的心灵世界，浓郁的非理性色彩和鲜明的主观性、内向性，表现性特征。","善于使用象征、意识流、荒诞等表现手法，以及神话模式进行创作，追求艺术的深度模式。","大胆采用不合逻辑常规的表现形式，醉心于种种形式技巧的创新和实验。","现代主义文学还把“审丑”、“览丑”作为文学创作的主要目的和内容。"],"src":"现代主义文学以表现现代社会人的异化及现代人的孤独感、危机感、荒诞感、悲剧感等现代意识为基本主题。／在人与社会的关系上，现代主义文学从个人角度全面反抗社会。／在人与人的关系上，现代主义文学揭示出人们彼此隔膜、倾轧、无法沟通的可怕图景。／在人与自然（人与自然/人与物质世界/人与人的本性）的关系上，现代主义文学持以全面否定的态度。／在人与自我的关系上，现代主义文学从非理性主义出发，抱以不可知论的态度。艺"},{"id":"s00176","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["简述后期象征主义的特征—1910简答"],"stem":"简述：后期象征主义","points":["后期象征主义出现于第一次世界大战后，20世纪20年代达到高潮，40年代渐近尾声。","后期象征主义的象征主要是理智的象征。","表现人物自我和内心的“最高真实”：采用象征、暗示、隐喻、联想等手法，主张以“客观对应物”把作者“思想知觉化”，强调诗歌的音乐性。代表：英国艾略特、爱尔兰叶芝等。"],"src":"后期象征主义出现于第一次世界大战后，20世纪20年代达到高潮，40年代渐近尾声。／后期象征主义的象征主要是理智的象征。／表现人物自我和内心的“最高真实”：采用象征、暗示、隐喻、联想等手法，主张以“客观对应物”把作者“思想知觉化”，强调诗歌的音乐性。代表：英国艾略特、爱尔兰叶芝等。"},{"id":"s00177","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1704","1904名词"],"stem":"名词解释：表现主义","points":["表现主义是一战前后盛行于欧美的现代主义文学流派。","认为艺术“是表现，不是再现”。","广泛借鉴各种表现手法。","代表作家有卡夫卡、奥尼尔等。"],"src":"表现主义是一战前后盛行于欧美的现代主义文学流派。／认为艺术“是表现，不是再现”。／广泛借鉴各种表现手法。／代表作家有卡夫卡、奥尼尔等。"},{"id":"s00178","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["选择","名词"],"stem":"名词解释：超现实主义","points":["超现实主义直接脱胎于“达达主义”现代主义文学流派。 （达达主义：一战间欧美的现代主义文艺流派）","受弗洛伊德精神分析学、柏格森直觉主义哲学影响，推崇痴迷“梦幻”。代表作家：布勒东《娜佳》。"],"src":"超现实主义直接脱胎于“达达主义”现代主义文学流派。 （达达主义：一战间欧美的现代主义文艺流派）／受弗洛伊德精神分析学、柏格森直觉主义哲学影响，推崇痴迷“梦幻”。代表作家：布勒东《娜佳》。"},{"id":"s00179","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["选择","名词"],"stem":"名词解释：未来主义","points":["是欧洲现代工业和科学技术高速发展的产物。提倡“现代精神”，崇拜物质文明。","代表：意大利的马里内蒂、法国的阿波里奈尔、俄国的马雅可夫斯基等。"],"src":"是欧洲现代工业和科学技术高速发展的产物。提倡“现代精神”，崇拜物质文明。／代表：意大利的马里内蒂、法国的阿波里奈尔、俄国的马雅可夫斯基等。"},{"id":"s00180","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1510名词","2510名词"],"stem":"名词解释：意识流小说","points":["20世纪20-40年代流行于欧美的一种现代主义小说流派。","主张“作家退出小说”，以“心理时间”表现人物的思想意识活动和主观感受；大量采用自由联想、内心独白、时序倒置等手法进行创作。","主要作家有普鲁斯特、乔伊斯、福克纳以及沃尔夫等人。【1604多选】"],"src":"20世纪20-40年代流行于欧美的一种现代主义小说流派。／主张“作家退出小说”，以“心理时间”表现人物的思想意识活动和主观感受；大量采用自由联想、内心独白、时序倒置等手法进行创作。／主要作家有普鲁斯特、乔伊斯、福克纳以及沃尔夫等人。【1604多选】"},{"id":"s00181","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["名词考点"],"stem":"名词解释：《尤利西斯》","points":["乔伊斯成名作/代表作。艺术家斯蒂芬与报馆广告承揽员布鲁姆相遇，找到精神寄托。","书名源自古《奥德修纪》中的英雄奥德修，结构写法上也多处模拟《奥德修纪》。","《尤利西斯》的艺术成就：【0901简答题】整部作品没有完整的故事情节，事件的发生也没有明确的时间顺序和逻辑联系；内心独白的系统运用；平行和类比手法的运用；集多种文体之大成；结构的奇特。"],"src":"乔伊斯成名作/代表作。艺术家斯蒂芬与报馆广告承揽员布鲁姆相遇，找到精神寄托。／书名源自古《奥德修纪》中的英雄奥德修，结构写法上也多处模拟《奥德修纪》。／《尤利西斯》的艺术成就：【0901简答题】整部作品没有完整的故事情节，事件的发生也没有明确的时间顺序和逻辑联系；内心独白的系统运用；平行和类比手法的运用；集多种文体之大成；结构的奇特。"},{"id":"s00182","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["选择","1804名词"],"stem":"名词解释：存在主义文学","points":["20世纪30年代末期产生于法国的现代主义文学流派。","以文学形式宣传存在主义哲学思想，表现世界荒诞、人生痛苦。","代表作家萨特等。 代表作家：萨特、加缪、波伏娃、梅勒"],"src":"20世纪30年代末期产生于法国的现代主义文学流派。／以文学形式宣传存在主义哲学思想，表现世界荒诞、人生痛苦。／代表作家萨特等。 代表作家：萨特、加缪、波伏娃、梅勒"},{"id":"s00183","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1710简答","2410论述"],"stem":"简述：艾略特《荒原》的主要思想内容","points":["“荒原”与“拯救”是作品的基本主题。题目直喻西方社会缺乏生机、荒芜衰败的“荒原”状态。共五个章节：《死者的葬仪》《对弈》《火诫》《水里的死亡》《雷霆的话》。","第一到第四章描写荒原景观，揭示现代人浑浑噩噩的生活。","第五章转向宗教拯救，以皈依宗教拯救西方社会。","反映了一战后西方社会的“荒原”现实和人们空虚颓废、苦闷绝望的情绪，体现了作者企图从宗教中寻求出路、拯救西方社会的愿望。"],"src":"“荒原”与“拯救”是作品的基本主题。题目直喻西方社会缺乏生机、荒芜衰败的“荒原”状态。共五个章节：《死者的葬仪》《对弈》《火诫》《水里的死亡》《雷霆的话》。／第一到第四章描写荒原景观，揭示现代人浑浑噩噩的生活。／第五章转向宗教拯救，以皈依宗教拯救西方社会。／反映了一战后西方社会的“荒原”现实和人们空虚颓废、苦闷绝望的情绪，体现了作者企图从宗教中寻求出路、拯救西方社会的愿望。"},{"id":"s00184","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1301简答","2410论述"],"stem":"简述：艾略特《荒原》的艺术特色","points":["《荒原》采用神话模式进行创作，提供深层结构框架。圣杯故事的影子。","创造性地运用象征手法。【0910简答—简述《荒原》中象征手法的运用】①典故典义的使用、意象的营造与象征的使用密切结合。②长诗的题目、各章的标题以及题词有一定的象征性，作品的神话学框架、中心意象“荒原”以及水、火、雷霆等意象，都有深刻的象征意义。","独特的意象系列。","广征博引，大量用典。","运用意识流手法。","语言上进行创新，大量采用悖论的修辞手法，以造成强烈而奇特的艺术效果。"],"src":"《荒原》采用神话模式进行创作，提供深层结构框架。圣杯故事的影子。／创造性地运用象征手法。【0910简答—简述《荒原》中象征手法的运用】①典故典义的使用、意象的营造与象征的使用密切结合。②长诗的题目、各章的标题以及题词有一定的象征性，作品的神话学框架、中心意象“荒原”以及水、火、雷霆等意象，都有深刻的象征意义。／独特的意象系列。／广征博引，大量用典。／运用意识流手法。／语言上进行创新，大量采用悖论的"},{"id":"s00185","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["2410单选"],"stem":"简述：卡夫卡《城堡》","points":["《城堡》主题内容：是一个有关现代人在荒诞世界中生存状态的寓言。K是作者、犹太人，更是整个现代人的象征，表现了人与社会冲突对立、现代人精神危机的主题。","《城堡》的寓意：尚无定论。类如父权的绝对权威或敌对的异己力量、其专制统治象征着“整个世界秩序”或“奥匈帝国官僚制度”；难以企及难得谋面的上帝、可望而不可即的真理；犹太人难以回归的家园、城堡就是作者父亲的出生地沃塞克。","艺术：具有强烈的荒诞虚幻的色彩；采用漫画夸张式的手法写人状物/叙述故事。"],"src":"《城堡》主题内容：是一个有关现代人在荒诞世界中生存状态的寓言。K是作者、犹太人，更是整个现代人的象征，表现了人与社会冲突对立、现代人精神危机的主题。／《城堡》的寓意：尚无定论。类如父权的绝对权威或敌对的异己力量、其专制统治象征着“整个世界秩序”或“奥匈帝国官僚制度”；难以企及难得谋面的上帝、可望而不可即的真理；犹太人难以回归的家园、城堡就是作者父亲的出生地沃塞克。／艺术：具有强烈的荒诞虚幻的色彩；"},{"id":"s00186","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1604简答","2110论述"],"stem":"简述：卡夫卡《变形记》的主题·如何理解《变形记》的异化主题","points":["通过主人公变成甲虫的荒诞故事，对资本主义社会中人的“异化”现象作出深刻揭示。","格里高尔失去了自由的天性、思考的自由，实际上早已变成一个“非人”。","反映了资本主义社会是一个缺乏人情的冷漠世界。"],"src":"通过主人公变成甲虫的荒诞故事，对资本主义社会中人的“异化”现象作出深刻揭示。／格里高尔失去了自由的天性、思考的自由，实际上早已变成一个“非人”。／反映了资本主义社会是一个缺乏人情的冷漠世界。"},{"id":"s00187","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1210","2304论述"],"stem":"简述：《变形记》艺术特点","points":["以《变形记》为例，阐述卡夫卡式小说风格","《变形记》具有现代主义与现实主义相交融的特色。","通过现实与虚幻、总体荒诞与细节真实的有机结合，表现人的异化主题。作者把荒诞的故事和真实的细节描写有机结合起来，以荒诞的手法构建故事，表现人的异化主题；又以真实的细节描写增强故事的“可信性”和艺术吸引力。对现实的真实描写与虚幻的故事情景设置有机相融。","用寓意和象征的手法，表现作者对社会人生的理解和体悟，也不拒斥现实主义小说创作的人物塑造、编织故事的艺术传统。是“卡夫卡式”小说风格的典型体现。14. 萨特《墙》：","《墙》：参与革命的三个人一起被关押在临时的牢房里，被宣判死刑。","《墙》的“自由选择”主题：【2204简答】①“我”进行了“自由选择”，却仍然遭遇了逆转或颠覆。②“我”发现生与死之间如一“墙”之隔，“我”获得了自由，其实不是本意，却成了“我”自由选择的结果。③“墙”在这里是重要的象征，表明存在的无可逃避。"],"src":"以《变形记》为例，阐述卡夫卡式小说风格／《变形记》具有现代主义与现实主义相交融的特色。／通过现实与虚幻、总体荒诞与细节真实的有机结合，表现人的异化主题。作者把荒诞的故事和真实的细节描写有机结合起来，以荒诞的手法构建故事，表现人的异化主题；又以真实的细节描写增强故事的“可信性”和艺术吸引力。对现实的真实描写与虚幻的故事情景设置有机相融。／用寓意和象征的手法，表现作者对社会人生的理解和体悟，也不拒斥现"},{"id":"s00188","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["1810简答题"],"stem":"简析萨特《禁闭》的思想内容","points":["《禁闭》是萨特“境遇剧”的代表作，思想意义在于通过这一幕发生在地狱的故事，仍然延续了“墙”与“自由选择”的主题，却以荒诞的形式指明自由对于我们每个人的重要性，指明以行动改变生存状况的重要性。","如果不行动，不找到自己的自由所在，同时也不想方设法改变与人敌对的环境，那么“他人就是地狱”，自己犹如地狱一样。"],"src":"《禁闭》是萨特“境遇剧”的代表作，思想意义在于通过这一幕发生在地狱的故事，仍然延续了“墙”与“自由选择”的主题，却以荒诞的形式指明自由对于我们每个人的重要性，指明以行动改变生存状况的重要性。／如果不行动，不找到自己的自由所在，同时也不想方设法改变与人敌对的环境，那么“他人就是地狱”，自己犹如地狱一样。"},{"id":"s00189","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["名词","简答考点"],"stem":"名词解释：萨特《禁闭》“境遇剧”","points":["存在主义戏剧一般都是“境遇剧”（自由剧）。即设置一个封闭式的环境，总是直接地进入戏剧冲突，较少作更多的铺垫。让环境支配人物，让人物在特定环境中选择自己的行动，造就自己的本质。冲突往往在两个层面上展开，一是人物与外部环境之间的冲突，二是人物内心的冲突。","作家往往把重心放在第二个层面上，突出人在困境中进行“自由选择”的主题，这种戏剧就是“境遇剧”，又名“自由剧”。极端的境遇往往能最大限度地拷问人物，逼迫其“自由选择”的展开。","《禁闭》的“地狱”就是其中一种极端境遇，象征了这种存在主义的观念。一方面指过于依附他人的人注定只能生活在地狱里，另一方面指这样的人实际上就已是死人。《禁闭》是“境遇剧”的代表作【2310单选】，思想意义在于通过这一幕发生在地狱里的故事，延续了“自由选择”的主题。"],"src":"存在主义戏剧一般都是“境遇剧”（自由剧）。即设置一个封闭式的环境，总是直接地进入戏剧冲突，较少作更多的铺垫。让环境支配人物，让人物在特定环境中选择自己的行动，造就自己的本质。冲突往往在两个层面上展开，一是人物与外部环境之间的冲突，二是人物内心的冲突。／作家往往把重心放在第二个层面上，突出人在困境中进行“自由选择”的主题，这种戏剧就是“境遇剧”，又名“自由剧”。极端的境遇往往能最大限度地拷问人物，逼"},{"id":"s00190","type":"short","ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":["简答","论述考点"],"stem":"简述：萨特《禁闭》的艺术特色","points":["构思奇特，故事发生的场景被限定在所谓的“地狱”中。","成功地渲染了地狱境遇的极端特点。","戏剧的象征性。"],"src":"构思奇特，故事发生的场景被限定在所谓的“地狱”中。／成功地渲染了地狱境遇的极端特点。／戏剧的象征性。"},{"id":"s00191","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1001","1410","2210名词"],"stem":"名词解释：荒诞派戏剧","points":["荒诞派戏剧是 20 世纪 50 年代初期出现于法国的一个文学流派。","在内容上表现世界不可理喻，人生荒诞不经；艺术手法上打破传统的戏剧结构，用不合逻辑的情节、性格破碎的人物形象、机械重复的戏剧动作和枯燥乏味的语言，表现世界荒诞的主题。","代表人物有尤奈斯库、贝克特等。（尤奈斯库《秃头歌女》、贝克特《等待戈多》）"],"src":"荒诞派戏剧是 20 世纪 50 年代初期出现于法国的一个文学流派。／在内容上表现世界不可理喻，人生荒诞不经；艺术手法上打破传统的戏剧结构，用不合逻辑的情节、性格破碎的人物形象、机械重复的戏剧动作和枯燥乏味的语言，表现世界荒诞的主题。／代表人物有尤奈斯库、贝克特等。（尤奈斯库《秃头歌女》、贝克特《等待戈多》）"},{"id":"s00192","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1404名词"],"stem":"名词解释：新小说派","points":["20 世纪 50 年代兴起于法国的小说流派。","摒弃情节和人物，以物代人。","代表作家罗伯-格里耶。20 世纪法国文学中被称为“反小说派”或“拒绝派”。"],"src":"20 世纪 50 年代兴起于法国的小说流派。／摒弃情节和人物，以物代人。／代表作家罗伯-格里耶。20 世纪法国文学中被称为“反小说派”或“拒绝派”。"},{"id":"s00193","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1201","2010名词","2410名词"],"stem":"名词解释：“黑色幽默”","points":["“黑色幽默”是 20 世纪 60 年代兴起于美国的小说流派。","它受存在主义哲学思想的影响，善于使用喜剧形式表现悲剧内容。","其代表作家有海勒等。代表作海勒的《第二十二条军规》。"],"src":"“黑色幽默”是 20 世纪 60 年代兴起于美国的小说流派。／它受存在主义哲学思想的影响，善于使用喜剧形式表现悲剧内容。／其代表作家有海勒等。代表作海勒的《第二十二条军规》。"},{"id":"s00194","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1001","0701名词","2410单选"],"stem":"名词解释：魔幻现实主义","points":["“魔幻现实主义”是 20 世纪上半期拉丁美洲的一个文学流派。","通过带有原始色彩的魔幻般的知觉感受，表现生活现实。","代表作家有加西亚·马尔克斯及《百年孤独》等。表现拉美人民苦难的历史，揭露黑暗现实，抨击本国独裁政治和外国侵略势力，探索民族的出路和未来。 代表作家有加西亚·马尔克斯、阿斯图里亚斯、卡彭铁尔、鲁尔弗等。"],"src":"“魔幻现实主义”是 20 世纪上半期拉丁美洲的一个文学流派。／通过带有原始色彩的魔幻般的知觉感受，表现生活现实。／代表作家有加西亚·马尔克斯及《百年孤独》等。表现拉美人民苦难的历史，揭露黑暗现实，抨击本国独裁政治和外国侵略势力，探索民族的出路和未来。 代表作家有加西亚·马尔克斯、阿斯图里亚斯、卡彭铁尔、鲁尔弗等。"},{"id":"s00195","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["选择","名词"],"stem":"名词解释：女性主义文学","points":["自觉从女性立场出发，认真思考女性在社会中的身份和角色问题，并以女性所特有的细腻笔触，敏锐地表现知识女性的生存困境和迷惘。多丽丝·莱辛五部曲《暴力的孩子们》和《金色笔记》等作品"],"src":"自觉从女性立场出发，认真思考女性在社会中的身份和角色问题，并以女性所特有的细腻笔触，敏锐地表现知识女性的生存困境和迷惘。多丽丝·莱辛五部曲《暴力的孩子们》和《金色笔记》等作品"},{"id":"s00196","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["选择","名词"],"stem":"名词解释：后殖民文学","points":["二战后，随着后殖民主义理论的兴起，与此相关的后殖民主义文学及其作家开始出现在西方文坛，其关注的重点是反思被殖民国家在文化、语言、知识和文化霸权等方面受到殖民者的影响和渗透，追寻民族文化传统成为后殖民文学的显著特征，与此相关的是少数族裔文学的兴起。","战后英美文坛上异军突起的非裔、亚裔、印第安裔等少数族裔的作家，以极富特色的素材和表现手法为英美文学创作注入活力，其中石黑一雄和奈保尔成就突出。"],"src":"二战后，随着后殖民主义理论的兴起，与此相关的后殖民主义文学及其作家开始出现在西方文坛，其关注的重点是反思被殖民国家在文化、语言、知识和文化霸权等方面受到殖民者的影响和渗透，追寻民族文化传统成为后殖民文学的显著特征，与此相关的是少数族裔文学的兴起。／战后英美文坛上异军突起的非裔、亚裔、印第安裔等少数族裔的作家，以极富特色的素材和表现手法为英美文学创作注入活力，其中石黑一雄和奈保尔成就突出。"},{"id":"s00197","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["选择","名词"],"stem":"名词解释：“解冻” 思潮","points":["1953 年苏联政局变化，“解冻”思潮是以爱伦堡的中篇小说《解冻》命名的。描写工厂厂长茹拉夫廖夫这个“官僚主义者”典型，反映了苏联社会的不正常现象。干预生活、写阴暗面、表现重大的社会政治问题，关注人物命运的创作倾向，被称为“解冻文学”思潮。","“解冻”思潮中引起轰动效应的两部分小说：《日瓦戈医生》《伊凡·杰尼索维奇的一天》。"],"src":"1953 年苏联政局变化，“解冻”思潮是以爱伦堡的中篇小说《解冻》命名的。描写工厂厂长茹拉夫廖夫这个“官僚主义者”典型，反映了苏联社会的不正常现象。干预生活、写阴暗面、表现重大的社会政治问题，关注人物命运的创作倾向，被称为“解冻文学”思潮。／“解冻”思潮中引起轰动效应的两部分小说：《日瓦戈医生》《伊凡·杰尼索维奇的一天》。"},{"id":"s00198","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["选择","1310 名词"],"stem":"名词解释：“战壕真实派”","points":["“战壕真实派”是苏联 50 年代中期一批真实描写战地生活作家的特称。","代表作家有邦达列夫等。（邦达列夫：《营请求火力支援》《最后的炮轰》）","其创作尽力突出战壕真实，渲染战争的残酷，突出普通人在战争中的不幸。其他代表作品：巴克拉诺夫《一寸土》；贝科夫《第三颗信号弹》。"],"src":"“战壕真实派”是苏联 50 年代中期一批真实描写战地生活作家的特称。／代表作家有邦达列夫等。（邦达列夫：《营请求火力支援》《最后的炮轰》）／其创作尽力突出战壕真实，渲染战争的残酷，突出普通人在战争中的不幸。其他代表作品：巴克拉诺夫《一寸土》；贝科夫《第三颗信号弹》。"},{"id":"s00199","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["选择","名词考点"],"stem":"名词解释：“全景文学”","points":["60-70 年代，将“战壕真实”与“司令部真实”结合，对战争过程进行广阔的全景性描写，出现叙说战争的长篇巨著——“全景小说”。","主要有：邦达列夫《热的雪》；恰科夫斯基《围困》；斯塔德纽克《战争》。代表作：西蒙诺夫的战争三部曲《生者与死者》《军人不是天生的》《最后一个夏天》","写前沿阵地浴血搏斗的士兵，高级指挥员，反映战争全貌，对历史事件进行综合概括，表现出当代人对历史事件的规律性认识；气势磅礴的历史画卷。"],"src":"60-70 年代，将“战壕真实”与“司令部真实”结合，对战争过程进行广阔的全景性描写，出现叙说战争的长篇巨著——“全景小说”。／主要有：邦达列夫《热的雪》；恰科夫斯基《围困》；斯塔德纽克《战争》。代表作：西蒙诺夫的战争三部曲《生者与死者》《军人不是天生的》《最后一个夏天》／写前沿阵地浴血搏斗的士兵，高级指挥员，反映战争全貌，对历史事件进行综合概括，表现出当代人对历史事件的规律性认识；气势磅礴的历史"},{"id":"s00200","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1504","1110 简答","2310 名词"],"stem":"名词解释：贝克特《等待戈多》的思想和象征意义","points":["两个流浪汉焦虑徒劳的等待，象征性地概括了人类生存状况，表现世界的荒诞和人生的痛苦。","表现了人们渴望改变自己的处境，但又难以实现的无可奈何的心理。","戈多的象征意义是多重的、开放的。《等待戈多》的思想意义：【0810 简答】【★★★★★★】","《等待戈多》是一部反传统反理性的剧作。","呈现在我们面前的是一个非理性的世界。","通过两个流浪汉永无休止而又毫无希望的等待，揭示了世界的荒诞与人生的痛苦，表现了现代西方人希望改变自己的生活处境但又难以实现的绝望心理。“戈多”存在于他们内心，是极度空虚的心灵所需求的一个外化物。明知“戈多”不会来，还要痛苦无奈地等待下去，这是信仰危机时代一种悲剧式人生态度的体现。"],"src":"两个流浪汉焦虑徒劳的等待，象征性地概括了人类生存状况，表现世界的荒诞和人生的痛苦。／表现了人们渴望改变自己的处境，但又难以实现的无可奈何的心理。／戈多的象征意义是多重的、开放的。《等待戈多》的思想意义：【0810 简答】【★★★★★★】／《等待戈多》是一部反传统反理性的剧作。／呈现在我们面前的是一个非理性的世界。／通过两个流浪汉永无休止而又毫无希望的等待，揭示了世界的荒诞与人生的痛苦，表现了现代西"},{"id":"s00201","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述考点"],"stem":"简述：贝克特《等待戈多》的艺术特色","points":["剧本的构思极为奇特，全剧只有两幕，但没有情节。两个流浪汉弗拉季米尔和爱斯特拉冈在荒野路旁的枯树下等待他们的戈多。","《等待戈多》在艺术上对传统有不少突破。作者找到“荒诞”这种艺术形式表达深刻思想，但是这部戏剧有着很强的喜剧潜能。作品用对比的手法表现喜剧的潜能。","成功地运用了荒诞离奇、没有逻辑的语言。对白莫名其妙，表示人与人之间的难以沟通。幸运儿的长篇独白是这部戏中的精彩内容。","剧本突出的是种“等待意识”。整部戏剧富有极强的象征意味。"],"src":"剧本的构思极为奇特，全剧只有两幕，但没有情节。两个流浪汉弗拉季米尔和爱斯特拉冈在荒野路旁的枯树下等待他们的戈多。／《等待戈多》在艺术上对传统有不少突破。作者找到“荒诞”这种艺术形式表达深刻思想，但是这部戏剧有着很强的喜剧潜能。作品用对比的手法表现喜剧的潜能。／成功地运用了荒诞离奇、没有逻辑的语言。对白莫名其妙，表示人与人之间的难以沟通。幸运儿的长篇独白是这部戏中的精彩内容。／剧本突出的是种“等待意"},{"id":"s00202","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1604 名词"],"stem":"名词解释：加西亚·马尔克斯","points":["是拉丁美洲“魔幻现实主义小说”的杰出代表。","哥伦比亚作家，曾获得诺贝尔文学奖。","其创作有《百年孤独》《霍乱时期的爱情》等。"],"src":"是拉丁美洲“魔幻现实主义小说”的杰出代表。／哥伦比亚作家，曾获得诺贝尔文学奖。／其创作有《百年孤独》《霍乱时期的爱情》等。"},{"id":"s00203","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述","2404 论述"],"stem":"简述：加西亚·马尔克斯《百年孤独》的思想内容","points":["小说人物众多，内容复杂，情节离奇，手法新颖。①通过描写马孔多的小镇由兴起到消失的全过程，展示了移民拓荒、殖民掠夺、独立革命、党派斗争、连年内战、外国势力入侵、新工业兴起等历史变迁。②这些内容堪称拉丁美洲社会发展的真实写照，反映了愚昧与文明并存的现实，揭露和批判了外国殖民主义者对哥伦比亚和拉丁美洲人民的政治压迫与经济掠夺。③小说反映的是作者对拉美民族的历史和生存状态深刻而独到的思考。【结合孤独主题】","《百年孤独》的孤独主题。【★★★★★】①《百年孤独》的主题是孤独。既指个体性情上的孤独，也指群体精神上的孤独。个体的孤独，造成了普遍的愚昧、落后、保守。面对外来文明的冲击，人们抛弃了传统的价值观念、宗教信仰和文化习俗，疯狂地执着于贪欲、情欲的追求和满足。因个体孤独而产生的冷漠与绝望，使家族里充满了怪异的疯狂和激情的乱伦，毁灭是其必然的结局。②孤独的产生既有家族内在的原因，也是外部势力影响的结果。布恩迪亚家族的道路是拉美人民苦难经历的曲折反应，其历史也是拉丁美洲的历史缩影。③马尔克斯通过《百年孤独》大胆暴露人们普遍具有的落后、不健康的心理，面对不断变化的世界表现出强烈的危机感。","简述《百年孤独》的主题。【1201 简答-小蒋说：作为补充和参考】【★★★★★】","表现了“拉丁美洲的孤独”。","描写了百年间布恩蒂亚家族七代人所经历的种种抗争、努力、挫折和失败，这正是哥伦比亚和拉丁美洲愚昧落后的真实写照，是与世隔绝和被殖民历史的再现。","体现了作者的良苦用心，希望这一百年的不幸故事不再重演。> 论述马尔克斯《百年孤独》的思想内容。【2404 论述题答案】【★★★★★】","通过描写马孔多小镇由兴起到消失的过程，反映了作者对拉美民族的历史和生存状态的思考。","通过孤独主题，暴露了人们普遍具有的落后、不健康的心理，面对不断变化的世界表现出强烈的危机感。"],"src":"小说人物众多，内容复杂，情节离奇，手法新颖。①通过描写马孔多的小镇由兴起到消失的全过程，展示了移民拓荒、殖民掠夺、独立革命、党派斗争、连年内战、外国势力入侵、新工业兴起等历史变迁。②这些内容堪称拉丁美洲社会发展的真实写照，反映了愚昧与文明并存的现实，揭露和批判了外国殖民主义者对哥伦比亚和拉丁美洲人民的政治压迫与经济掠夺。③小说反映的是作者对拉美民族的历史和生存状态深刻而独到的思考。【结合孤独主题】"},{"id":"s00204","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["1610 论述","2010 考期简答"],"stem":"简述：加西亚·马尔克斯《百年孤独》的艺术特色","points":["魔幻现实主义是这篇小说的主要艺术特色。结合了魔幻与现实，用魔幻的成分丰富了现实。神奇的细节、离奇的叙述所达到的效果是把现实里的“现实因素”放大，以一种魔幻的方式突出了现实本身。①内容处处有魔幻色彩，最生动的有梅尔加德斯幽灵的不断出现，雷贝卡的到来导致马孔多长达数月的失眠等；②写作技巧同时含有现实的关怀。马孔多从原始进入文明，气愤地参加内战，承受资本主义残酷掠夺的压迫（尤其是香蕉园的开发），遭遇无情的屠杀，这些都是拉丁美洲历史进程的写照。","独特的叙事手法。有两种主要的时间叙事，一是线性的现实时间，即从创建马孔多的第一代开始，一直讲到第七代。二是循环的魔幻时间，即每一代的布恩迪亚都在以某种方式重复着前辈人的言行。","环形结构的采用。从大的方面看，马孔多从无到有，再从有到无，百年之中，从起点回到起点。布恩迪亚家族的先人，曾因近亲结合生下一个带尾巴的孩子，这才导致了老布恩迪亚的出走和马孔多的建立。","象征和暗示手法的大量运用。使这部小说的寓意表现得更加深刻。如俏姑娘雷麦黛丝象征着美，她的升天象征了美的消失；带猪尾巴的孩子象征了生活现实中的某些畸形事物等。小说中关于健忘症的描写最具象征意义，暗示了以马孔多人代表的现代人，忘记了赖以生存的文化根脉和传统。","马尔克斯通过关于布恩蒂亚家族的黑色寓言故事，以语言游戏的方式把拉丁美洲的历史放进马孔多小镇里，讲述了拉丁美洲对自由、民主与富强的渴望以及孜孜不倦的追求。"],"src":"魔幻现实主义是这篇小说的主要艺术特色。结合了魔幻与现实，用魔幻的成分丰富了现实。神奇的细节、离奇的叙述所达到的效果是把现实里的“现实因素”放大，以一种魔幻的方式突出了现实本身。①内容处处有魔幻色彩，最生动的有梅尔加德斯幽灵的不断出现，雷贝卡的到来导致马孔多长达数月的失眠等；②写作技巧同时含有现实的关怀。马孔多从原始进入文明，气愤地参加内战，承受资本主义残酷掠夺的压迫（尤其是香蕉园的开发），遭遇无情"},{"id":"s00205","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述"],"stem":"简述：索尔·贝娄《赫索格》的思想内容/主题","points":["《赫索格》的主题一个是反映美国中产阶级知识分子在现代社会中的迷茫和苦闷。","揭示现代西方文明进程中的人道主义危机是小说《赫索格》的另一个主题。","赫索格是西方现代知识分子的典型形象，也是一位极具自我嘲讽和反讽意味的人物。"],"src":"《赫索格》的主题一个是反映美国中产阶级知识分子在现代社会中的迷茫和苦闷。／揭示现代西方文明进程中的人道主义危机是小说《赫索格》的另一个主题。／赫索格是西方现代知识分子的典型形象，也是一位极具自我嘲讽和反讽意味的人物。"},{"id":"s00206","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述"],"stem":"简述：索尔·贝娄《赫索格》中赫索格的人物形象","points":["赫索格是西方现代知识分子的典型形象，也是一位极具自我嘲讽和反讽意味的人物。","赫索格的失败，代表了作家贝娄对现实生活中以他为代表的所谓功成名就的社会上层人士的讽刺，也有对自己的类似的亲身经历的自嘲。","赫索格是一位“非传统英雄式的主角”，他的精神危机也是一种时代病，具有普遍性和永恒性，是当时社会许多知识分子状态的真实写照。"],"src":"赫索格是西方现代知识分子的典型形象，也是一位极具自我嘲讽和反讽意味的人物。／赫索格的失败，代表了作家贝娄对现实生活中以他为代表的所谓功成名就的社会上层人士的讽刺，也有对自己的类似的亲身经历的自嘲。／赫索格是一位“非传统英雄式的主角”，他的精神危机也是一种时代病，具有普遍性和永恒性，是当时社会许多知识分子状态的真实写照。"},{"id":"s00207","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述"],"stem":"简述：索尔·贝娄《赫索格》的艺术特色","points":["采用了对比的手法。","独特的意识流手法的使用。","对“信”的独特使用。作家则通过赫索格把现实和书写这两张网连接起来。一方面可以灵活地通过赫索格的“信”大书特书对西方现代文明的种种不满和看法，另一方面用现代艺术手法激活了文学史上古老传统的书信体叙事模式。同时“把写信这种直接内心独白和用第三人称写的间接内心独白交织在一起，再加上内心交谈等手法”，都赋予了书信体文学新的艺术活力，从而使小说获得了成功。"],"src":"采用了对比的手法。／独特的意识流手法的使用。／对“信”的独特使用。作家则通过赫索格把现实和书写这两张网连接起来。一方面可以灵活地通过赫索格的“信”大书特书对西方现代文明的种种不满和看法，另一方面用现代艺术手法激活了文学史上古老传统的书信体叙事模式。同时“把写信这种直接内心独白和用第三人称写的间接内心独白交织在一起，再加上内心交谈等手法”，都赋予了书信体文学新的艺术活力，从而使小说获得了成功。"},{"id":"s00208","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["名词","简答"],"stem":"名词解释：奈保尔——印度三部曲","points":["印度三部曲：游记类作品是奈保尔创作的另一种类型，其代表作是“印度三部曲”具体指的是《幽暗国度》(1964)、《印度：受伤的文明》(1979)和《印度：百万叛变的今天》(1990)这3部游记，创作时间长达26年，记录了奈保尔以归国游子的视角3次游历母国印度的所见所闻、所思所想。《幽暗国度》：无情地揭露了印度的贫穷、肮脏、混乱与落后。《印度：受伤的文明》：从文化和历史的深处挖掘母国印度愚昧、消极和发展停滞的原因，指出印度始终沉浸在自己辉煌的历史和浓厚的宗教中，厚古薄今、蒙蔽智识、麻痹痛苦，对今日现实中的贫穷与落后无动于衷。《印度：百万叛变的今天》：全新的写法，旁观者的角度+母国本土人当局者的视角，口述史和旅行写作两种艺术形式结合，叛变运动-改革终究体现了印度社会的进步。"],"src":"印度三部曲：游记类作品是奈保尔创作的另一种类型，其代表作是“印度三部曲”具体指的是《幽暗国度》(1964)、《印度：受伤的文明》(1979)和《印度：百万叛变的今天》(1990)这3部游记，创作时间长达26年，记录了奈保尔以归国游子的视角3次游历母国印度的所见所闻、所思所想。《幽暗国度》：无情地揭露了印度的贫穷、肮脏、混乱与落后。《印度：受伤的文明》：从文化和历史的深处挖掘母国印度愚昧、消极和发展"},{"id":"s00209","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述"],"stem":"简述：奈保尔《河湾》的思想内容/主题","points":["揭示在欧洲殖民者撤走后，处于后殖民时代的非洲新独立国家的动乱与困境。","展现移民面临的文化冲突和流亡人、边缘人的不幸际遇。故事的主人公和叙事者叫萨林姆，萨林姆是一个没有家的人，一个漂泊的无根人，一代流亡知识分子的化身。"],"src":"揭示在欧洲殖民者撤走后，处于后殖民时代的非洲新独立国家的动乱与困境。／展现移民面临的文化冲突和流亡人、边缘人的不幸际遇。故事的主人公和叙事者叫萨林姆，萨林姆是一个没有家的人，一个漂泊的无根人，一代流亡知识分子的化身。"},{"id":"s00210","type":"short","ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":["简答","论述"],"stem":"简述：奈保尔《河湾》的艺术特色-象征手法","points":["《河湾》最引人注目的艺术特色是象征手法的使用。两个鲜明的象征：“大人物、水葫芦”。","“大人物”就是后殖民时期极权主义统治的缩影与象征。“大人物”是非洲中部新近独立的一个国家的总统，尽管他穿着华贵、仪表堂堂、举手投足模仿戴高乐的风度，但是他“金玉其外，败絮其中”，徒有其表而没有治理国家的本领。","“水葫芦”的意象贯穿了《河湾》整部小说的始终——“水葫芦”的象征有多层含义。①一是象征着新生事物。共和国独立后的河湾小镇，大量的新事物涌入如同“水葫芦”的侵入，让当地人措手不及、无所适从。它象征当时的非洲人无力辨别和接受新事物，反而会被新事物困住了手脚。②二是象征着历史的见证者。“水葫芦”见证了河湾小镇的历史变迁，见证了后殖民时代非洲第三世界国家人们生活的变化、动荡与不安。人们如同“水葫芦”一样漫无目的地飘荡，看不到出路，也没有未来与希望。"],"src":"《河湾》最引人注目的艺术特色是象征手法的使用。两个鲜明的象征：“大人物、水葫芦”。／“大人物”就是后殖民时期极权主义统治的缩影与象征。“大人物”是非洲中部新近独立的一个国家的总统，尽管他穿着华贵、仪表堂堂、举手投足模仿戴高乐的风度，但是他“金玉其外，败絮其中”，徒有其表而没有治理国家的本领。／“水葫芦”的意象贯穿了《河湾》整部小说的始终——“水葫芦”的象征有多层含义。①一是象征着新生事物。共和国独"},{"id":"s00211","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["1201","1101 简答","0510 多选","2404 简答"],"stem":"简述古代东方文学的主要特征","points":["鲜明的民间文学色彩。","强烈的宗教色彩。","体裁丰富，有多种源头。"],"src":"鲜明的民间文学色彩。／强烈的宗教色彩。／体裁丰富，有多种源头。"},{"id":"s00212","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["选择","名词","0710 名词"],"stem":"名词解释：《吉尔伽美什》","points":["《吉尔伽美什》是古巴比伦神话故事的总汇，是两河流域早期文明的结晶，是世界上迄今发现最早的完整的英雄史诗，在世界古代文学史上具有特殊的意义。","世界文学中最古老的史诗，由 12 块泥板组成，达到苏美尔—巴比伦文学的最高峰。","对后世西亚文学产生一定的影响，间接影响到希腊神话、荷马史诗及希伯来的《旧约》等人类早期文学。"],"src":"《吉尔伽美什》是古巴比伦神话故事的总汇，是两河流域早期文明的结晶，是世界上迄今发现最早的完整的英雄史诗，在世界古代文学史上具有特殊的意义。／世界文学中最古老的史诗，由 12 块泥板组成，达到苏美尔—巴比伦文学的最高峰。／对后世西亚文学产生一定的影响，间接影响到希腊神话、荷马史诗及希伯来的《旧约》等人类早期文学。"},{"id":"s00213","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["1510 名词","2304 名词"],"stem":"名词解释：《亡灵书》","points":["《亡灵书》又译为《死者之书》，是古埃及最有代表性的作品，是古埃及文学的汇编。[纸草保存]","《亡灵书》反映了古埃及人企图将生命的荣华富贵延续到后世的幻想。"],"src":"《亡灵书》又译为《死者之书》，是古埃及最有代表性的作品，是古埃及文学的汇编。[纸草保存]／《亡灵书》反映了古埃及人企图将生命的荣华富贵延续到后世的幻想。"},{"id":"s00214","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["1810 名词","0810 名词—高频选择"],"stem":"名词解释：《吠陀》","points":["“吠陀”是古印度文学最早出现的诗体文献；是古代印度婆罗门教的经典。","以人生与宗教为主题的抒情诗；记录了印度上古时期的巫术、宗教、哲学等内容。","主要包括《梨俱吠陀》《阿闼婆吠陀》（古老诗歌总集）、《娑摩吠陀》《夜柔吠陀》"],"src":"“吠陀”是古印度文学最早出现的诗体文献；是古代印度婆罗门教的经典。／以人生与宗教为主题的抒情诗；记录了印度上古时期的巫术、宗教、哲学等内容。／主要包括《梨俱吠陀》《阿闼婆吠陀》（古老诗歌总集）、《娑摩吠陀》《夜柔吠陀》"},{"id":"s00215","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["2010 考期多选","名词","简答考点"],"stem":"名词解释：印度两大史诗","points":["印度出现了两大史诗《摩诃婆罗多》和《罗摩衍那》。","《摩诃婆罗多》意即“伟大的婆罗多族的传说”，一部以英雄史诗为核心的长诗；","《罗摩衍那》意即“罗摩漫游的故事”。","思想内容：颂扬传说中的民族英雄的业绩，宣扬当时那些有识之士的生活理想。"],"src":"印度出现了两大史诗《摩诃婆罗多》和《罗摩衍那》。／《摩诃婆罗多》意即“伟大的婆罗多族的传说”，一部以英雄史诗为核心的长诗；／《罗摩衍那》意即“罗摩漫游的故事”。／思想内容：颂扬传说中的民族英雄的业绩，宣扬当时那些有识之士的生活理想。"},{"id":"s00216","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["1210","1910 简答"],"stem":"简述：希伯来文学——《旧约》的基本内容","points":["《旧约》是犹太教的经典，也是希伯来民族文学和历史的文化总集。【2410 单选】","共 39 卷，分为律法书、历史书、先知书和诗文集四个部分。《雅歌》【1404 名词】【★★★】《旧约》中的诗歌作品；写青年男女之间的爱情；大胆直率，热情奔放。➢ 《雅歌》的爱情主题：《雅歌》又称“歌中之歌”，是一组热情奔放的抒情歌集，主要内容是描写青年男女之间的爱情。如牧女舒拉密对自由、真挚爱情的热情向往与追求。➢ 《路得记》的和平主题：","摩押女子路得两次同希伯来人结婚，家庭美满，左邻右舍无不称赞的动人故事，","借古讽今，来宣扬民族间的友好、团结、互助，","批判了狭隘的民族排他主义，表现一种和平主题。➢ 《以斯帖记》的爱国主题：","希伯来少女以斯帖冒死向国王揭露了宰相哈曼企图杀害希伯来人的阴谋，并得到国王保护的故事。","宣扬爱国主题。表达作者爱国家爱民族的思想，号召人民团结起来斗争，争取胜利。"],"src":"《旧约》是犹太教的经典，也是希伯来民族文学和历史的文化总集。【2410 单选】／共 39 卷，分为律法书、历史书、先知书和诗文集四个部分。《雅歌》【1404 名词】【★★★】《旧约》中的诗歌作品；写青年男女之间的爱情；大胆直率，热情奔放。➢ 《雅歌》的爱情主题：《雅歌》又称“歌中之歌”，是一组热情奔放的抒情歌集，主要内容是描写青年男女之间的爱情。如牧女舒拉密对自由、真挚爱情的热情向往与追求。➢ 《"},{"id":"s00217","type":"short","ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":["2010 简答","1001 简答"],"stem":"简述《旧约》的文学特色","points":[ 简析中古东方文学的主要特征","points":["中古东方文学创作空前繁荣，多民族文学共同兴旺的大好局面。","各民族文学相互交流，互相影响，促成了东方中古文学的大发展。","民间文学发达，成为中古东方文学的重要组成部分。民歌/民谣，民间故事/戏剧。"],"src":"中古东方文学创作空前繁荣，多民族文学共同兴旺的大好局面。／各民族文学相互交流，互相影响，促成了东方中古文学的大发展。／民间文学发达，成为中古东方文学的重要组成部分。民歌/民谣，民间故事/戏剧。"},{"id":"s00222","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1604 名词"],"stem":"名词解释：《万叶集》","points":["日本的第一部和歌总集。","为了与汉诗相区别，日本人将用大和文写的诗歌称为和歌。","著名诗人有山上忆良《贫穷问答歌》（下层民众）等。"],"src":"日本的第一部和歌总集。／为了与汉诗相区别，日本人将用大和文写的诗歌称为和歌。／著名诗人有山上忆良《贫穷问答歌》（下层民众）等。"},{"id":"s00223","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["名词考点"],"stem":"名词解释：物语文学","points":["即虚构的文学作品。","日本物语文学分两类：以《伊势物语》为代表的围绕和歌为中心的“歌物语”，以《竹取物语》为代表的富于传奇色彩的“传奇物语”。都用假名文字，《竹取物语》受到唐传奇的影响。","11世纪初《源氏物语》是最高成就。"],"src":"即虚构的文学作品。／日本物语文学分两类：以《伊势物语》为代表的围绕和歌为中心的“歌物语”，以《竹取物语》为代表的富于传奇色彩的“传奇物语”。都用假名文字，《竹取物语》受到唐传奇的影响。／11世纪初《源氏物语》是最高成就。"},{"id":"s00224","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1310","1201 名词"],"stem":"名词解释：俳句","points":["是日本江户时期诗歌方面的重要代表。一般俳句有三句，每句分别有5、7、5个音节。","每首俳句共17个音节，是世界上最短小的诗歌。俳句的重要代表是被称为“俳圣”的松尾芭蕉。"],"src":"是日本江户时期诗歌方面的重要代表。一般俳句有三句，每句分别有5、7、5个音节。／每首俳句共17个音节，是世界上最短小的诗歌。俳句的重要代表是被称为“俳圣”的松尾芭蕉。"},{"id":"s00225","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["名词"],"stem":"名词解释：“柔巴依”","points":["伊朗的四行诗译为“柔巴依”，这种传统的诗歌形式与中国的绝句相类似，形式短小、便于抒情。"],"src":"伊朗的四行诗译为“柔巴依”，这种传统的诗歌形式与中国的绝句相类似，形式短小、便于抒情。"},{"id":"s00226","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1804 名词"],"stem":"名词解释：“悬诗”","points":["代表了阿拉伯蒙昧时期诗歌创作的最高成就。每年在欧卡兹集市上举行赛诗会，获选诗作书写悬挂于“克尔白”天房。主要写凭吊、爱情、游历、自然风光等内容，最著名的悬诗诗人是乌鲁勒·盖斯。"],"src":"代表了阿拉伯蒙昧时期诗歌创作的最高成就。每年在欧卡兹集市上举行赛诗会，获选诗作书写悬挂于“克尔白”天房。主要写凭吊、爱情、游历、自然风光等内容，最著名的悬诗诗人是乌鲁勒·盖斯。"},{"id":"s00227","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1504名解"],"stem":"简述：《古兰经》","points":["阿拉伯文学史上第一部成文的散文巨著。包含信仰/礼仪/风俗习惯/教法教规与教义原则等。","实际是伊斯兰教的神圣经典，穆斯林世界观、人生观和价值观的体现。","语言简洁生动，文辞流畅华美。","古代阿拉伯文化的集大成之作。"],"src":"阿拉伯文学史上第一部成文的散文巨著。包含信仰/礼仪/风俗习惯/教法教规与教义原则等。／实际是伊斯兰教的神圣经典，穆斯林世界观、人生观和价值观的体现。／语言简洁生动，文辞流畅华美。／古代阿拉伯文化的集大成之作。"},{"id":"s00228","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["2008考期名词"],"stem":"名词解释：紫式部","points":["日本平安时期的女作家，因《源氏物语》而享誉世界9.《源氏物语》在世界文学史上的地位：","紫式部的代表作《源氏物语》是日本物语文学的集大成之作，被认为是世界上最早出现的长篇小说，是日本女性文学史上的扛鼎之作（女性特有的细腻心理表白）。","成就了日本专门研究《源氏物语》的“源学”的形成。"],"src":"日本平安时期的女作家，因《源氏物语》而享誉世界9.《源氏物语》在世界文学史上的地位：／紫式部的代表作《源氏物语》是日本物语文学的集大成之作，被认为是世界上最早出现的长篇小说，是日本女性文学史上的扛鼎之作（女性特有的细腻心理表白）。／成就了日本专门研究《源氏物语》的“源学”的形成。"},{"id":"s00229","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1910名词"],"stem":"名词解释：《源氏物语》","points":["日本平安时期物语文学的集大成之作。","作者紫式部。","通过主人公光源氏政治上的沉浮和情感上的悲欢，展示了平安王朝宫廷贵族的生活与命运。"],"src":"日本平安时期物语文学的集大成之作。／作者紫式部。／通过主人公光源氏政治上的沉浮和情感上的悲欢，展示了平安王朝宫廷贵族的生活与命运。"},{"id":"s00230","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1310简答题"],"stem":"简述：紫式部《源氏物语》的主题思想","points":["通过对源氏政治上的沉浮、毁誉及渔色追欢的描绘，展示了平安时期宫廷贵族的错综复杂的权势之争。","揭露了宫廷大贵族糜烂的男女关系，反映出平安时期上层贵族政治上的腐朽和精神上的堕落。","揭示出整个平安贵族走向没落的必然命运。"],"src":"通过对源氏政治上的沉浮、毁誉及渔色追欢的描绘，展示了平安时期宫廷贵族的错综复杂的权势之争。／揭露了宫廷大贵族糜烂的男女关系，反映出平安时期上层贵族政治上的腐朽和精神上的堕落。／揭示出整个平安贵族走向没落的必然命运。"},{"id":"s00231","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["简答题考点"],"stem":"简述：紫式部《源氏物语》的艺术特色","points":["精细刻画人物性格。","用环境描写来渲染、烘托气氛，浓郁的抒情性。","语言典雅华丽、优美丰富，插入抒情诗歌。如和歌/古代名歌/汉诗，加强感染力。","结构的缀联形式。全书54卷，每卷独立又连绵不断，将光源氏祖孙三代的生活片断缀联成一部生活史。13.《源氏物语》的人物形象：➢ 简析紫式部《源氏物语》中的光源氏形象。【1704简答题】【★★★★★】","日本平安时期大贵族的典型形象。","出身皇室，美貌多情，多才多艺。","卷入宫廷政治，升迁起伏。","体现贵族没落的命运。[被美化，多情善良]➢ 《源氏物语》贵族妇女形象：【2310多选】","生活充满怨恨和痛苦。如地方官妻子空蝉、前太子妃寡妇六条御息所、妃子藤壶中宫、上层贵族妇女三宫、浮舟等。上层贵族妇女三宫是门阀政治婚姻的牺牲者的典型。","无幸福自由，在嫉恨/懊恼的悲叹中度日，任人摆布的可怜虫。（一夫多妻制度）","用“宿世业缘”的观念麻痹自己，用“出家为尼”否定自己，用“投河自尽”消极反抗。作品价值：透过妇女清认识到平安贵族阶级的腐朽丑恶，批判精神。"],"src":"精细刻画人物性格。／用环境描写来渲染、烘托气氛，浓郁的抒情性。／语言典雅华丽、优美丰富，插入抒情诗歌。如和歌/古代名歌/汉诗，加强感染力。／结构的缀联形式。全书54卷，每卷独立又连绵不断，将光源氏祖孙三代的生活片断缀联成一部生活史。13.《源氏物语》的人物形象：➢ 简析紫式部《源氏物语》中的光源氏形象。【1704简答题】【★★★★★】／日本平安时期大贵族的典型形象。／出身皇室，美貌多情，多才多艺。"},{"id":"s00232","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["0901名词"],"stem":"名词解释：《一千零一夜》","points":["《一千零一夜》是阿拉伯古代的民间故事集，被称为“民间文学的一座丰碑”。","它集中体现了古代阿拉伯民族的文化精神，也是阿拉伯人民审美理想的集中体现。","被高尔基称世界民间文学创作中“最壮丽的一座纪念碑”。《阿拉伯之夜》《天方夜谭》《辛伯达航海旅行的故事》：辛伯达发展海外贸易/7次航海旅行/永不满足的顽强进取精神/新兴商人创业本质。"],"src":"《一千零一夜》是阿拉伯古代的民间故事集，被称为“民间文学的一座丰碑”。／它集中体现了古代阿拉伯民族的文化精神，也是阿拉伯人民审美理想的集中体现。／被高尔基称世界民间文学创作中“最壮丽的一座纪念碑”。《阿拉伯之夜》《天方夜谭》《辛伯达航海旅行的故事》：辛伯达发展海外贸易/7次航海旅行/永不满足的顽强进取精神/新兴商人创业本质。"},{"id":"s00233","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["0910","2104简答","2510简答"],"stem":"简述：《一千零一夜》的思想内容","points":["赞颂人民在与邪恶势力斗争中所表现出的惊人智慧和才能。","揭露了统治者贪婪丑恶的本质。","讴歌青年男女之间正当、纯洁的爱情。","反映广大人民普遍置身其中的艰苦环境，尤其是商人经商冒险的生活。"],"src":"赞颂人民在与邪恶势力斗争中所表现出的惊人智慧和才能。／揭露了统治者贪婪丑恶的本质。／讴歌青年男女之间正当、纯洁的爱情。／反映广大人民普遍置身其中的艰苦环境，尤其是商人经商冒险的生活。"},{"id":"s00234","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["1604","1101简答"],"stem":"简述：《一千零一夜》的艺术特点","points":["浓郁的东方情调和大胆的浪漫幻想。（波斯商人戴缠头/阿拉伯女郎蒙面纱/神灯）","框架式结构。【简答】全书以山鲁佐德给国王讲故事开篇，所有故事在大框架之内，大故事套小故事，由一个故事引出另一个故事，层层叠套，上下衔接，前后呼应，形成连续不断又紧密相通的艺术整体。","诗文并茂、散韵结合的表现手法。（通俗易懂白话、民间口语、穿插吟歌/吟诗）","成就：以其独特的艺术魅力流传到世界各地。"],"src":"浓郁的东方情调和大胆的浪漫幻想。（波斯商人戴缠头/阿拉伯女郎蒙面纱/神灯）／框架式结构。【简答】全书以山鲁佐德给国王讲故事开篇，所有故事在大框架之内，大故事套小故事，由一个故事引出另一个故事，层层叠套，上下衔接，前后呼应，形成连续不断又紧密相通的艺术整体。／诗文并茂、散韵结合的表现手法。（通俗易懂白话、民间口语、穿插吟歌/吟诗）／成就：以其独特的艺术魅力流传到世界各地。"},{"id":"s00235","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["简答题考点"],"stem":"简述：萨迪《蔷薇园》的人道主义思想","points":["对下层人民的深切同情，诗人讴歌他们自食其力的优秀品德；","忧国忧民，他告诫统治者要仁慈，不可残暴欺压剥削人民，揭露宗教上层人士的虚伪和欺骗人民的伎俩。","作品也流露出诗人思想中的矛盾。同情广大民众的呐喊是对统治者的警告，强调人民的力量是希望统治者能正视政权的基础。"],"src":"对下层人民的深切同情，诗人讴歌他们自食其力的优秀品德；／忧国忧民，他告诫统治者要仁慈，不可残暴欺压剥削人民，揭露宗教上层人士的虚伪和欺骗人民的伎俩。／作品也流露出诗人思想中的矛盾。同情广大民众的呐喊是对统治者的警告，强调人民的力量是希望统治者能正视政权的基础。"},{"id":"s00236","type":"short","ch":"第二部分 东方文学 · 第十三章 中古文学","sec":"","tags":["简答题考点"],"stem":"简述：萨迪《蔷薇园》的艺术特点","points":["题材摄取的广泛性。一幅五光十色的大千世界的绚丽画图。","散韵结合，诗文并茂，寓哲理于形象思维中的表达技巧。"],"src":"题材摄取的广泛性。一幅五光十色的大千世界的绚丽画图。／散韵结合，诗文并茂，寓哲理于形象思维中的表达技巧。"},{"id":"s00237","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["1510","2110 简答","2504 简答"],"stem":"简述东方近代文学的基本特征","points":["鲜明的政治倾向性。","在发展过程中受西方各种思潮的影响很大，一些国家文学社团林立，流派众多，变幻不定。","作家数量剧增，作品数量增多，影响扩大，成果显著。","近代东方文学在亚洲各民族文学发展史上具有重大的承前启后的意义。"],"src":"鲜明的政治倾向性。／在发展过程中受西方各种思潮的影响很大，一些国家文学社团林立，流派众多，变幻不定。／作家数量剧增，作品数量增多，影响扩大，成果显著。／近代东方文学在亚洲各民族文学发展史上具有重大的承前启后的意义。"},{"id":"s00238","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["名词","2304 简答"],"stem":"名词解释：日本自然主义文学","points":["简述日本自然主义文学的特征","受西方19世纪下半期批判现实主义文学的影响，改矫揉造作、热衷于浮词丽句的文风，着重表现生活的真实；标志日本近代文学走向成熟。","语言：摒弃文言文，明白晓畅的口语，对日本近代文学语言的形成与发展做贡献。","代表作家岛崎藤村《破戒》、田山花袋《棉被》、德天秋声、正宗白鸟。【1904 多选】"],"src":"简述日本自然主义文学的特征／受西方19世纪下半期批判现实主义文学的影响，改矫揉造作、热衷于浮词丽句的文风，着重表现生活的真实；标志日本近代文学走向成熟。／语言：摒弃文言文，明白晓畅的口语，对日本近代文学语言的形成与发展做贡献。／代表作家岛崎藤村《破戒》、田山花袋《棉被》、德天秋声、正宗白鸟。【1904 多选】"},{"id":"s00239","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["选择","名词"],"stem":"名词解释：唯美主义（派）","points":["与日本自然主义文学对立，受欧洲影响，日本出现唯美主义思潮。","以杂志《昴mào星》的创作为标志，主张艺术至上，追求文学技巧的完美，重视个人感觉，表现在官能享受中的快乐和精神满足。","代表作家：永井荷风、谷崎润一郎。"],"src":"与日本自然主义文学对立，受欧洲影响，日本出现唯美主义思潮。／以杂志《昴mào星》的创作为标志，主张艺术至上，追求文学技巧的完美，重视个人感觉，表现在官能享受中的快乐和精神满足。／代表作家：永井荷风、谷崎润一郎。"},{"id":"s00240","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["1301 名词"],"stem":"名词解释：白桦派","points":["日本近代文学流派。由文艺刊物《白桦》周围作家组成。","早期有理想主义倾向，以表现自我、肯定自我为主。","后期人道主义思想加强，强调人的尊严和意志。创作严肃/尊重个性自由/不愿束缚。"],"src":"日本近代文学流派。由文艺刊物《白桦》周围作家组成。／早期有理想主义倾向，以表现自我、肯定自我为主。／后期人道主义思想加强，强调人的尊严和意志。创作严肃/尊重个性自由/不愿束缚。"},{"id":"s00241","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["1704 名词"],"stem":"名词解释：新思潮派","points":["也称新现实主义，日本近代文学流派，由文坛上第三/四次《新思潮》杂志的同仁组成。","代表作家是芥川龙之介《河童》和菊池宽《父归》等。","关注现实，注重对平凡人日常生活和复杂心理的描写，并进行一定的批评和理性的解释。"],"src":"也称新现实主义，日本近代文学流派，由文坛上第三/四次《新思潮》杂志的同仁组成。／代表作家是芥川龙之介《河童》和菊池宽《父归》等。／关注现实，注重对平凡人日常生活和复杂心理的描写，并进行一定的批评和理性的解释。"},{"id":"s00242","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":[],"stem":"简述：夏目漱石《我是猫》的思想内容","points":["> 《我是猫》的批判性：【简答】：","鞭挞资本主义社会的丑恶事物，通过金田老爷揭露他“穷凶极恶/又贪又狠”的罪恶本质和拜金主义的社会风气。[未发现变革社会的强大力量，前途悲观/对未来失望]","对整个明治社会的黑暗和罪恶，以及反动统治的基础，进行了深刻的揭露与抨击。","对侵略扩张的军国主义、脱离实际的教育制度进行嘲弄，反映明治时期社会风貌。🞂 《我是猫》猫的典型意义：【简答】：","“猫”：第一人称的“我”，被赋予了人的理智和思想感情，一只有人的心理、意识和猫的生理、形貌的高度人格化的猫。识字/读报/喜怒哀乐/七情六欲/凡人习性。","完全不受人的活动所限，以旁观者的姿态看到人性的愚昧虚伪和自私自利，实际是作者的代言人，以表示作者对资本家及其走狗的深恶痛绝。","书中的猫：“掌握了通心术”的猫，“奉天之命作脑力工化而出现于这个世界的古今独步的灵猫”。通过作者的出色描写，它成为书中重要的活灵活现的艺术形象。"],"src":"> 《我是猫》的批判性：【简答】：／鞭挞资本主义社会的丑恶事物，通过金田老爷揭露他“穷凶极恶/又贪又狠”的罪恶本质和拜金主义的社会风气。[未发现变革社会的强大力量，前途悲观/对未来失望]／对整个明治社会的黑暗和罪恶，以及反动统治的基础，进行了深刻的揭露与抨击。／对侵略扩张的军国主义、脱离实际的教育制度进行嘲弄，反映明治时期社会风貌。🞂 《我是猫》猫的典型意义：【简答】：／“猫”：第一人称的“我”，"},{"id":"s00243","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["简答","论述"],"stem":"简述：夏目漱石《我是猫》的人物形象","points":["分析苦沙弥形象及其典型意义","苦沙弥：生活在日本明治“文明开化”社会里的有闲而无钱的知识分子。是日本小资产阶级知识分子的典型代表。","对丑恶的资本主义制度不满又无可奈何。借古喻今/嘲讽世俗/以泄其愤/打发无聊","为人善良，不求荣迁，安贫乐道。厌恶权势与资本家，蔑视金钱与资本家的走狗。","没有地位，虚张声势，无力捍卫自我尊严。缺乏明确生活目标和进取精神，对不良现象不满又不知如何是好，斗争无用武之地。","丑恶的生存环境使他常为小事而大动肝火，以致苦闷无奈。","苦沙弥这一形象是明治时期正直知识分子情绪的反映和他们的典型。"],"src":"分析苦沙弥形象及其典型意义／苦沙弥：生活在日本明治“文明开化”社会里的有闲而无钱的知识分子。是日本小资产阶级知识分子的典型代表。／对丑恶的资本主义制度不满又无可奈何。借古喻今/嘲讽世俗/以泄其愤/打发无聊／为人善良，不求荣迁，安贫乐道。厌恶权势与资本家，蔑视金钱与资本家的走狗。／没有地位，虚张声势，无力捍卫自我尊严。缺乏明确生活目标和进取精神，对不良现象不满又不知如何是好，斗争无用武之地。／丑恶的"},{"id":"s00244","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["1410简答"],"stem":"简述夏目漱石《我是猫》的艺术特色","points":["不注重情节的统一与完整，像海参一样无头无尾。","采用第一人称的写法。以猫为叙述者，随心所欲地表达作者对客观事物的认识和态度。","塑造了活灵活现的猫的形象。","体现了幽默讽刺的风格。小说继承了日本古典文学中讽刺传统，如插科打诨、猫态猫语。","汲取英国 18 世纪小说中的讽刺艺术。","语言平白、通俗，有生活气息。🞂 夏目漱石：【2204 名词/2504 名词】日本近代著名现实主义作家。长篇讽刺小说《我是猫》集中描写明治时期的知识分子和资本家，批判社会的黑暗和罪恶，结构独特。 其创作拓宽了日本近代文学的表现领域。"],"src":"不注重情节的统一与完整，像海参一样无头无尾。／采用第一人称的写法。以猫为叙述者，随心所欲地表达作者对客观事物的认识和态度。／塑造了活灵活现的猫的形象。／体现了幽默讽刺的风格。小说继承了日本古典文学中讽刺传统，如插科打诨、猫态猫语。／汲取英国 18 世纪小说中的讽刺艺术。／语言平白、通俗，有生活气息。🞂 夏目漱石：【2204 名词/2504 名词】日本近代著名现实主义作家。长篇讽刺小说《我是猫》集中"},{"id":"s00245","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["2204 简答"],"stem":"简述：泰戈尔诗集《吉檀迦利》","points":["简述《吉檀迦利》的思想内容","印度近代作家泰戈尔 1913 年获得诺贝尔文学奖的宗教抒情诗集/宗教哲理诗集。","通过对神的礼赞，表达了美好的生活理想和爱国热情。（印度语“奉献”）","表现自己的爱国热忱、美好的生活理想和“泛爱”的人道主义理想。"],"src":"简述《吉檀迦利》的思想内容／印度近代作家泰戈尔 1913 年获得诺贝尔文学奖的宗教抒情诗集/宗教哲理诗集。／通过对神的礼赞，表达了美好的生活理想和爱国热情。（印度语“奉献”）／表现自己的爱国热忱、美好的生活理想和“泛爱”的人道主义理想。"},{"id":"s00246","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["简答"],"stem":"简述：泰戈尔小说《戈拉》的人物形象","points":["中心人物戈拉：印度资产阶级民族主义者和爱国主义者的典型。","作为激烈的爱国知识分子，他有强烈的爱国心和民族壮志。从孩子头目发展为印度教青年教徒的领袖。","坚信祖国会独立和自由，采取积极的行动为之奋斗，生活的唯一目标是要解放祖国。宁死不屈/正直不阿/三次面对面和英国殖民者斗争/被捕入狱不低头/没有丝毫奴颜婢膝。","性格矛盾：他持有宗教偏见，认为只有无条件遵守印度教的一切传统，群众才不会忘记印度光荣的过去/不会崇洋媚外/失去自己的民族自信心；为印度教落后反动传统辩护（种姓制度/偶像崇拜/妇女无权），严格遵守印度教的教规。最终现实教育使他放弃偏见，树立为全印度人民造福的思想。","认识到印度人民要独立，就要同时反封建、冲破种姓制度的束缚、不分宗教信仰，团结一致才能战胜敌人。"],"src":"中心人物戈拉：印度资产阶级民族主义者和爱国主义者的典型。／作为激烈的爱国知识分子，他有强烈的爱国心和民族壮志。从孩子头目发展为印度教青年教徒的领袖。／坚信祖国会独立和自由，采取积极的行动为之奋斗，生活的唯一目标是要解放祖国。宁死不屈/正直不阿/三次面对面和英国殖民者斗争/被捕入狱不低头/没有丝毫奴颜婢膝。／性格矛盾：他持有宗教偏见，认为只有无条件遵守印度教的一切传统，群众才不会忘记印度光荣的过去/"},{"id":"s00247","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["选择","简答"],"stem":"简述：泰戈尔小说《戈拉》的思想内容","points":["主题：通过《戈拉》歌颂了新印度教徒戈拉反对殖民主义压迫、热爱祖国的思想，歌颂他对祖国必然获得自由的坚定信念，也批判了他仍维护种姓制度，遵守印度教各种腐朽传统的错误做法。泰戈尔通过戈拉的形象，表达他自己反对帝国主义、反对复古主义和种姓制度的主张。"],"src":"主题：通过《戈拉》歌颂了新印度教徒戈拉反对殖民主义压迫、热爱祖国的思想，歌颂他对祖国必然获得自由的坚定信念，也批判了他仍维护种姓制度，遵守印度教各种腐朽传统的错误做法。泰戈尔通过戈拉的形象，表达他自己反对帝国主义、反对复古主义和种姓制度的主张。"},{"id":"s00248","type":"short","ch":"第二部分 东方文学 · 第十四章 近代文学","sec":"","tags":["1810简答"],"stem":"简述：泰戈尔小说《戈拉》的艺术特点","points":["故事情节在尖锐的矛盾冲突中展开，塑造戈拉、苏查丽妲等动人形象。","人物对话富有论辩性。","人物形象对比鲜明。","小说具有优美的抒情的格调。","小说心理描写也很成功。运用心理描写巧妙暗示戈拉和苏查丽妲之间的爱情发生、发展、矛盾和痛苦。"],"src":"故事情节在尖锐的矛盾冲突中展开，塑造戈拉、苏查丽妲等动人形象。／人物对话富有论辩性。／人物形象对比鲜明。／小说具有优美的抒情的格调。／小说心理描写也很成功。运用心理描写巧妙暗示戈拉和苏查丽妲之间的爱情发生、发展、矛盾和痛苦。"},{"id":"s00249","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["简答题考点"],"stem":"简析现代东方文学的特征","points":["反对侵略反对压迫为各国文学的共同主题。","一些国家形成了有共同思想的文学社团，开展有组织的文学活动。","以现实主义为主的表现手法。大多数作家力求创作的真实。"],"src":"反对侵略反对压迫为各国文学的共同主题。／一些国家形成了有共同思想的文学社团，开展有组织的文学活动。／以现实主义为主的表现手法。大多数作家力求创作的真实。"},{"id":"s00250","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["1904名词","2404名词"],"stem":"名词解释：新感觉派","points":["是日本现代文坛上的一个文学流派。其创作在相当程度上接受了西方现代主义文学的影响，企图以新感觉、新认识、新表现来革新文学。","代表作家有横光利一、川端康成等。"],"src":"是日本现代文坛上的一个文学流派。其创作在相当程度上接受了西方现代主义文学的影响，企图以新感觉、新认识、新表现来革新文学。／代表作家有横光利一、川端康成等。"},{"id":"s00251","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["1410名词","2110名词"],"stem":"名词解释：旅美派","points":["旅美派是由旅居美洲的阿拉伯作家组成的现代文学流派。","黎巴嫩诗人纪伯伦是其重要作家，代表作是散文诗集《先知》。"],"src":"旅美派是由旅居美洲的阿拉伯作家组成的现代文学流派。／黎巴嫩诗人纪伯伦是其重要作家，代表作是散文诗集《先知》。"},{"id":"s00252","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["1610名词","2210名词"],"stem":"名词解释：“埃及现代派”","points":["“埃及现代派”是第一次世界大战后形成于埃及的现实主义文学流派。形成于埃及，扩大到叙利亚。","代表作家塔哈·侯赛因，自传体小说《日子》被誉为阿拉伯地区现代文学的典范。"],"src":"“埃及现代派”是第一次世界大战后形成于埃及的现实主义文学流派。形成于埃及，扩大到叙利亚。／代表作家塔哈·侯赛因，自传体小说《日子》被誉为阿拉伯地区现代文学的典范。"},{"id":"s00253","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["1301","2410简答"],"stem":"简述普列姆昌德小说《戈丹》的思想内容","points":["揭示了农村尖锐的社会矛盾，是描写印度农村生活的一部史诗。揭露批判印度封建农村形形色色的压迫者和剥削者的丑恶嘴脸。地主老爷、高利贷者、资本家等。","何利个人的苦难史是当时印度农村广大农民普遍的苦难史。","反映了作者对社会问题的探索精神及深刻理解。"],"src":"揭示了农村尖锐的社会矛盾，是描写印度农村生活的一部史诗。揭露批判印度封建农村形形色色的压迫者和剥削者的丑恶嘴脸。地主老爷、高利贷者、资本家等。／何利个人的苦难史是当时印度农村广大农民普遍的苦难史。／反映了作者对社会问题的探索精神及深刻理解。"},{"id":"s00254","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["1404","1904简答"],"stem":"简述：普列姆昌德小说《戈丹》的人物形象","points":["简析何利形象","主人公何利勤劳善良，富有同情心，宁肯自己受损失，也不让别人吃亏。","终生受地主和高利贷者的压迫/剥削，变相卖女儿，至死也不明白自己受苦的原因。","由于宗教思想的束缚，他还相信宿命论，认为“命中注定享福的才能享福”。","他胆小怕事又很软弱，害怕地主和官府，无力反抗社会压迫，凡事逆来顺受。","他的遭遇是印度广大农民贫苦生活的缩影。破产死亡是印度阶级压迫剥削的结果。"],"src":"简析何利形象／主人公何利勤劳善良，富有同情心，宁肯自己受损失，也不让别人吃亏。／终生受地主和高利贷者的压迫/剥削，变相卖女儿，至死也不明白自己受苦的原因。／由于宗教思想的束缚，他还相信宿命论，认为“命中注定享福的才能享福”。／他胆小怕事又很软弱，害怕地主和官府，无力反抗社会压迫，凡事逆来顺受。／他的遭遇是印度广大农民贫苦生活的缩影。破产死亡是印度阶级压迫剥削的结果。"},{"id":"s00255","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["选择","简答"],"stem":"简述：普列姆昌德《戈丹》的艺术特色","points":["线索清晰，主次分明，纵横开阖，得心应手。（主线—何利悲惨遭遇，辅线—相关人/事）","人物性格刻画手法多样，一改人物的类型化为人物的典型化。（心理/环境/对话）"],"src":"线索清晰，主次分明，纵横开阖，得心应手。（主线—何利悲惨遭遇，辅线—相关人/事）／人物性格刻画手法多样，一改人物的类型化为人物的典型化。（心理/环境/对话）"},{"id":"s00256","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["简答考点—小蒋提醒可结合《先知》"],"stem":"简述：纪伯伦创作的艺术风格","points":["始终贯穿着清新、隽永、令人深思的艺术风格。","创作上善于学习东西方先人的经验，又注重表现形式上的创新，表现哲理性。","作品中表现出丰富的想象力和激越的情感，以满腔热忱抒发强烈的主观情绪。","（小说/散文诗）讲究对仗，音调铿锵，以富于联想的比喻和拟人，新颖的意象和象征，带有音乐式的语言，表达自己的艺术追求。阿拉伯文坛称“纪伯伦风格”。"],"src":"始终贯穿着清新、隽永、令人深思的艺术风格。／创作上善于学习东西方先人的经验，又注重表现形式上的创新，表现哲理性。／作品中表现出丰富的想象力和激越的情感，以满腔热忱抒发强烈的主观情绪。／（小说/散文诗）讲究对仗，音调铿锵，以富于联想的比喻和拟人，新颖的意象和象征，带有音乐式的语言，表达自己的艺术追求。阿拉伯文坛称“纪伯伦风格”。"},{"id":"s00257","type":"short","ch":"第二部分 东方文学 · 第十五章 现代文学","sec":"","tags":["简答","论述"],"stem":"简述：纪伯伦散文诗集《先知》的思想内容","points":["充满辩证的哲理精神。和谐合一顺应时代潮流，信心和行为、信仰和事业不能分开。","体现东方人道主义者所能达到的最高和最新的思想境界。主要探讨人与人之间的关系，探求“爱”。“爱不占有，也不被占有。因为爱在爱中满足了。”[平等尊重的爱]","篇幅有限/内涵无限，想象丰富/张弛有致，形象生动/哲理深邃，开创散文诗写作道路。"],"src":"充满辩证的哲理精神。和谐合一顺应时代潮流，信心和行为、信仰和事业不能分开。／体现东方人道主义者所能达到的最高和最新的思想境界。主要探讨人与人之间的关系，探求“爱”。“爱不占有，也不被占有。因为爱在爱中满足了。”[平等尊重的爱]／篇幅有限/内涵无限，想象丰富/张弛有致，形象生动/哲理深邃，开创散文诗写作道路。"},{"id":"s00258","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["简答题考点"],"stem":"简析当代东方文学的特征","points":["鲜明的政治倾向。推翻帝国主义殖民统治，为民族解放与国家繁荣而斗争。","世界各国之间的文学与文化交流日益频繁。","鲜明的民族特色。向世界靠拢又注意保持本民族文化与文学的特点。"],"src":"鲜明的政治倾向。推翻帝国主义殖民统治，为民族解放与国家繁荣而斗争。／世界各国之间的文学与文化交流日益频繁。／鲜明的民族特色。向世界靠拢又注意保持本民族文化与文学的特点。"},{"id":"s00259","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["名词考点"],"stem":"名词解释：“战后派”","points":["指日本一战后登上文坛的第一批新作家，以《近代文学》杂志为中心，强调艺术至上，提倡文学独立于政治之外，主张作家不受政治党派和理论的束缚。","野间宏《阴暗的图画》被公认为“战后派”的先声。","第二次战后派作家：三岛由纪夫、大冈升平、安部公房、堀田善卫等。","50年代中期“第三新人派”作家，大江健三郎《个人的体验》《万延年的足球队》"],"src":"指日本一战后登上文坛的第一批新作家，以《近代文学》杂志为中心，强调艺术至上，提倡文学独立于政治之外，主张作家不受政治党派和理论的束缚。／野间宏《阴暗的图画》被公认为“战后派”的先声。／第二次战后派作家：三岛由纪夫、大冈升平、安部公房、堀田善卫等。／50年代中期“第三新人派”作家，大江健三郎《个人的体验》《万延年的足球队》"},{"id":"s00260","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["2304多选"],"stem":"简述：黑非洲文学成就","points":["桑戈尔：塞内加尔诗人，非洲现代诗歌奠基人。“黑人性”文艺的主要倡导者。","沃莱·索因卡：尼日利亚，1986年获诺贝尔文学奖。长篇小说代表作《解释者》。","纳丁·戈迪默：南非著名的白人女作家，1991年获得诺贝尔文学奖。长篇小说《陌生人的世界》。《已故的资产阶级世界》《大自然的运动》","桑贝内·乌斯曼：塞内加尔著名的小说家，代表作《神的儿女》。","费丁南·奥约诺：喀麦隆小说家，长篇小说—《家僮的一生》《老黑人和奖章》《欧洲的道路》。","钦努阿·阿契贝：尼日利亚著名作家，《瓦解》《动荡》《神箭》《人民公仆》。吉布里尔·塔姆希尔·尼亚奈《松迪亚塔》，黑非洲口头文学，兼具神话色彩和文献价值的长篇英雄史诗。"],"src":"桑戈尔：塞内加尔诗人，非洲现代诗歌奠基人。“黑人性”文艺的主要倡导者。／沃莱·索因卡：尼日利亚，1986年获诺贝尔文学奖。长篇小说代表作《解释者》。／纳丁·戈迪默：南非著名的白人女作家，1991年获得诺贝尔文学奖。长篇小说《陌生人的世界》。《已故的资产阶级世界》《大自然的运动》／桑贝内·乌斯曼：塞内加尔著名的小说家，代表作《神的儿女》。／费丁南·奥约诺：喀麦隆小说家，长篇小说—《家僮的一生》《老黑"},{"id":"s00261","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["1710名词"],"stem":"名词解释：川端康成","points":["川端康成是日本现代著名作家。","他以丰富的作品，展示了东方现代独特的美世界。1968年获诺贝尔文学奖。","他的代表作是《雪国》（中篇小说）。"],"src":"川端康成是日本现代著名作家。／他以丰富的作品，展示了东方现代独特的美世界。1968年获诺贝尔文学奖。／他的代表作是《雪国》（中篇小说）。"},{"id":"s00262","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["简答题考点"],"stem":"简述：川端康成创作的美学特征","points":["他刻意追求美：传统的自然美、非现实的虚幻美和颓废的官能美。","自然美：揉进主观色彩（不对自然美做客观的写照），善于对自然景物的色彩、线条和音响进行丰富的联想和比喻。虚幻美—空灵，官能美—实在，符合新感觉派中再感受的要旨。","贡献：作家本着现代日本人的感受，以哀婉的笔调，写出日本传统的美的新篇章。诺奖作品《雪国》《古都》《千只鹤》集中反映川端康成创作的美学特征。"],"src":"他刻意追求美：传统的自然美、非现实的虚幻美和颓废的官能美。／自然美：揉进主观色彩（不对自然美做客观的写照），善于对自然景物的色彩、线条和音响进行丰富的联想和比喻。虚幻美—空灵，官能美—实在，符合新感觉派中再感受的要旨。／贡献：作家本着现代日本人的感受，以哀婉的笔调，写出日本传统的美的新篇章。诺奖作品《雪国》《古都》《千只鹤》集中反映川端康成创作的美学特征。"},{"id":"s00263","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["《雪国》-2410名词","2504多选"],"stem":"名词解释：川端康成小说《雪国》的思想内容","points":["同情驹子悲剧命运（社会底层的艺妓），追求独立的人格和自由、探求人生价值的进取精神；批判岛村一类有产者，但还不够。描写了岛村、驹子、行男、叶子等人之间的感情纠葛。流露出悲观情绪和虚无思想。","一切虚幻，人的一切努力是徒劳，悲观情绪和虚无思想，给作品带来消极因素。"],"src":"同情驹子悲剧命运（社会底层的艺妓），追求独立的人格和自由、探求人生价值的进取精神；批判岛村一类有产者，但还不够。描写了岛村、驹子、行男、叶子等人之间的感情纠葛。流露出悲观情绪和虚无思想。／一切虚幻，人的一切努力是徒劳，悲观情绪和虚无思想，给作品带来消极因素。"},{"id":"s00264","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["1804简答","2310名词"],"stem":"名词解释：《雪国》的人物形象","points":["简析《雪国》中的驹子形象","川端康成小说《雪国》的主人公，是作品主题的主要体现者。","出身卑微，但不甘沉沦，并富有生活理想的下层妇女的典型。","历经生活的磨难，但仍坚持写日记、读小说、学三弦，追求真挚爱情。追求理想但虚幻的爱。岛村：养尊处优、百无聊赖的有产者。坐食祖产，无所事事，陷入莫名的悲哀。与女性交往慰藉心灵，悲观颓废的虚无主义者，认为生存是徒劳，成为生活中的弱者和追求中的失败者。他虚无—驹子充实，他世故—驹子纯真，他想象的幻影—驹子实际的存在。"],"src":"简析《雪国》中的驹子形象／川端康成小说《雪国》的主人公，是作品主题的主要体现者。／出身卑微，但不甘沉沦，并富有生活理想的下层妇女的典型。／历经生活的磨难，但仍坚持写日记、读小说、学三弦，追求真挚爱情。追求理想但虚幻的爱。岛村：养尊处优、百无聊赖的有产者。坐食祖产，无所事事，陷入莫名的悲哀。与女性交往慰藉心灵，悲观颓废的虚无主义者，认为生存是徒劳，成为生活中的弱者和追求中的失败者。他虚无—驹子充实，"},{"id":"s00265","type":"short","ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":["1504","2008 简答","1704 多选"],"stem":"简述：川端康成小说《雪国》的艺术特色","points":["充满诗意的抒情性。","日本传统与西方意识流的交融。","运用多种手段塑造人物。9. 纳吉布·马哈福兹小说《宫间街》三部曲的内容：主题：反映埃及生活 ；个人的耻辱经历，还象征南非殖民地的耻辱历史。","鲜明对比的手法。人物和故事构成了多组对比。","采用了互文性手法。卢里写作歌剧《拜伦在意大利》。"],"src":"象征手法的使用。题目象征：主人公卢里的不顾羞耻，象征众人的不顾廉耻；现实中的耻辱之事，小说中人物内心的耻辱之感；个人的耻辱经历，还象征南非殖民地的耻辱历史。／鲜明对比的手法。人物和故事构成了多组对比。／采用了互文性手法。卢里写作歌剧《拜伦在意大利》。"}]};

/* ============ helpers ============ */
const $ = s => document.querySelector(s);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
const LET = ['A','B','C','D','E','F'];
const BLANK = '<span class="blank"></span>';

/* normalize for fill-in comparison */
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\s\u3000]/g,'')
    .replace(/[《》〈〉「」『』（）()\[\]【】·・,，.。、;；:：!！?？"'"'—－\-_/\\|]/g,'')
    .replace(/^(a|an|the)$/,'');
}
function fillOk(input, ans){
  const a = norm(input); if(!a) return false;
  const list = Array.isArray(ans) ? ans : [ans];
  return list.some(x => { const n=norm(x); return n && (a===n || (n.length>=4 && (a.includes(n)||n.includes(a)))); });
}

/* ============ filter ============ */
function byType(t){
  return DATA.items.filter(it => t==='choice' ? (it.type==='choice'||it.type==='multi') : it.type===t);
}
function byCh(list){
  const ch = store.ch;
  if(!ch || ch==='全部') return list;
  return list.filter(it => it.ch===ch);
}
function poolFor(type){ return byCh(byType(type)); }
