  {k:'choice', i:'◉', n:'选择题', d:'单选 / 多选，点一下即判'},
  {k:'fill',   i:'✎', n:'填空',   d:'打字作答，自动判分'},
  {k:'card',   i:'▤', n:'背诵卡', d:'翻面看答案，过一遍'},
  {k:'short',  i:'❖', n:'简答论述', d:'看要点自评'},
  {k:'order',  i:'⇅', n:'时间线排序', d:'练时期先后'},
];

function renderHome(){
  const total = DATA.items.length;
  const seen = Object.keys(store.seen).length;
  const wrongN = Object.keys(store.wrong).length;
  const starred = Object.keys(store.star).filter(k=>store.star[k]).length;
  const acc = store.right + store.wrongN ? pct(store.right, store.right+store.wrongN) : 0;

  const chs = ['全部'].concat(DATA.chapters);
  // chip 上只显示章名，去掉「第一部分 西方文学 · 」这类前缀：章号本身已唯一，前缀只会把 chip 撑到屏幕外
  const shortCh = c => c.includes(' · ') ? c.split(' · ').pop() : c;
  const chips = chs.map(c=>{
    const n = c==='全部' ? total : DATA.items.filter(i=>i.ch===c).length;
    return `<button class="chip ${store.ch===c?'on':''}" title="${esc(c)}"
      onclick="setCh('${esc(c).replace(/'/g,"\\'")}')">${esc(shortCh(c))} · ${n}</button>`;
  }).join('');

  const mcards = MODES.filter(m=>poolFor(m.k).length>0).map(m=>{
    const n = poolFor(m.k).length;
    return `<button class="mode" onclick="start('${m.k}')">
      <span class="mc">${n}</span>
      <span class="mi">${m.i}</span>
      <span class="mn">${m.n}</span>
      <span class="md">${m.d}</span>
    </button>`;
  }).join('');

  app().innerHTML = `
  <div class="top">
    <div class="ttl">${esc(DATA.meta.title)}</div>
    <button class="iconbtn" onclick="go('book')" title="错题本/收藏">★</button>
  </div>
  <div class="hero">
    <div class="subj">${esc(DATA.meta.subject||'刷题')}</div>
    <h1>${esc(DATA.meta.headline||'今天刷几组？')}</h1>
    <div class="meta">${total} 道题 · ${DATA.chapters.length} 个章节 · 本地保存进度</div>
  </div>
  <div class="statrow">
    <div class="stat"><div class="n">${seen}</div><div class="l">已练</div></div>
    <div class="stat"><div class="n">${acc}%</div><div class="l">正确率</div></div>
    <div class="stat"><div class="n">${wrongN}</div><div class="l">错题</div></div>
  </div>
  <div class="chips">${chips}</div>
  <div class="sec-h"><h2>练习模式</h2><span class="cnt">${store.ch==='全部'?'全部章节':esc(shortCh(store.ch))}</span></div>
  <div class="modes">${mcards}
    <button class="mode wide" onclick="go('book')">
      <span class="mi">★</span><span class="mn">错题本 · 收藏</span>
      <span class="md">${wrongN} 道错题 · ${starred} 道收藏</span>
    </button>
  </div>
  <div style="height:24px"></div>`;
}

window.setCh = function(c){ store.ch=c; save(); renderHome(); };

/* ---------- start a round ---------- */
const ROUND = 20;
window.start = function(type){
  let pool = poolFor(type);
  if(!pool.length){ toast('这个范围暂时没有题'); return; }
  let list = shuffle(pool);
  if(list.length > ROUND) list = list.slice(0, ROUND);
  resetQState();                 // 上一轮最后一题答完后没重置，否则新一轮第一题是锁死的
  Q = { type, list, i:0, answers:[], startedAt:Date.now() };
  go('quiz');
};

/* ---------- quiz ---------- */
function cur(){ return Q.list[Q.i]; }

function renderQuiz(){
  const it = cur();
  const p = Q.i / Q.list.length * 100;
  const starred = !!store.star[it.id];

  let inner = '';
  if(it.type==='choice' || it.type==='multi') inner = qChoice(it);
  else if(it.type==='fill') inner = qFill(it);
  else if(it.type==='card') inner = qCard(it);
  else if(it.type==='short') inner = qShort(it);
  else if(it.type==='order') inner = qOrder(it);

  app().innerHTML = `
  <div class="top">
    <button class="iconbtn" onclick="quit()">‹</button>
    <div class="ttl">${esc(MODES.find(m=>m.k===Q.type)?.n || '')} <span style="color:var(--faint);font-weight:400">${Q.i+1}/${Q.list.length}</span></div>
    <button class="iconbtn ${starred?'on':''}" onclick="toggleStar('${it.id}')">★</button>
  </div>
  <div class="qwrap">
    <div class="pbar"><i style="width:${p}%"></i></div>
    ${inner}
  </div>
  <div class="bar" id="bar"></div>`;

  const b = $('#bar');
  if(it.type==='choice') b.innerHTML = `<button class="btn ghost" onclick="skip()">跳过</button><div class="hintbar">点选项直接判分</div>`;
  if(it.type==='multi')  b.innerHTML = `<button class="btn ghost" onclick="skip()">跳过</button><button class="btn pri" id="submitMulti" disabled onclick="submitMulti()">确认（<span id="mcount">0</span>）</button>`;
  if(it.type==='fill')   b.innerHTML = `<button class="btn ghost" onclick="skip()">跳过</button><button class="btn pri" id="submitFill" onclick="submitFill()">提交</button>`;
  if(it.type==='card')   b.innerHTML = `<button class="btn ghost" onclick="next(false,'card')">不记得</button><button class="btn pri" onclick="next(true,'card')">记得</button>`;
  if(it.type==='short')  b.innerHTML = `<button class="btn ghost" onclick="next(false,'short')">没答上</button><button class="btn pri" onclick="next(true,'short')">答出来了</button>`;
  if(it.type==='order')  b.innerHTML = `<button class="btn ghost" onclick="skip()">跳过</button><button class="btn pri" id="submitOrder" onclick="submitOrder()">提交顺序</button>`;

  if(it.type==='fill') setTimeout(()=>{ const e=$('#ansInput'); if(e) e.focus(); },80);
}

function ctxHtml(it){
  return it.ctx ? `<div class="ctx"><b>${esc(it.ctx)}</b></div>` : '';
}

function qChoice(it){
  const multi = it.type==='multi';
  const tags = tagHtml(it);
  const opts = it.options.map((o,i)=>{
    const k = multi ? '☐' : LET[i];
    return `<button class="opt" data-i="${i}" onclick="pick(${i})"><span class="k">${k}</span><span>${esc(o)}</span></button>`;
  }).join('');
  return `<div class="qcard">
    <div class="qtag">${tags}</div>
    ${ctxHtml(it)}
    <div class="stem">${it.stem.replace(/_{3,}/g, BLANK)}</div>
    <div class="opts" id="opts">${opts}</div>
    <div id="fb"></div>
  </div>`;
}

function qFill(it){
  return `<div class="qcard">
    <div class="qtag">${tagHtml(it)}</div>
    ${ctxHtml(it)}
    <div class="stem">${it.stem.replace(/_{3,}/g, BLANK)}</div>
    <div style="margin-top:16px"><input class="fillin" id="ansInput" placeholder="输入答案" autocomplete="off"
      autocorrect="off" autocapitalize="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')submitFill()"></div>
    <div id="fb"></div>
  </div>`;
}

function qCard(it){
  return `${ctxHtml(it)}<div class="flip" id="flip" onclick="doFlip()">
    <div class="flipin">
      <div class="face front">
        <div class="lab">题目 / 关键词</div>
        <div class="txt">${esc(it.front)}</div>
      </div>
      <div class="face back">
        <div class="lab">答案 · 原文</div>
        <div class="txt">${esc(it.back)}</div>
      </div>
    </div>
  </div>
  <div class="tapme">轻点卡片翻面 ↓</div>`;
}
window.doFlip = function(){ const f=$('#flip'); if(f) f.classList.toggle('flipped'); };

function qShort(it){
  return `<div class="qcard">
    <div class="qtag">${tagHtml(it)}</div>
    <div class="stem">${esc(it.stem)}</div>
    <div id="fb">
      <button class="btn sm pri" style="margin-top:16px;width:100%" onclick="revealShort()">显示参考答案</button>
    </div>
  </div>`;
}
window.revealShort = function(){
  const it = cur();
  $('#fb').innerHTML = `<div class="fb ok" style="background:var(--line2);color:var(--ink)">
    <em style="font-style:normal;color:var(--faint);font-size:11px;letter-spacing:.5px;display:block;margin-bottom:8px">参考答案 · 逐条对照</em>
    <ul class="pts">${it.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
  </div>`;
};

function qOrder(it){
  return `<div class="qcard">
    <div class="qtag">${tagHtml(it)}</div>
    <div class="stem">${esc(it.prompt||'按时间先后，依次点选')}</div>
    <div class="ords" id="ords">${it.items.map((s,i)=>
      `<button class="ord" data-i="${i}" onclick="pickOrd(${i})"><span class="on">0</span><span>${esc(s)}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
}

function tagHtml(it){
  const ts = (it.tags||[]).slice(0,3).map(t=>{
    const hot = /名词|单选|多选|简答|论述|高频/.test(t);
    return `<span class="tag ${hot?'hot':''}">${esc(t)}</span>`;
  }).join('');
  return `<span class="tag ch">${esc(it.ch)}${it.sec?' · '+esc(it.sec):''}</span>${ts}`;
}

/* ---- choice interactions ---- */
let chosen = [], locked = false;
function resetQState(){ chosen=[]; locked=false; }

window.pick = function(i){
  const it = cur();
  if(locked) return;
  if(it.type==='choice'){
    chosen=[i]; locked=true;
    const ok = i === it.answer[0];
    [...document.querySelectorAll('.opt')].forEach((el,k)=>{
      el.disabled = true;
      if(k===it.answer[0]) el.classList.add('ok');
      else if(k===i) el.classList.add('bad');
    });
    record(it, ok);
    showFb(it, ok);
    $('#bar').innerHTML = `<button class="btn pri" onclick="next(${ok})">${Q.i+1<Q.list.length?'下一题':'看结果'} →</button>`;
  } else {
    const k = chosen.indexOf(i);
    if(k>=0) chosen.splice(k,1); else chosen.push(i);
    [...document.querySelectorAll('.opt')].forEach((el,x)=>{
      el.classList.toggle('sel', chosen.includes(x));
      el.querySelector('.k').textContent = chosen.includes(x) ? (chosen.indexOf(x)+1) : '☐';
    });
    const btn = $('#submitMulti');
    if(btn){ btn.disabled = chosen.length===0; const c=$('#mcount'); if(c) c.textContent=chosen.length; }
  }
};

window.submitMulti = function(){
  const it = cur(); if(locked) return; locked=true;
  const a = [...it.answer].sort().join(','), b = [...chosen].sort().join(',');
  const ok = a===b;
  [...document.querySelectorAll('.opt')].forEach((el,k)=>{
    el.disabled = true;
    if(it.answer.includes(k)) el.classList.add('ok');
    else if(chosen.includes(k)) el.classList.add('bad');
  });
  record(it, ok); showFb(it, ok);
  $('#bar').innerHTML = `<button class="btn pri" onclick="next(${ok})">${Q.i+1<Q.list.length?'下一题':'看结果'} →</button>`;
};

window.submitFill = function(){
  const it = cur(); if(locked) return;
  const v = $('#ansInput')?.value.trim();
  if(!v){ toast('先写点什么'); return; }
  locked = true;
  const ok = fillOk(v, it.answer);
  $('#ansInput').disabled = true;
  record(it, ok); showFb(it, ok);
  $('#bar').innerHTML = `<button class="btn pri" onclick="next(${ok})">${Q.i+1<Q.list.length?'下一题':'看结果'} →</button>`;
};

window.pickOrd = function(i){
  const it = cur(); if(locked) return;
  const k = chosen.indexOf(i);
  if(k>=0) chosen.splice(k,1); else chosen.push(i);
  [...document.querySelectorAll('.ord')].forEach((el,x)=>{
    el.classList.toggle('picked', chosen.includes(x));
    el.querySelector('.on').textContent = chosen.includes(x) ? (chosen.indexOf(x)+1) : '0';
  });
};

window.submitOrder = function(){
  const it = cur(); if(locked) return;
  if(chosen.length !== it.items.length){ toast('把每一项都排上'); return; }
  locked = true;
  const ok = chosen.join(',') === it.answer.join(',');
  [...document.querySelectorAll('.ord')].forEach((el,x)=>{
    const pos = chosen.indexOf(x);
    el.classList.add(pos===it.answer.indexOf(x) ? 'ok' : 'bad');
    el.querySelector('.on').textContent = pos+1;
  });
  record(it, ok); showFb(it, ok);
  $('#bar').innerHTML = `<button class="btn pri" onclick="next(${ok})">${Q.i+1<Q.list.length?'下一题':'看结果'} →</button>`;
};

function showFb(it, ok){
  const right = it.type==='order'
    ? it.answer.map(i=>it.items[i]).join(' → ')
    : (it.type==='choice'||it.type==='multi')
      ? it.answer.map(i=>it.options[i]).join('、')
      : [].concat(it.answer).join(' / ');
  const fb = $('#fb');
  if(!fb) return;
  fb.innerHTML = `<div class="fb ${ok?'ok':'bad'}">
    <b>${ok?'✓ 答对了':'✗ 正确答案：'+esc(right)}</b>
    ${it.src?`<div class="src"><em>原文出处</em>${esc(it.src)}</div>`:''}
  </div>`;
}

function record(it, ok){
  store.seen[it.id] = true;
  if(ok){ store.right++; if(store.wrong[it.id]) { store.wrong[it.id] = Math.max(0, store.wrong[it.id]-1); if(!store.wrong[it.id]) delete store.wrong[it.id]; } }
  else { store.wrongN++; store.wrong[it.id] = (store.wrong[it.id]||0)+1; }
  Q.answers.push(ok);
  save();
}

window.skip = function(){
  const it = cur();
  if(!locked){ locked=true; }
  next(false);
};

window.next = function(ok, kind){
  if(kind==='card'||kind==='short'){
    const it = cur();
    store.seen[it.id]=true;
    if(ok){ store.right++; }
    else { store.wrongN++; store.wrong[it.id]=(store.wrong[it.id]||0)+1; }
    Q.answers.push(!!ok); save();
  }
  Q.i++;
  if(Q.i >= Q.list.length){ go('result'); return; }
  resetQState(); renderQuiz(); window.scrollTo(0,0);
};

window.quit = function(){
  Q = null; go('home');
};

window.toggleStar = function(id){
  store.star[id] = !store.star[id]; save();
  const it = cur();
  const btn = $('.iconbtn.on, .iconbtn:last-child');
  renderQuiz();
  toast(store.star[id] ? '已收藏' : '已取消收藏');
};

/* ---------- result ---------- */
function renderResult(){
  const ok = Q.answers.filter(Boolean).length;
  const n = Q.answers.length;
  const p = pct(ok, n);
  const C = 2*Math.PI*56;
  const dash = C * p/100;
  const color = p>=80 ? 'var(--ok)' : p>=60 ? 'var(--star)' : 'var(--bad)';
  const verdict = p>=90?'稳了，这组可以过':p>=70?'还行，错题过一遍再刷':'这组不熟，建议重刷';
  app().innerHTML = `
  <div class="top"><button class="iconbtn" onclick="go('home')">‹</button><div class="ttl">本轮结果</div><div style="width:34px"></div></div>
  <div class="result">
    <div class="ring">
      <svg width="132" height="132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--line2)" stroke-width="10"/>
      <circle cx="66" cy="66" r="56" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${dash} ${C}" style="transition:stroke-dasharray .6s ease"/></svg>
      <div class="pct" style="color:${color}">${p}%</div>
    </div>
    <div class="big" style="color:${color}">${ok} / ${n}</div>
    <div class="cap">${verdict}</div>
    <div class="sm">用时 ${Math.max(1,Math.round((Date.now()-Q.startedAt)/60000))} 分钟 · 累计 ${store.right} 对 ${store.wrongN} 错</div>
  </div>
  <div class="bar">
    <button class="btn ghost" onclick="go('home')">返回</button>
    <button class="btn pri" onclick="start('${Q.type}')">再来一组</button>
  </div>`;
}

/* ---------- book (wrong / starred) ---------- */
let BOOK = 'wrong';
function renderBook(){
  let list;
  if(BOOK==='wrong') list = DATA.items.filter(it=>store.wrong[it.id]);
  else list = DATA.items.filter(it=>store.star[it.id]);

  const rows = list.map(it=>{
    const stem = it.type==='card' ? it.front : (it.stem||it.prompt||'');
    const ans = it.type==='card' ? it.back
      : (it.type==='choice'||it.type==='multi') ? it.answer.map(i=>it.options[i]).join('、')
      : it.type==='order' ? it.answer.map(i=>it.items[i]).join(' → ')
      : it.type==='short' ? it.points.slice(0,2).join(' / ')
      : [].concat(it.answer).join(' / ');
    const c = store.wrong[it.id];
    return `<div class="row">
      <div class="body">
        <div class="q">${esc(stem)}</div>
        <div class="a">→ ${esc(ans)}</div>
      </div>
      ${c?`<span class="badge">×${c}</span>`:''}
    </div>`;
  }).join('');

  app().innerHTML = `
  <div class="top">
    <button class="iconbtn" onclick="go('home')">‹</button>
    <div class="ttl">${BOOK==='wrong'?'错题本':'收藏'}</div>
    <button class="iconbtn" onclick="clearBook()">清空</button>
  </div>
  <div class="chips" style="padding-bottom:14px">
    <button class="chip ${BOOK==='wrong'?'on':''}" onclick="setBook('wrong')">错题 · ${Object.keys(store.wrong).length}</button>
    <button class="chip ${BOOK==='star'?'on':''}" onclick="setBook('star')">收藏 · ${Object.keys(store.star).filter(k=>store.star[k]).length}</button>
  </div>
  <div class="list">${rows || `<div class="empty"><div class="big">${BOOK==='wrong'?'✓':'☆'}</div>${BOOK==='wrong'?'还没有错题，去刷几组吧':'还没有收藏，刷题时点右上角星号'}</div>`}</div>
  ${list.length?`<div class="bar"><button class="btn pri" onclick="practiceBook()">重刷这些（${list.length}）</button></div>`:''}`;
}
window.setBook = function(b){ BOOK=b; renderBook(); };
window.clearBook = function(){
  if(BOOK==='wrong'){ store.wrong={}; store.wrongN=0; } else { store.star={}; }
  save(); renderBook(); toast('已清空');
};
window.practiceBook = function(){
  let list = BOOK==='wrong' ? DATA.items.filter(it=>store.wrong[it.id]) : DATA.items.filter(it=>store.star[it.id]);
  if(!list.length) return;
  // group by type: use the dominant one, but any type works via renderQuiz dispatch
  resetQState();
  Q = { type: list[0].type, list: shuffle(list).slice(0,40), i:0, answers:[], startedAt:Date.now() };
  go('quiz');
};

/* boot */
render();
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
