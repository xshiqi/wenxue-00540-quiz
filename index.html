<title>外国文学史 00540 · 简答刷题</title>
<style>
:root{
  --bg:#f4f2ec; --bg2:#ffffff; --ink:#182132; --sub:#6b7280; --faint:#9aa1ad;
  --line:#e4e0d6; --line2:#efebe2; --brand:#1b2a4a; --brand-soft:#2f4468;
  --accent:#b23a24; --accent-soft:#f6e9e5;
  --ok:#1c6b46; --ok-soft:#e6f2ec; --bad:#b23a24; --bad-soft:#fbe9e6;
  --star:#c99a2e;
  --r:14px; --sh:0 1px 2px rgba(20,26,38,.05), 0 6px 18px rgba(20,26,38,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151b; --bg2:#1a1e26; --ink:#e8eaef; --sub:#9aa3b2; --faint:#6a7383;
    --line:#2a2f3a; --line2:#232833; --brand:#7f9bd0; --brand-soft:#8fa9d8;
    --accent:#e07a5f; --accent-soft:#2c211e;
    --ok:#57c08a; --ok-soft:#16241d; --bad:#e8836c; --bad-soft:#2a1c19;
    --star:#e0b050;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
#app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;position:sticky;top:0;z-index:20;background:var(--bg)}
.top .ttl{font-size:15px;font-weight:700;letter-spacing:.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--sub);background:var(--bg2);box-shadow:var(--sh)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.on{color:var(--star)}

/* ---------- home ---------- */
.hero{padding:6px 18px 18px}
.hero h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.4px;font-weight:800}
.hero .meta{color:var(--sub);font-size:12.5px;margin-top:6px}
.hero .subj{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--accent);
  background:var(--accent-soft);padding:3px 9px;border-radius:6px;margin-bottom:10px}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 16px}
.stat{background:var(--bg2);border-radius:var(--r);padding:12px 10px;text-align:center;box-shadow:var(--sh)}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--sub);margin-top:1px}

.sec-h{display:flex;align-items:baseline;gap:8px;padding:4px 18px 10px}
.sec-h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:1.4px;color:var(--sub);text-transform:uppercase}
.sec-h .cnt{font-size:12px;color:var(--faint);margin-left:auto}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 18px}
.mode{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;transition:transform .12s}
.mode:active{transform:scale(.975)}
.mode .mi{font-size:20px;line-height:1}
.mode .mn{font-size:15px;font-weight:700}
.mode .md{font-size:11.5px;color:var(--sub);line-height:1.45}
.mode .mc{position:absolute;top:12px;right:13px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.mode.wide .mn{flex:1}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;padding:7px 13px;border-radius:20px;background:var(--bg2);
  color:var(--sub);box-shadow:var(--sh);white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--brand);color:#fff;font-weight:600;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.chip.on{color:#12151b}}

/* ---------- quiz ---------- */
.qwrap{flex:1;display:flex;flex-direction:column;padding:0 18px 110px}
.pbar{height:3px;background:var(--line2);border-radius:3px;overflow:hidden;margin:0 0 14px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s cubic-bezier(.4,0,.2,1)}

.qcard{background:var(--bg2);border-radius:18px;padding:20px 18px;box-shadow:var(--sh);margin-bottom:14px}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2.5px 7px;border-radius:5px;
  background:var(--line2);color:var(--sub)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
.tag.ch{background:transparent;color:var(--faint);padding-left:0}
.ctx{font-size:12.5px;color:var(--sub);background:var(--line2);border-radius:7px;
  padding:6px 9px;margin-bottom:11px;line-height:1.5}
.ctx b{color:var(--ink);font-weight:700}
.ctx:before{content:"考点";font-size:10px;font-weight:800;letter-spacing:1.2px;
  color:var(--faint);display:block;margin-bottom:2px}

.stem{font-size:17.5px;line-height:1.72;font-weight:600;letter-spacing:.1px;word-break:break-word}
.stem .blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--accent);
  vertical-align:-2px;height:1.1em;margin:0 2px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;align-items:flex-start;gap:11px;background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:left;font-size:15.5px;line-height:1.55;
  transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 22px;height:22px;border-radius:7px;background:var(--line2);color:var(--sub);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.sel{border-color:var(--brand);background:var(--bg2)}
.opt.sel .k{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.opt.sel .k{color:#12151b}}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{opacity:1}

.fb{margin-top:14px;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.65}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:14.5px}
.fb .src{margin-top:8px;padding-top:9px;border-top:1px dashed currentColor;opacity:.82;
  font-size:13px;line-height:1.68;font-weight:400;color:var(--ink)}
.fb .src em{font-style:normal;color:var(--faint);font-size:11px;letter-spacing:.5px;display:block;margin-bottom:3px}

/* card flip */
.flip{perspective:1200px;cursor:pointer}
.flipin{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.flip.flipped .flipin{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg2);
  border-radius:18px;padding:26px 20px;box-shadow:var(--sh);min-height:210px;
  display:flex;flex-direction:column;justify-content:center}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);background:var(--bg2)}
.face .lab{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--faint);margin-bottom:10px}
.face .txt{font-size:17px;line-height:1.75;font-weight:600}
.face.back .txt{font-weight:500;font-size:16px}
.tapme{text-align:center;font-size:12px;color:var(--faint);margin:12px 0 0}

/* fill */
.fillin{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.fillin:focus{border-color:var(--brand)}

/* short answer */
.pts{margin:12px 0 0;padding:0;list-style:none}
.pts li{position:relative;padding:8px 0 8px 22px;font-size:14.5px;line-height:1.66;border-bottom:1px solid var(--line2)}
.pts li:last-child{border-bottom:0}
.pts li:before{content:"·";position:absolute;left:6px;top:6px;color:var(--accent);font-weight:900;font-size:18px}

/* order */
.ords{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ord{display:flex;align-items:center;gap:11px;background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:left;font-size:15px}
.ord .on{flex:0 0 24px;height:24px;border-radius:50%;background:var(--line2);color:transparent;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ord.picked{border-color:var(--brand);background:var(--bg2)}
.ord.picked .on{background:var(--brand);color:#fff}
.ord.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord.ok .on{background:var(--ok);color:#fff}
.ord.bad{border-color:var(--bad);background:var(--bad-soft)}
.ord.bad .on{background:var(--bad);color:#fff}

/* bottom action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 18px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 68%,transparent);display:flex;gap:10px;max-width:620px;margin:0 auto}
.btn{flex:1;height:50px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(27,42,74,.24)}
@media (prefers-color-scheme:dark){.btn.pri{color:#12151b}}
.btn.ghost{flex:0 0 92px;background:var(--bg2);color:var(--sub);box-shadow:var(--sh)}
.btn.ghost:active{opacity:.8}
.btn:disabled{opacity:.38;box-shadow:none}
.btn.okb{background:var(--ok);color:#fff}
.btn.badb{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:42px;font-size:14.5px}
.hintbar{flex:1;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--faint);background:var(--bg2);box-shadow:var(--sh)}

/* list (book) */
.list{padding:0 18px 110px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;box-shadow:var(--sh)}
.row .body{flex:1;min-width:0}
.row .q{font-size:14.5px;line-height:1.6;font-weight:600}
.row .a{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.6}
.row .badge{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;
  background:var(--bad-soft);color:var(--bad)}
.empty{padding:60px 24px;text-align:center;color:var(--faint);font-size:14px;line-height:1.9}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.55}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,10px);
  background:rgba(24,33,50,.94);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* result screen */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px 24px 120px;text-align:center}
.result .big{font-size:56px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.result .cap{font-size:14px;color:var(--sub);margin-top:4px}
.result .sm{font-size:13px;color:var(--faint);margin-top:16px;line-height:1.8}
.ring{width:132px;height:132px;position:relative;margin-bottom:8px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;letter-spacing:-1px}

@media (min-width:700px){ body{background:var(--bg)} }
</style>
</head>

],"answer":[0]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"于连的悲剧告诉我们：在复辟时期，一个有进取心的平民青年，试图通过个人奋斗跻身上流社会，却又不愿厚颜无耻地讨好主子，丧尽天良地利用他人的鲜血来染红自己的肩章，最终只能成为上流社会的“局外人”。","ctx":"《红与黑》的人物形象","id":"q00708","type":"choice","stem":"于连的悲剧告诉我们：在复辟时期，一个有进取心的平民青年，试图通过个人奋斗跻身上流社会，却又不愿厚颜无耻地讨好主子，丧尽天良地利用他人的鲜血来染红自己的肩章，最终只能成为上流社会的“______”。","options":["感受世界","局外人","新的果戈理","空间"],"answer":[1]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"从传统封闭结构向现代开放结构过渡。以于连的仕途、爱情为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景，形成了主干明显，疏密得当的结构。作品所表现的是1830年这样一个“特定时代”的“空间”的“心灵变化”，时间、地点的迅速变换，人物的忽隐忽现，对话的紧张而不连贯等，更增加了作品的现代因素。","ctx":"论述斯丹达尔《红与黑》的艺术成就","id":"q00711","type":"choice","stem":"从传统封闭结构向现代开放结构过渡。以于连的仕途、爱情为发展线索，重点描写了他在小城、省城、巴黎和监狱4个场景，形成了主干明显，疏密得当的结构。作品所表现的是1830年这样一个“______”的“空间”的“心灵变化”，时间、地点的迅速变换，人物的忽隐忽现，对话的紧张而不连贯等，更增加了作品的现代因素。","options":["宪章派文学","特定时代","正教观念","复调小说"],"answer":[1]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"对人物行为的深刻心理分析，是《红与黑》的主要艺术魅力所在。斯丹达尔具有数学家那样的天才，能准确无误地刻画出男女主人公的细致心理变化及其发展过程，尤其是他们的爱情心理变化。于连一生的追求，他的爱恨情仇，就始终伴随着深刻、细腻的心理描写。","ctx":"论述斯丹达尔《红与黑》的艺术成就","id":"q00715","type":"choice","stem":"对人物行为的深刻心理分析，是______的主要艺术魅力所在。斯丹达尔具有数学家那样的天才，能准确无误地刻画出男女主人公的细致心理变化及其发展过程，尤其是他们的爱情心理变化。于连一生的追求，他的爱恨情仇，就始终伴随着深刻、细腻的心理描写。","options":["《红与黑》","《高老头》","《死魂灵》","《罪与罚》"],"answer":[0]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"19世纪法国现实主义作家；创作了由九十多部小说组成的《人间喜剧》，","ctx":"巴尔扎克","id":"q00718","type":"choice","stem":"19世纪法国现实主义作家；创作了由九十多部小说组成的______，","options":["《钦差大臣》","《驴皮记》","《人间喜剧》","《父与子》"],"answer":[2]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"巴尔扎克创作的总称，包括风俗研究、哲学研究、分析研究三部分，共90余部。","ctx":"巴尔扎克","id":"q00722","type":"choice","stem":"______创作的总称，包括风俗研究、哲学研究、分析研究三部分，共90余部。","options":["狄更斯","自然派","“小人物”","巴尔扎克"],"answer":[3]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"主要用现实主义手法，通过资产者的发家、贵族的没落、金钱的万能来揭露和批判资本主义金钱社会。人间喜剧作品：哲理小说《驴皮记》，《欧也妮·葛朗台》，《高老头》，《邦斯舅舅》。【2410多选】14.巴尔扎克的《欧也妮·葛朗台》：","ctx":"巴尔扎克","id":"q00725","type":"choice","stem":"主要用现实 全流行的社会思潮。一是关于“超人哲学”和“权力真理”等论题的探讨，再就是对人的行为中“潜意识”的考察。","options":["《罪与罚》","《红与黑》","《死魂灵》","《外套》"],"answer":[0]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"与上述相关的是“权力”问题，这两个问题可以说其本质是作者对社会不公平的抗议，是对社会中“弱肉强食”现象的艺术描绘。","ctx":"陀思妥耶夫斯基《罪与罚》的思想内容","id":"q00836","type":"choice","stem":"与上述相关的是“______”问题，这两个问题可以说其本质是作者对社会不公平的抗议，是对社会中“弱肉强食”现象的艺术描绘。","options":["偶合家庭","心灵变化","生硬","权力"],"answer":[3]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"《罪与罚》的情节是围绕着主人公拉斯柯尔尼科夫的“哲学”开展的。","ctx":"陀思妥耶夫斯基《罪与罚》的人物形象 — 拉斯柯尔尼科夫","id":"q00841","type":"choice","stem":"______的情节是围绕着主人公拉斯柯尔尼科夫的“哲学”开展的。","options":["《死魂灵》","《人间喜剧》","《罪与罚》","《穷人》"],"answer":[2]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"分析《罪与罚》中的心理描写。【2104 论述/2008 简答】【★★★★★】①人物心理刻画是《罪与罚》突出的艺术特点。如拉斯柯尔尼科夫杀人前的噩梦，重现杀人的心理体验。②作品里许多章节都有关于心理、意识、“潜意识”的描绘。③以许多梦境和幻觉场面表现潜在意识的过程。如斯维德里加依洛夫自杀前梦境/幻觉。","ctx":"陀思妥耶夫斯基《罪与罚》的艺术成就","id":"q00850","type":"choice","stem":"分析《罪与罚》中的心理描写。【2104 论述/2008 简答】【★★★★★】①人物心理刻画是《罪与罚》突出的艺术特点。如拉斯柯尔尼科夫杀人前的噩梦，重现杀人的心理体验。②作品里许多章节都有关于心理、意识、“______”的描绘。③以许多梦境和幻觉场面表现潜在意识的过程。如斯维德里加依洛夫自杀前梦境/幻觉。","options":["单纯的金钱","宪章派文学","潜意识","弱肉强食"],"answer":[2]},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"体现了“复调小说”的特点。【1404 名词；简答/论述考点】【★★★★★】①陀思妥耶夫斯基的小说表现出强烈的“复调”色彩。巴赫金认为陀思妥耶夫斯基创造了一种全新的艺术思维类型——复调型的艺术思维。②复调小说是一种小说结构样式，是由众多的似乎平等的声音的对话构成的。如在《罪与罚》里，几乎所有的重要主人公都有他自己的声音，拉斯柯尔尼科夫的“超人哲学”，女主人公索尼娅的“正教观念”，预审员波尔菲里的“生活求实和法律的观念”，卢仁的极端个人主义，列别佳特尼科夫的“利己主义”等。③几乎每一种声音都是振振有词的。显得好像是众多的地位平等的意识，相互对话却不发生融合。④“复调”形成的根源在于作家没有能在小说里解决他揭示的问题，似乎书中的人物都各自表明了自己的立场和态度，但始终叫人说不清正确的结论在哪里。","ctx":"陀思妥耶夫斯基《罪与罚》的艺术成就","id":"q00853","type":"choice","stem":"体现了“复调小说”的特点。【1404 名词；简答/论述考点】【★★★★★】①陀思妥耶夫斯基的小说表现出强烈的“复调”色彩。巴赫金认为陀思妥耶夫斯基创造了一种全新的艺术思维类型——复调型的艺术思维。②复调小说是一种小说结构样式，是由众多的似乎平等的声音的对话构成的。如在______里，几乎所有的重要主人公都有他自己的声音，拉斯柯尔尼科夫的“超人哲学”，女主人公索尼娅的“正教观念”，预审员波尔菲里的“生活求实和法律的观念”，卢仁的极端个人主义，列别佳特尼科夫的“利己主义”等。③几乎每一种声音都是振振有词的。显得好像是众多的地位平等的意识，相互对话却不发生融合。④“复调”形成的根源在于作家没有能在小说里解决他揭示的问题，似乎书中的人物都各自表明了自己的立场和态度，但始终叫人说不清正确的结论在哪里。","options":["《邦斯舅舅》 、《五百万》中的拳击手杰克、《丧钟为谁而鸣》中的乔丹等。","answer":["在我们的时代"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"《老人与海》中的圣地亚哥，是“硬汉”形象的代表。在他所生活的世界里，结局注定是要走向衰亡。无论他曾经多么强壮，身体却依然无情地老去，但他坚持奋斗与抗争，他骄傲地说：“人不是为失败而生的，一个人可以被毁灭，但不能被打败。”正是基于这种悲壮感，他体现出了硬汉的价值，维持了人的尊严和人生的意义。","ctx":"《老人与海》的人物形象中的硬汉形象","id":"f01115","type":"fill","stem":"______中的圣地亚哥，是“硬汉”形象的代表。在他所生活的世界里，结局注定是要走向衰亡。无论他曾经多么强壮，身体却依然无情地老去，但他坚持奋斗与抗争，他骄傲地说：“人不是为失败而生的，一个人可以被毁灭，但不能被打败。”正是基于这种悲壮感，他体现出了硬汉的价值，维持了人的尊严和人生的意义。","answer":["老人与海"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"硬汉性格既是参加过两次世界大战和西班牙内战的海明威本人形象的集中概括，也是他对待人类命运的认知态度的体现。➢ “硬汉子”形象：【1710/1301名词；2310简答】【★★★★★★】","ctx":"《老人与海》的人物形象中的硬汉形象","id":"f01118","type":"fill","stem":"硬汉性格既是参加过两次世界大战和西班牙内战的______本人形象的集中概括，也是他对待人类命运的认知态度的体现。➢ “硬汉子”形象：【1710/1301名词；2310简答】【★★★★★★】","answer":["海明威"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"“硬汉子”形象是海明威笔下的系列男性形象。","ctx":"《老人与海》的人物形象中的硬汉形象","id":"f01122","type":"fill","stem":"“硬汉子”形象是______笔下的系列男性形象。","answer":["海明威"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"《老人与海》中的圣地亚哥是这类形象的代表。","ctx":"《老人与海》的人物形象中的硬汉形象","id":"f01126","type":"fill","stem":"______中的圣地亚哥是这类形象的代表。","answer":["老人与海"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"《老人与海》是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。","ctx":"海明威《老人与海》的艺术成就","id":"f01130","type":"fill","stem":"______是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。","answer":["老人与海"]},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"海明威在《死在午后》中提出的创作主张，","ctx":"“冰山原则”","id":"f01133","type":"fill","stem":"海明威在______中提出的创作主张，","answer":["死在午后"]},{"ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":[],"src":"现代主义文学还把“审丑”、“览丑”作为文学创作的主要目的和内容。","ctx":"论述现代主义文学基本特征","id":"f01147","type":"fill","stem":"现代 之间的冲突，二是人物内心的冲突。","ctx":"萨特《禁闭》“境遇剧”","id":"f01238","type":"fill","stem":"存在主义戏剧一般都是“______”（自由剧）。即设置一个封闭式的环境，总是直接地进入戏剧冲突，较少作更多的铺垫。让环境支配人物，让人物在特定环境中选择自己的行动，造就自己的本质。冲突往往在两个层面上展开，一是人物与外部环境之间的冲突，二是人物内心的冲突。","answer":["境遇剧"]},{"ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":[],"src":"作家往往把重心放在第二个层面上，突出人在困境中进行“自由选择”的主题，这种戏剧就是“境遇剧”，又名“自由剧”。极端的境遇往往能最大限度地拷问人物，逼迫其“自由选择”的展开。","ctx":"萨特《禁闭》“境遇剧”","id":"f01242","type":"fill","stem":"作家往往把重心放在第二个层面上，突出人在困境中进行“自由选择”的主题，这种戏剧就是“______”，又名“自由剧”。极端的境遇往往能最大限度地拷问人物，逼迫其“自由选择”的展开。","answer":["境遇剧"]},{"ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":[],"src":"《禁闭》的“地狱”就是其中一种极端境遇，象征了这种存在主义的观念。一方面指过于依附他人的人注定只能生活在地狱里，另一方面指这样的人实际上就已是死人。《禁闭》是“境遇剧”的代表作【2310单选】，思想意义在于通过这一幕发生在地狱里的故事，延续了“自由选择”的主题。","ctx":"萨特《禁闭》“境遇剧”","id":"f01245","type":"fill","stem":"《禁闭》的“地狱”就是其中一种极端境遇，象征了这种存在主义的观念。一方面指过于依附他人的人注定只能生活在地狱里，另一方面指这样的人实际上就已是死人。《禁闭》是“______”的代表作【2310单选】，思想意义在于通过这一幕发生在地狱里的故事，延续了“自由选择”的主题。","answer":["境遇剧"]},{"ch":"第一部分 西方文学 · 第十章 20世纪文学（中）","sec":"","tags":[],"src":"构思奇特，故事发生的场景被限定在所谓的“地狱”中。","ctx":"萨特《禁闭》的艺术特色","id":"f01248","type":"fill","stem":"构思奇特，故事发生的场景被限定在所谓的“______”中。","answer":["地狱"]},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"荒诞派戏剧是 20 世纪 50 年代初期出现于法国的一个文学流派。","ctx":"荒诞派戏剧","id":"f01253","type":"fill","stem":"______是 20 世纪 50 年代初期出现于法国的一个文学流派。","answer":["荒诞派戏剧"]},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"代表人物有尤奈斯库、贝克特等。（尤奈斯库《秃头歌女》、贝克特《等待戈多》）","ctx":"荒诞派戏剧","id":"f01258","type":"fill","stem":"代表人物有尤奈斯库、贝克特等。（尤奈斯库______、贝克特《等待戈多》）","answer":["秃头歌女"]},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"代表作家罗伯-格里耶。20 世纪法国文学中被称为“反小说派”或“拒绝派”。","ctx":"新小说派","id":"f01263","type":"fill","stem":"代表作家罗伯-格里耶。20 世纪法国文学中被称为“______”或“拒绝派”。","answer":["反小说派"]},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"“黑色幽默”是 20 世纪 60 年代兴起于美国的小说流派。","ctx":"“黑色幽默”","id":"f01266","type":"fill","stem":"______是 20 世纪 60 年代兴起于美国的小说流派。","answer":["“黑色幽默”"]},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[]," 形象中所概括的历史经验，实际上是资产阶级进步人士思想探索的历程，体现了从文艺复兴、宗教改革、启蒙运动的反封建精神。浮士德又是处在上升时期的欧洲资产阶级优秀知识分子形象的概括。","ctx":"浮士德的形象/精神","id":"c00467","type":"card","front":"浮士德精神：【★★★★★】①浮士德又是一……","back":"浮士德精神：【★★★★★】①浮士德又是一种积极进取精神的代表，是一个自强不息的探索者形象。歌德对浮士德人生经历的描写，实际上是对自文艺复兴以来至启蒙运动时期欧洲历史的概括。体现了资产阶级思想家的觉醒过程。②歌德在浮士德形象中所概括的历史经验，实际上是资产阶级进步人士思想探索的历程，体现了从文艺复兴、宗教改革、启蒙运动的反封建精神。浮士德又是处在上升时期的欧洲资产阶级优秀知识分子形象的概括。"},{"ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":[],"src":"歌德对浮士德形象的描写，是以浮士德与靡菲斯特的辩证关系为基础的。","ctx":"浮士德与靡菲斯特之间的辩证关系","id":"c00468","type":"card","front":"▁▁▁▁对浮士德形象的描写，是以浮士德与靡菲斯特的辩证关系为基础的。","back":"歌德对浮士德形象的描写，是以浮士德与靡菲斯特的辩证关系为基础的。"},{"ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":[],"src":"浮士德不断地寻求真、善、美，体现了肯定的精神。","ctx":"浮士德与靡菲斯特之间的辩证关系","id":"c00471","type":"card","front":"浮士德不断地寻求真、善、美……","back":"浮士德不断地寻求真、善、美，体现了肯定的精神。"},{"ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":[],"src":"而靡菲斯特一再通过诱惑使浮士德堕落，是恶的代表，体现了否定的精神。正如他自己所说的“你们所谓罪过啊，破坏啊，简言之，被称作恶的一切，正是我的本质特性”。","ctx":"浮士德与靡菲斯特之间的辩证关系","id":"c00472","type":"card","front":"而靡菲斯特一再通过诱惑使浮士德堕落……","back":"而靡菲斯特一再通过诱惑使浮士德堕落，是恶的代表，体现了否定的精神。正如他自己所说的“你们所谓罪过啊，破坏啊，简言之，被称作恶的一切，正是我的本质特性”。"},{"ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":[],"src":"但他的主观作恶在客观上却具有造福的功能，即从反面推动浮士德从错误中摸索到正途，促成了浮士德不断向上向善，引导浮士德最终找到了人生的真谛。这样，靡菲斯特又成为浮士德前进道路上不可缺少的动力。借用靡菲斯特自己的话来说，“老想作恶却总是把善促成，我便是这种力量的一部分”。","ctx":"浮士德与靡菲斯特之间的辩证关系","id":"c00473","type":"card","front":"但他的主观作恶在客观上却具有造福的功能……","back":"但他的主观作恶在客观上却具有造福的功能，即从反面推动浮士德从错误中摸索到正途，促成了浮士德不断向上向善，引导浮士德最终找到了人生的真谛。这样，靡菲斯特又成为浮士德前进道路上不可缺少的动力。借用靡菲斯特自己的话来说，“老想作恶却总是把善促成，我便是这种力量的一部分”。"},{"ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":[],"src":"最重要的艺术特点是大量使用象征、典故与比喻，从人物原型、故事模式到文学意象，贯穿全书。艺术形式上不拘一格，以诗体写成的戏剧，既具有戏剧与诗歌的特点，又拓宽了戏剧的表现力。它的诗体与格律多种多样，既有古希腊无韵的自由体颂歌和哀歌，也有德国的民歌体；古希腊悲剧的诗韵，北欧古典的长短格无韵诗，全剧结束时的“神秘合唱”更丰富了这部诗剧的寓言意味。","ctx":"歌德《浮士德》的艺术特点","id":"c00474","type":"card","front":"最重要的艺术特点是大量使用象征、典故与比喻，从人物原型、故事模式到文学意象，贯穿全书。艺术形式上不拘一格，以诗体写成的戏剧，既具有戏剧与诗歌的特点，又拓宽了戏剧的表现力。它的诗体与格律多种多样，既有古希腊无韵的自由体颂歌和哀歌，也有德国的民歌体；古希腊悲剧的诗韵，北欧古典的长短格无韵诗，全剧结束时的“▁▁▁▁”更丰富了这部诗剧的寓言意味。","back":"最重要的艺术特点是 的始终，是评价人物和各种现象的基本出发点。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"《双城记》是部历史小说，但处理的却是现实问题。","ctx":"狄更斯《双城记》的思想内容","id":"c00795","type":"card","front":"▁▁▁▁是部历史小说，但处理的却是现实问题。","back":"《双城记》是部历史小说，但处理的却是现实问题。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"反映了当时英国社会的尖锐矛盾、贫富的悬殊，下层群众中普遍存在着的愤懑与不满，指出这与大革命前的法国类似，警告英国统治者提防发生类似法国大革命的悲剧。","ctx":"狄更斯《双城记》的思想内容","id":"c00798","type":"card","front":"反映了当时英国社会的尖锐矛盾、贫富的悬殊……","back":"反映了当时英国社会的尖锐矛盾、贫富的悬殊，下层群众中普遍存在着的愤懑与不满，指出这与大革命前的法国类似，警告英国统治者提防发生类似法国大革命的悲剧。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"肯定了法国大革命的必然性与正义性，反对革命暴力与大规模的群众运动，否定贵族和革命的领导者们。","ctx":"狄更斯《双城记》的思想内容","id":"c00799","type":"card","front":"肯定了法国大革命的必然性与正义性……","back":"肯定了法国大革命的必然性与正义性，反对革命暴力与大规模的群众运动，否定贵族和革命的领导者们。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"小说采用典型的多元整一结构，严谨有序。小说由五个叙事单元组成：①梅尼特一家的故事，②得伐石夫妇的故事，③厄弗里蒙地家族的故事，④卡尔登的生活与献身，⑤克朗丘的生活与经历。五个单元之间互相独立、平行发展，又有紧密联系，整一的：人物、情节和线索三种因素。","ctx":"论述狄更斯《双城记》的艺术成就","id":"c00800","type":"card","front":"小说采用典型的多元整一结构……","back":"小说采用典型的多元整一结构，严谨有序。小说由五个叙事单元组成：①梅尼特一家的故事，②得伐石夫妇的故事，③厄弗里蒙地家族的故事，④卡尔登的生活与献身，⑤克朗丘的生活与经历。五个单元之间互相独立、平行发展，又有紧密联系，整一的：人物、情节和线索三种因素。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"体现了狄更斯侧重描写“感受世界”的现实主义创作方法。","ctx":"论述狄更斯《双城记》的艺术成就","id":"c00801","type":"card","front":"体现了▁▁▁▁侧重描写“感受世界”的现实主义创作方法。","back":"体现了狄更斯侧重描写“感受世界”的现实主义创作方法。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"成功地运用了悬念与象征的艺术手法。如梅尼特与厄弗里蒙地家族的关系及他在狱中写下的那份文件。","ctx":"论述狄更斯《双城记》的艺术成就","id":"c00804","type":"card","front":"成功地运用了悬念与象征的艺术手法……","back":"成功地运用了悬念与象征的艺术手法。如梅尼特与厄弗里蒙地家族的关系及他在狱中写下的那份文件。"},{"ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":[],"src":"采用一些象征性的标题，如“复活”等，不少细节描写采用象征手法，以暗示某种意象或预兆，渲染气氛。如得伐石太太“编织罪恶”的描写，鲜红的酒象征着鲜红的血。","ctx":"论述狄更斯《双城记》的艺术成就","id":"c00805","type":"card","front":"采用一些象征性的标题，如“▁▁▁▁”等，不少细节描写采用象征手法，以暗示某种意象或预兆，渲染气氛。如得伐石太太“编织罪恶”的描写，鲜红的酒象征着鲜红的血。","back":"采用一些象征性的标题，如“复活”等，不少细节描写采用象征手法，以暗示某种意象或预兆，渲染气氛。如得伐石太太“编织罪恶”的描写，鲜红的酒象征着鲜红的血 5","type":"card","front":"▁▁▁▁中的圣地亚哥是这类形象的代表。","back":"《老人与海》中的圣地亚哥是这类形象的代表。"},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"《老人与海》是一部寓意深刻的具有象征意义的作品。【论述《老人与海》的象征意义-2210论述题】①老人圣地亚哥作为“硬汉子”形象的代表，是人类精神的体现，马林鱼是人生理想的象征，老人与大鱼的关系是人类为追求美好生活理想而不息奋斗精神的写照。②大海象征变幻无常的社会生活，鲨鱼象征无法摆脱的悲剧命运，狮子象征勇气和力量。老人与大海的关系以及与鲨鱼的搏斗是人类面对不可知的生活及其命运所表现出的一种积极抗争精神。③已进入老年状态的圣地亚哥作为海明威笔下所有硬汉子形象的代表，他在自然的王国里历经挫折而奋斗不息，也是创作上进入老年的海明威在艺术的王国里奋力拼搏的象征，尽管圣地亚哥梦里的狮子可能不再是威猛的，但却是男子汉威武气概的最好象征。《老人与海》正是海明威在艺术王国中历经失败后所钓到的一条大马林鱼。","ctx":"海明威《老人与海》的艺术成就","id":"c01128","type":"card","front":"《老人与海》是一部寓意深刻的具有象征意义的作品……","back":"《老人与海》是一部寓意深刻的具有象征意义的作品。【论述《老人与海》的象征意义-2210论述题】①老人圣地亚哥作为“硬汉子”形象的代表，是人类精神的体现，马林鱼是人生理想的象征，老人与大鱼的关系是人类为追求美好生活理想而不息奋斗精神的写照。②大海象征变幻无常的社会生活，鲨鱼象征无法摆脱的悲剧命运，狮子象征勇气和力量。老人与大海的关系以及与鲨鱼的搏斗是人类面对不可知的生活及其命运所表现出的一种积极抗争精神。③已进入老年状态的圣地亚哥作为海明威笔下所有硬汉子形象的代表，他在自然的王国里历经挫折而奋斗不息，也是创作上进入老年的海明威在艺术的王国里奋力拼搏的象征，尽管圣地亚哥梦里的狮子可能不再是威猛的，但却是男子汉威武气概的最好象征。《老人与海》正是海明威在艺术王国中历经失败后所钓到的一条大马林鱼。"},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"《老人与海》是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。","ctx":"海明威《老人与海》的艺术成就","id":"c01129","type":"card","front":"▁▁▁▁是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。","back":"《老人与海》是海明威艺术风格的体现，也是他关于“冰山原则”的巧妙运用。通过露出水面的“八分之一”，通过老人圣地亚哥这个形象，可以联想到作者笔下所有的硬汉子形象，通过老人与大海和鱼的关系，联想到人类和自然的关系，可联想到海明威本人及他的生活与创作的关系等。他让读者细细地品味这背后所蕴含的丰富的心理变化与思想感情，品味埋藏在底下的“八分之七”。"},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"海明威在《死在午后》中提出的创作主张，","ctx":"“冰山原则”","id":"c01132","type":"card","front":"海明威在▁▁▁▁中提出的创作主张，","back":"海明威在《死在午后》中提出的创作主张，"},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）","sec":"","tags":[],"src":"冰山在海里移动很是庄严宏伟，是因为它只有八分之一露在水面上。","ctx":"“冰山原则”","id":"c01135","type":"card","front":"冰山在海里移动很是庄严宏伟……","back":"冰山在海里移动很是庄严宏伟，是因为它只有八分之一露在水面上。"},{"ch":"第一部分 西方文学 · 第九章 20世纪文学（上）" 来。一方面可以灵活地通过赫索格的“信”大书特书对西方现代文明的种种不满和看法，另一方面用现代艺术手法激活了文学史上古老传统的书信体叙事模式。同时“把写信这种直接内心独白和用第三人称写的间接内心独白交织在一起，再加上内心交谈等手法”，都赋予了书信体文学新的艺术活力，从而使小说获得了成功。","ctx":"索尔·贝娄《赫索格》的艺术特色","id":"c01370","type":"card","front":"对“信”的独特使用……","back":"对“信”的独特使用。作家则通过赫索格把现实和书写这两张网连接起来。一方面可以灵活地通过赫索格的“信”大书特书对西方现代文明的种种不满和看法，另一方面用现代艺术手法激活了文学史上古老传统的书信体叙事模式。同时“把写信这种直接内心独白和用第三人称写的间接内心独白交织在一起，再加上内心交谈等手法”，都赋予了书信体文学新的艺术活力，从而使小说获得了成功。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"印度三部曲：游记类作品是奈保尔创作的另一种类型，其代表作是“印度三部曲”具体指的是《幽暗国度》(1964)、《印度：受伤的文明》(1979)和《印度：百万叛变的今天》(1990)这3部游记，创作时间长达26年，记录了奈保尔以归国游子的视角3次游历母国印度的所见所闻、所思所想。《幽暗国度》：无情地揭露了印度的贫穷、肮脏、混乱与落后。《印度：受伤的文明》：从文化和历史的深处挖掘母国印度愚昧、消极和发展停滞的原因，指出印度始终沉浸在自己辉煌的历史和浓厚的宗教中，厚古薄今、蒙蔽智识、麻痹痛苦，对今日现实中的贫穷与落后无动于衷。《印度：百万叛变的今天》：全新的写法，旁观者的角度+母国本土人当局者的视角，口述史和旅行写作两种艺术形式结合，叛变运动-改革终究体现了印度社会的进步。","ctx":"奈保尔——印度三部曲","id":"c01371","type":"card","front":"印度三部曲：游记类作品是奈保尔创作的另一……","back":"印度三部曲：游记类作品是奈保尔创作的另一种类型，其代表作是“印度三部曲”具体指的是《幽暗国度》(1964)、《印度：受伤的文明》(1979)和《印度：百万叛变的今天》(1990)这3部游记，创作时间长达26年，记录了奈保尔以归国游子的视角3次游历母国印度的所见所闻、所思所想。《幽暗国度》：无情地揭露了印度的贫穷、肮脏、混乱与落后。《印度：受伤的文明》：从文化和历史的深处挖掘母国印度愚昧、消极和发展停滞的原因，指出印度始终沉浸在自己辉煌的历史和浓厚的宗教中，厚古薄今、蒙蔽智识、麻痹痛苦，对今日现实中的贫穷与落后无动于衷。《印度：百万叛变的今天》：全新的写法，旁观者的角度+母国本土人当局者的视角，口述史和旅行写作两种艺术形式结合，叛变运动-改革终究体现了印度社会的进步。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"揭示在欧洲殖民者撤走后，处于后殖民时代的非洲新独立国家的动乱与困境。","ctx":"奈保尔《河湾》的思想内容/主题","id":"c01372","type":"card","front":"揭示在欧洲殖民者撤走后……","back":"揭示在欧洲殖民者撤走后，处于后殖民时代的非洲新独立国家的动乱与困境。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"展现移民面临的文化冲突和流亡人、边缘人的不幸际遇。故事的主人公和叙事者叫萨林姆，萨林姆是一个没有家的人，一个漂泊的无根人，一代流亡知识分子的化身。","ctx":"奈保尔《河湾》的思想内容/主题","id":"c01373","type":"card","front":"展现移民面临的文化冲突和流亡人、边缘人的不幸际遇……","back":"展现移民面临的文化冲突和流亡人、边缘人的不幸际遇。故事的主人公和叙事者叫萨林姆，萨林姆是一个没有家的人，一个漂泊的无根人，一代流亡知识分子的化身。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"《河湾》最引人注目的艺术特色是象征手法的使用。两个鲜明的象征：“大人物、水葫芦”。","ctx":"奈保尔《河湾》的艺术特色-象征手法","id":"c01374","type":"card","front":"▁▁▁▁最引人注目的艺术特色是象征手法的使用。两个鲜明的象征：“大人物、水葫芦”。","back":"《河湾》最引人注目的艺术特色是象征手法的使用。两个鲜明的象征：“大人物、水葫芦”。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"“大人物”就是后殖民时期极权主义统治的缩影与象征。“大人物”是非洲中部新近独立的一个国家的总统，尽管他穿着华贵、仪表堂堂、举手投足模仿戴高乐的风度，但是他“金玉其外，败絮其中”，徒有其表而没有治理国家的本领。","ctx":"奈保尔《河湾》的艺术特色-象征手法","id":"c01377","type":"card","front":"“大人物”就是后殖民时期极权主义统治的缩影与象征……","back":"“大人物”就是后殖民时期极权主义统治的缩影与象征。“大人物”是非洲中部新近独立的一个国家的总统，尽管他穿着华贵、仪表堂堂、举手投足模仿戴高乐的风度，但是他“金玉其外，败絮其中”，徒有其表而没有治理国家的本领。"},{"ch":"第一部分 西方文学 · 第十一章 20世纪文学（下）","sec":"","tags":[],"src":"“水葫芦”的意象贯穿了《河湾》整部小说的始终——“水葫芦”的象征有多层含义。①一是象征着新生事物。共和国独立后的河湾小镇，大量的新事物涌入如同“水葫芦”的侵入，让当地人措手不及、无所适从。它象征当时的非洲人无力辨别和接受新事物，反而会被新事物困住了手脚。②二是象征着历史的见证者。“水葫芦”见证了河湾小镇的历史变迁，见证了后殖民时代非洲第三世界国家人们生活的变化、动荡与不安。人们如同“水葫芦”一样漫无目的地飘荡，看不到出路，也没有未来与希望。","ctx":"奈保尔《河湾》的艺术特色-象征手法","id":"c01378","type":"card","front":"“水葫芦”的意象贯穿了▁▁▁▁整部小说的始终——“水葫芦”的象征有多层含义。①一是象征着新生事物。共和国独立后的河湾小镇，大量的新事物涌入如同“水葫芦”的侵入，让当地人措手不及、无所适从。它象征当时的非洲人无力辨别和接受新事物，反而会被新事物困住了手脚。②二是象征着历史的见证者。“水葫芦”见证了河湾小镇的历史变迁，见证了后殖民时代非洲第三世界国家人们生活的变化、动荡与不安。人们如同“水葫芦”一样漫无目的地飘荡，看不到出路，也没有未来与希望。","back":"“水葫芦”的意象贯穿了《河湾》整部小说的始终——“水葫芦”的象征有多层含义。①一是象征着新生事物。共和国独立后的河湾小镇，大量的新事物涌入如同“水葫芦”的侵入，让当地人措手不及、无所适从。它象征当时的非洲人无力辨别和接受新事物，反而会被新事物困住了手脚。②二是象征着历史的见证者。“水葫芦”见证了河湾小镇的历史变迁，见证了后殖民时代非洲第三世界国家人们生活的变化、动荡与不安。人们如同“水葫芦”一样漫无目的地飘荡，看不到出路，也没有未来与希望。"},{"ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":[],"src":"鲜明的民间文学色彩。","ctx":"简述古代东方文学的主要特征","id":"c01381","type":"card","front":"鲜明的民间文学色彩……","back":"鲜明的民间文学色彩。"},{"ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":[],"src":"强烈的宗教色彩。","ctx":"简述古代东方文学的主要特征","id":"c01382","type":"card","front":"强烈的宗教色彩……","back":"强烈的宗教色彩。"},{"ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":[],"src":"《吉尔伽美什》是古巴比伦神话故事的总汇，是两河流域早期文明的结晶，是世界上迄今发现最早的完整的英雄史诗，在世界古代文学史上具有特殊的意义。","ctx":"《吉尔伽美什》","id":"c01383","type":"card","front":"▁▁▁▁是古巴比伦神话故事的总汇，是两河流域早期文明的结晶，是世界上迄今发现最早的完整的英雄史诗，在世界古代文学史上具有特殊的意义。","back":"《吉尔伽美什》是古巴比伦神话故事的总汇，是两河流域早期文明的结晶，是世界上迄今发现最早的完整的英雄史诗，在世界古代文学史上具有特殊的意义。"},{"ch":"第二部分 东方文学 · 第十二章 古代文学","sec":"","tags":[],"src":"世界文学中最古老的史诗，由 12 块泥板组成，达到苏美尔—巴比伦文学的最高峰。","ctx":"《吉尔伽美什》","id":"c01386","type":"card","front":"世界文学中最古 二部分 东方文学 · 第十六章 当代文学","sec":"","tags":[],"src":"象征手法的使用。题目象征：主人公卢里的不顾羞耻，象征众人的不顾廉耻；现实中的耻辱之事，小说中人物内心的耻辱之感；个人的耻辱经历，还象征南非殖民地的耻辱历史。","ctx":"库切长篇小说《耻》的艺术特点","id":"c01733","type":"card","front":"象征手法的使用……","back":"象征手法的使用。题目象征：主人公卢里的不顾羞耻，象征众人的不顾廉耻；现实中的耻辱之事，小说中人物内心的耻辱之感；个人的耻辱经历，还象征南非殖民地的耻辱历史。"},{"ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":[],"src":"鲜明对比的手法。人物和故事构成了多组对比。","ctx":"库切长篇小说《耻》的艺术特点","id":"c01734","type":"card","front":"鲜明对比的手法……","back":"鲜明对比的手法。人物和故事构成了多组对比。"},{"ch":"第二部分 东方文学 · 第十六章 当代文学","sec":"","tags":[],"src":"采用了互文性手法。卢里写作歌剧《拜伦在意大利》。","ctx":"库切长篇小说《耻》的艺术特点","id":"c01735","type":"card","front":"采用了互文性手法。卢里写作歌剧▁▁▁▁。","back":"采用了互文性手法。卢里写作歌剧《拜伦在意大利》。"},{"id":"s00001","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1310 简答"],"stem":"简述：古希腊文学的特征","points":["鲜明的人本色彩和命运观念。","现实主义和浪漫主义并存。","种类繁多，具有开创性。"],"src":"鲜明的人本色彩和命运观念。／现实主义和浪漫主义并存。／种类繁多，具有开创性。"},{"id":"s00002","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1710 名词"],"stem":"名词解释：新喜剧","points":["古希腊“希腊化”时期的喜剧；","不谈政治，以描写爱情故事和家庭关系为主要内容。又称“世态喜剧”。","最著名的新喜剧作家：雅典的米南德，《恨世者》《萨摩斯女子》。"],"src":"古希腊“希腊化”时期的喜剧；／不谈政治，以描写爱情故事和家庭关系为主要内容。又称“世态喜剧”。／最著名的新喜剧作家：雅典的米南德，《恨世者》《萨摩斯女子》。"},{"id":"s00003","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1704 名词"],"stem":"名词解释：《埃涅阿斯纪》","points":["维吉尔的代表作；是欧洲文人史诗的开端，也是世界文学史上第一部文人史诗。【高频考点】","主题：作品主要颂扬罗马帝国的神圣，表现先王建国的艰辛。通过游地狱的情节，歌颂凯撒和屋大维的功绩，肯定罗马帝国统治世界的使命，具有鲜明的政治倾向性。","艺术特点：与荷马史诗相似，整体布局和结构安排上的模仿，比喻、重复、对比的运用等；塑造了埃涅阿斯这一民族英雄和理想君王的美好形象。"],"src":"维吉尔的代表作；是欧洲文人史诗的开端，也是世界文学史上第一部文人史诗。【高频考点】／主题：作品主要颂扬罗马帝国的神圣，表现先王建国的艰辛。通过游地狱的情节，歌颂凯撒和屋大维的功绩，肯定罗马帝国统治世界的使命，具有鲜明的政治倾向性。／艺术特点：与荷马史诗相似，整体布局和结构安排上的模仿，比喻、重复、对比的运用等；塑造了埃涅阿斯这一民族英雄和理想君王的美好形象。"},{"id":"s00004","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["总结"],"stem":"简述：希腊神话的内容","points":["神的故事包括神的产生、神的谱系、神的活动、神的创造等。【★★★★★】【奥林匹斯神系-名词:2410多选】：12主神。阿波罗（太阳神），三个摩伊拉（命运女神），赫拉（天后），雅典娜（智慧女神），宙斯（众神之主），阿弗洛狄忒（爱神），阿忒弥斯（月神），缪斯（文艺女神）。","英雄传说起源于祖先崇拜，它是古希腊人对远古历史和对自然界斗争的一种艺术回顾。①主人公大都是人与神的后代，多是半人半神的英雄，体力过人，英勇非凡，体现人类征服自然的豪迈气概和顽强意志，成为古代人民集体力量和智慧的化身。②包括：赫拉克勒斯建立12件大功的故事，伊阿宋帅众英雄取金羊毛的故事，俄狄浦斯的故事，特洛伊战争的故事，奥德修斯的故事，忒修斯的故事。","希腊神话中还有许多反映古希腊人民生产劳动的传说，如普罗米修斯盗取火种给人类而受罚的故事。","希腊神话在世界各民族神话中发展得特别完美，而且有自己鲜明的特色。"],"src":"神的故事包括神的产生、神的谱系、神的活动、神的创造等。【★★★★★】【奥林匹斯神系-名词:2410多选】：12主神。阿波罗（太阳神），三个摩伊拉（命运女神），赫拉（天后），雅典娜（智慧女神），宙斯（众神之主），阿弗洛狄忒（爱神），阿忒弥斯（月神），缪斯（文艺女神）。／英雄传说起源于祖先崇拜，它是古希腊人对远古历史和对自然界斗争的一种艺术回顾。①主人公大都是人与神的后代，多是半人半神的英雄，体力过人"},{"id":"s00005","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["0901 简答","1410简答","2210简答"],"stem":"简述：古希腊神话的特点","points":["神是高度人格化的，神、人同形同性。","体现浓郁的人本主义色彩。","希腊神话想象丰富，内容生动，故事优美。"],"src":"神是高度人格化的，神、人同形同性。／体现浓郁的人本主义色彩。／希腊神话想象丰富，内容生动，故事优美。"},{"id":"s00006","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["简答考纲","小蒋说：常与特点一起答"],"stem":"简述：古希腊神话的影响","points":["地位和影响无可比拟，思想性和艺术性达到了相当的高度。","是后世题材来源：如荷马史诗、古希腊悲剧、欧洲浪漫主义作家","形成研究神话的体系：神话—原型批评。","对欧洲思想文化方面的影响源远流长。","人物形象和故事传说成为典故用在日常生活中，成为世界性用语。"],"src":"地位和影响无可比拟，思想性和艺术性达到了相当的高度。／是后世题材来源：如荷马史诗、古希腊悲剧、欧洲浪漫主义作家／形成研究神话的体系：神话—原型批评。／对欧洲思想文化方面的影响源远流长。／人物形象和故事传说成为典故用在日常生活中，成为世界性用语。"},{"id":"s00007","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1604名词","2104","2204","2504 名词"],"stem":"名词解释：荷马史诗","points":["荷马史诗包括《伊利亚特》（《伊利昂纪》）和《奥德修纪》（《奥德赛》），","是古希腊最早的两部史诗，相传由诗人荷马所作，故称荷马史诗。","前者以部落战争为主要内容，后者写战争结束后的海上漂流。歌颂集体主义和英雄主义精神。"],"src":"荷马史诗包括《伊利亚特》（《伊利昂纪》）和《奥德修纪》（《奥德赛》），／是古希腊最早的两部史诗，相传由诗人荷马所作，故称荷马史诗。／前者以部落战争为主要内容，后者写战争结束后的海上漂流。歌颂集体主义和英雄主义精神。"},{"id":"s00008","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["伊利昂的故事"],"stem":"简述：《伊利亚特》","points":["主题：战争。交战双方：希腊联军vs特洛伊。","故事结构核心：阿喀琉斯的两次愤怒。起因：“不和的金苹果”。","全诗24卷，15693行。这是一部描写部落战争的英雄史诗。史诗以“阿喀琉斯的愤怒”开篇，希腊联军中最勇猛的主将是阿喀琉斯，全诗在特洛伊人为赫克托耳举行葬礼中结束。"],"src":"主题：战争。交战双方：希腊联军vs特洛伊。／故事结构核心：阿喀琉斯的两次愤怒。起因：“不和的金苹果”。／全诗24卷，15693行。这是一部描写部落战争的英雄史诗。史诗以“阿喀琉斯的愤怒”开篇，希腊联军中最勇猛的主将是阿喀琉斯，全诗在特洛伊人为赫克托耳举行葬礼中结束。"},{"id":"s00009","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["奥德修斯历险记"],"stem":"简述：《奥德修纪》","points":["故事情节：海上冒险。奥德修斯代表“被理想化的早期奴隶主”。","全诗24卷，12110行，这是一部反映氏族社会至奴隶社会初期人类对自然和社会斗争的史诗。史诗写的是特洛伊战争结束后，奥德修斯从特洛伊回国途中在海上漂流10年期间发生的故事。"],"src":"故事情节：海上冒险。奥德修斯代表“被理想化的早期奴隶主”。／全诗24卷，12110行，这是一部反映氏族社会至奴隶社会初期人类对自然和社会斗争的史诗。史诗写的是特洛伊战争结束后，奥德修斯从特洛伊回国途中在海上漂流10年期间发生的故事。"},{"id":"s00010","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["简答","论述考点"],"stem":"简述：荷马史诗的思想内容","points":["内容丰富，描绘由氏族社会向奴隶社会过渡时期希腊的社会生活和人们的精神面貌，古希腊百科全书。","《伊利亚特》展现惊心动魄的战争场景，歌颂与异族战斗的英雄，歌颂氏族领袖的英雄品质。","《奥德修纪》表现一场争夺和维护私有财产的战争。"],"src":"内容丰富，描绘由氏族社会向奴隶社会过渡时期希腊的社会生活和人们的精神面貌，古希腊百科全书。／《伊利亚特》展现惊心动魄的战争场景，歌颂与异族战斗的英雄，歌颂氏族领袖的英雄品质。／《奥德修纪》表现一场争夺和维护私有财产的战争。"},{"id":"s00011","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":[],"stem":"简述：荷马史诗（《伊利亚特》+《奥德修纪》）的思想内容和艺术成就","points":["荷马史诗的艺术成就【1804论述—论述荷马史诗的艺术成就/荷马史诗的思想意义和艺术价值】➢ 两部史诗反映的基本思想：表现了人在自然及神斗争的过程中，人的奋斗精神、进取精神和人的决定因素。也反映了当时社会的政治、经济、文化、风俗等各方面情况。颂扬了在奴隶制初期形成的这种新的家庭生活伦理道德风尚及一夫一妻制。➢ 艺术价值/特点：【★★★★★★】","结构紧凑、安排巧妙。对于两个10年中所发生的事，分别只表现了其中51天和40天中的内容。","史诗塑造了众多英雄形象。【小蒋提醒：此处可分析：阿喀琉斯、奥德修斯、赫克托耳的形象】如希腊主将阿喀琉斯是男性美的典范，集年轻、美貌、勇敢、钟情、义气、凶狠、善良于一身，性格立体多元。","史诗的诗句流畅、自然优美、比喻生动形象，借助植物来喻人。后人赞誉“荷马式的比喻”。还有固定的程式化的形容词和称谓。","荷马史诗是欧洲文学中最优秀的作品，在世界文学史上享有崇高的地位，被誉为“希腊人由野蛮时代进入文明时代的主要遗产。”"],"src":"荷马史诗的艺术成就【1804论述—论述荷马史诗的艺术成就/荷马史诗的思想意义和艺术价值】➢ 两部史诗反映的基本思想：表现了人在自然及神斗争的过程中，人的奋斗精神、进取精神和人的决定因素。也反映了当时社会的政治、经济、文化、风俗等各方面情况。颂扬了在奴隶制初期形成的这种新的家庭生活伦理道德风尚及一夫一妻制。➢ 艺术价值/特点：【★★★★★★】／结构紧凑、安排巧妙。对于两个10年中所发生的事，分别只表"},{"id":"s00012","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1810 简答题","2110 名词"],"stem":"分析阿喀琉斯的形象","points":["希腊英雄阿喀琉斯是最具鲜明个性的形象。他是神与人之子，是男性美的典范。","他的性格是立体多元的，集勇敢、义气、暴躁、凶狠、善良、诚挚于一身。","为了部落集体的利益，他作战勇猛过人，表现出一种死而无怨的英雄主义精神。","维护个人荣誉和尊严。"],"src":"希腊英雄阿喀琉斯是最具鲜明个性的形象。他是神与人之子，是男性美的典范。／他的性格是立体多元的，集勇敢、义气、暴躁、凶狠、善良、诚挚于一身。／为了部落集体的利益，他作战勇猛过人，表现出一种死而无怨的英雄主义精神。／维护个人荣誉和尊严。"},{"id":"s00013","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1610 简答"],"stem":"简析荷马史诗中的奥德修斯形象","points":["奥德修斯是被理想化了的早期奴隶主形象。","他是一个英勇顽强、智慧过人的英雄形象。","是性格复杂的人物，不为荣华富贵所动，美女的诱惑动摇不了他对妻子的感情，又残酷、狡猾和自私。","史诗肯定了他维护私有财产和一夫一妻这种新的社会制度所作的斗争，体现了人的个人意识的觉醒。"],"src":"奥德修斯是被理想化了的早期奴隶主形象。／他是一个英勇顽强、智慧过人的英雄形象。／是性格复杂的人物，不为荣华富贵所动，美女的诱惑动摇不了他对妻子的感情，又残酷、狡猾和自私。／史诗肯定了他维护私有财产和一夫一妻这种新的社会制度所作的斗争，体现了人的个人意识的觉醒。"},{"id":"s00014","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["选择","简答"],"stem":"简析荷马史诗中的赫克托耳形象","points":["赫克托耳是特洛伊的主将，老国王之子。","是一个十分感人的氏族领袖形象。他作战勇猛，指挥英明，视保家卫国为己任。","与阿喀琉斯相比，赫克托耳更具责任感和集体主义精神。战场上他不畏惧对方比自己强悍，一心要战胜对方，把为部落而死看成是一种荣誉。","赫克托耳的英雄主义更富于悲剧色彩，明知自己不是阿喀琉斯的对手，明知要打败仗，但仍然誓死战斗。这种刚强、威武和特别重视战斗荣誉的英雄主义精神，是荷马时代的风尚。"],"src":"赫克托耳是特洛伊的主将，老国王之子。／是一个十分感人的氏族领袖形象。他作战勇猛，指挥英明，视保家卫国为己任。／与阿喀琉斯相比，赫克托耳更具责任感和集体主义精神。战场上他不畏惧对方比自己强悍，一心要战胜对方，把为部落而死看成是一种荣誉。／赫克托耳的英雄主义更富于悲剧色彩，明知自己不是阿喀琉斯的对手，明知要打败仗，但仍然誓死战斗。这种刚强、威武和特别重视战斗荣誉的英雄主义精神，是荷马时代的风尚。"},{"id":"s00015","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1910 单选"],"stem":"简述：古希腊戏剧起源于","points":["酒神祭祀（酒神）"],"src":"酒神祭祀（酒神）"},{"id":"s00016","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1804 多选"],"stem":"简述：古希腊三大悲剧诗人","points":["埃斯库罗斯、索福克勒斯、欧里庇得斯"],"src":"埃斯库罗斯、索福克勒斯、欧里庇得斯"},{"id":"s00017","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["2310 名词"],"stem":"名词解释：埃斯库罗斯","points":["被誉为古希腊“悲剧之父”。《波斯人》、三联剧《普罗米修斯》"],"src":"被誉为古希腊“悲剧之父”。《波斯人》、三联剧《普罗米修斯》"},{"id":"s00018","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["2010","2410 名词"],"stem":"名词解释：索福克勒斯《俄狄浦斯》","points":["索福克勒斯：戏剧艺术的荷马。古希腊著名的悲剧作家，代表作《俄狄浦斯王》。","悲剧主要表现个人意志与命运的冲突，其创作标志着希腊悲剧进入成熟阶段。【2404 单选】《安提戈涅》：雅典极盛而衰时期的社会动荡和人们对即将到来的变革的恐慌与困惑。"],"src":"索福克勒斯：戏剧艺术的荷马。古希腊著名的悲剧作家，代表作《俄狄浦斯王》。／悲剧主要表现个人意志与命运的冲突，其创作标志着希腊悲剧进入成熟阶段。【2404 单选】《安提戈涅》：雅典极盛而衰时期的社会动荡和人们对即将到来的变革的恐慌与困惑。"},{"id":"s00019","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1904 名词"],"stem":"名词解释：《俄狄浦斯王》","points":["①是索福克勒斯的著名悲剧。②以希腊神话中关于忒拜王室的故事为题材。③主要表现个人意志和命运的冲突。④亚里士多德认为《俄狄浦斯王》是“十全十美的悲剧”，是希腊悲剧的典范。"],"src":"①是索福克勒斯的著名悲剧。②以希腊神话中关于忒拜王室的故事为题材。③主要表现个人意志和命运的冲突。④亚里士多德认为《俄狄浦斯王》是“十全十美的悲剧”，是希腊悲剧的典范。"},{"id":"s00020","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["选择","名词"],"stem":"名词解释：欧里庇得斯","points":["欧里庇得斯：舞台上的哲学家。《特洛伊妇女》、《美狄亚》（以妇女问题为题材，同情妇女、为妇女地位的低下的命运悲惨鸣不平，对男女不平等进行批判。被誉为“心理戏剧鼻祖”）"],"src":"欧里庇得斯：舞台上的哲学家。《特洛伊妇女》、《美狄亚》（以妇女问题为题材，同情妇女、为妇女地位的低下的命运悲惨鸣不平，对男女不平等进行批判。被誉为“心理戏剧鼻祖”）"},{"id":"s00021","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["1301 简答"],"stem":"简述：古希腊戏剧中的命运观念和人本思想","points":["人的意志与命运冲突是古希腊悲剧中常见的主题，随着社会的发展而发生变化。","埃斯库罗斯深信命运的存在与不可抗拒，把命运看做具体的神物[命运支配人的一切/神]，但有时也强调人的意志力，笔下的命运站在正义事业一边。","索福克勒斯也相信命运，但把它看成一种不可捉摸的神秘力量[不是具体的神物]。命运虽不可抗拒，但命运有时不尽合理、甚至邪恶，人应而不合理的命运抗议/斗争。","欧里庇得斯对命运的存在表示怀疑，不再相信命运。认为人的命运取决于自己的行为，强调普通人应该而且能够主宰自己的命运。"],"src":"人的意志与命运冲突是古希腊悲剧中常见的主题，随着社会的发展而发生变化。／埃斯库罗斯深信命运的存在与不可抗拒，把命运看做具体的神物[命运支配人的一切/神]，但有时也强调人的意志力，笔下的命运站在正义事业一边。／索福克勒斯也相信命运，但把它看成一种不可捉摸的神秘力量[不是具体的神物]。命运虽不可抗拒，但命运有时不尽合理、甚至邪恶，人应而不合理的命运抗议/斗争。／欧里庇得斯对命运的存在表示怀疑，不再相信"},{"id":"s00022","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["简答考点"],"stem":"简述：古希腊悲剧的特征","points":["取材：基本取材于神话、传说和荷马史诗，极少数以当代重大事件为题材。","内容：内容丰富，主题严肃，有相当的哲理深度，虽带有浓厚的命运观念或迷信色彩，但反映当代的社会生活和斗争。","艺术形式：悲剧由话语和唱段组成，布局一般包含开场白、入场歌、场、场次之间的唱段、终场五部分，有的悲剧直接从入场歌开始。"],"src":"取材：基本取材于神话、传说和荷马史诗，极少数以当代重大事件为题材。／内容：内容丰富，主题严肃，有相当的哲理深度，虽带有浓厚的命运观念或迷信色彩，但反映当代的社会生活和斗争。／艺术形式：悲剧由话语和唱段组成，布局一般包含开场白、入场歌、场、场次之间的唱段、终场五部分，有的悲剧直接从入场歌开始。"},{"id":"s00023","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["生僻简答考点"],"stem":"简述：三大悲剧诗人对希腊悲剧的发展做出的重要贡献","points":["埃斯库罗斯：把演员从一个增加到两个，加强了对话部分；演出技巧首先采用布景、道具，戏剧服装、演员面具也初步定型化；希腊悲剧的结构程式和艺术特色在他的剧中已基本形成。","索福克勒斯：在悲剧中采用第三个演员，加强了戏剧对白与动作，打破“三联剧”的传统。他的悲剧矛盾冲突尖锐，结构精巧紧凑，风格质朴明快，合唱词优美。","欧里庇得斯：开创了后来戏剧心理线索和情节线索二者结合的模式，他的开场白、内心独白、音乐等技巧对后世也产生了深远的影响。"],"src":"埃斯库罗斯：把演员从一个增加到两个，加强了对话部分；演出技巧首先采用布景、道具，戏剧服装、演员面具也初步定型化；希腊悲剧的结构程式和艺术特色在他的剧中已基本形成。／索福克勒斯：在悲剧中采用第三个演员，加强了戏剧对白与动作，打破“三联剧”的传统。他的悲剧矛盾冲突尖锐，结构精巧紧凑，风格质朴明快，合唱词优美。／欧里庇得斯：开创了后来戏剧心理线索和情节线索二者结合的模式，他的开场白、内心独白、音乐等技巧"},{"id":"s00024","type":"short","ch":"第一部分 西方文学 · 第一章 古代文学","sec":"","tags":["简答考点"],"stem":"简述：古希腊喜剧的基本特征","points":["多为政治讽刺剧和社会问题剧，取材当代现实生活，对人们普遍关心的重大社会问题发表意见，比古希腊悲剧更有现实性和政治倾向性。","古希腊喜剧的情节荒诞离奇，风格幽默滑稽，人物形象及台词动作夸张粗俗，表演形式轻松，表达严肃的主题。 【阿里斯托芬：喜剧之父，《阿卡奈人》《鸟》】"],"src":"多为政治讽刺剧和社会问题剧，取材当代现实生活，对人们普遍关心的重大社会问题发表意见，比古希腊悲剧更有现实性和政治倾向性。／古希腊喜剧的情节荒诞离奇，风格幽默滑稽，人物形象及台词动作夸张粗俗，表演形式轻松，表达严肃的主题。 【阿里斯托芬：喜剧之父，《阿卡奈人》《鸟》】"},{"id":"s00025","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["选择","简答","2204","2504多选"],"stem":"简述：中古文学的特征","points":["宗教色彩、神秘色彩、民间文学色彩、开创性"],"src":"宗教色彩、神秘色彩、民间文学色彩、开创性"},{"id":"s00026","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["高频选择"],"stem":"简述：中古文学的主要文学样式","points":["①教会文学；②骑士文学；③英雄史诗和谣曲；④城市文学"],"src":"①教会文学；②骑士文学；③英雄史诗和谣曲；④城市文学"},{"id":"s00027","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["1310","1810名词"],"stem":"名词解释：教会文学","points":["中世纪欧洲盛行的长期占统治地位的正统文学，大多取材《圣经》。","主要指教会和修士写的文学作品；使用拉丁文/希腊文/教会斯拉夫文；有圣经故事、圣徒传、祷告文等。","目的：宣传基督教义、宣扬禁欲主义/来世主义思想；维护封建主阶级和教会势力的统治。","艺术：多用梦幻故事的形式和象征寓意的手法，发展成熟。"],"src":"中世纪欧洲盛行的长期占统治地位的正统文学，大多取材《圣经》。／主要指教会和修士写的文学作品；使用拉丁文/希腊文/教会斯拉夫文；有圣经故事、圣徒传、祷告文等。／目的：宣传基督教义、宣扬禁欲主义/来世主义思想；维护封建主阶级和教会势力的统治。／艺术：多用梦幻故事的形式和象征寓意的手法，发展成熟。"},{"id":"s00028","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["1110","1504","1910名词","2510名词"],"stem":"名词解释：骑士文学","points":["欧洲封建骑士制度的产物，世俗封建主的文学。骑士精神：“忠君/护教/行侠”。","反映骑士与贵妇之间的“典雅的爱情”，肯定对现世生活的追求。","法国的成就最高，分为骑士抒情诗和骑士叙事诗两种。"],"src":"欧洲封建骑士制度的产物，世俗封建主的文学。骑士精神：“忠君/护教/行侠”。／反映骑士与贵妇之间的“典雅的爱情”，肯定对现世生活的追求。／法国的成就最高，分为骑士抒情诗和骑士叙事诗两种。"},{"id":"s00029","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["2304多选"],"stem":"简述：英雄史诗","points":["在民间文学基础上发展，分早期英雄史诗和后期英雄史诗两种","早期英雄史诗：①形成于中世纪初期，是氏族社会末期各部落人民的口头创作和集体智慧的结晶。②封建制度确立前氏族部落生活/历史，赞美部落英雄业绩，群体意识和英雄主义精神。③作品：《贝奥武甫》《希尔德布兰特之歌》芬兰《卡列瓦拉》、冰岛的“埃达”和“萨迦”等。","后期英雄史诗①产生于中世纪中期，封建制度发展以后的产物。②中心主题是爱国主义。③代表作品：法国《罗兰之歌》；西班牙《熙德之歌》；德国《尼伯龙根之歌》；俄罗斯《伊戈尔远征记》。"],"src":"在民间文学基础上发展，分早期英雄史诗和后期英雄史诗两种／早期英雄史诗：①形成于中世纪初期，是氏族社会末期各部落人民的口头创作和集体智慧的结晶。②封建制度确立前氏族部落生活/历史，赞美部落英雄业绩，群体意识和英雄主义精神。③作品：《贝奥武甫》《希尔德布兰特之歌》芬兰《卡列瓦拉》、冰岛的“埃达”和“萨迦”等。／后期英雄史诗①产生于中世纪中期，封建制度发展以后的产物。②中心主题是爱国主义。③代表作品：法"},{"id":"s00030","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["0910","1404名词"],"stem":"名词解释：市民文学","points":["也称城市文学，11世纪随着城市的出现和市民阶级的形成而产生的文学。","大多是民间创作，直接取材于现实，反映市民的审美情趣，强调“机智”和“乐观”，颠覆传统道德观念。","主要体裁有韵文故事、讽刺故事、抒情诗和市民戏剧。","《列那狐传奇》：市民的典型。①以动物寓人，动物间的斗争反映城市内部各阶层间的矛盾冲突；在动物故事的基础上发展起来的。②列那狐是典型的市民阶级，在它身上体现市民阶级的二重性。③运用喜剧手法，通过动物的形象歌颂市民阶级的机智讽刺、嘲弄贵族僧侣等统治阶级。"],"src":"也称城市文学，11世纪随着城市的出现和市民阶级的形成而产生的文学。／大多是民间创作，直接取材于现实，反映市民的审美情趣，强调“机智”和“乐观”，颠覆传统道德观念。／主要体裁有韵文故事、讽刺故事、抒情诗和市民戏剧。／《列那狐传奇》：市民的典型。①以动物寓人，动物间的斗争反映城市内部各阶层间的矛盾冲突；在动物故事的基础上发展起来的。②列那狐是典型的市民阶级，在它身上体现市民阶级的二重性。③运用喜剧手法"},{"id":"s00031","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["选择","名词"],"stem":"名词解释：《神曲》","points":["采用中古梦幻文学的形式，根据基督教宇宙三界的观念，描写了梦游三界的历程。","全诗分《地狱》《炼狱》《天堂》三部，每部33歌，加序曲共100歌，计14233行。但丁的诗集《新生》：但丁献给贝雅特丽齐的爱情诗集。8.《神曲》的主题思想：","从字面意义论，全部作品写的是“亡灵的遭遇”，即人死后在三界当中的情况。","从寓言意义上看，“其主题是人”。","《神曲》实际上是一部以神学宗教意识作为形式而把人学内涵作为本质的作品[新旧两个时代矛盾统一]。"],"src":"采用中古梦幻文学的形式，根据基督教宇宙三界的观念，描写了梦游三界的历程。／全诗分《地狱》《炼狱》《天堂》三部，每部33歌，加序曲共100歌，计14233行。但丁的诗集《新生》：但丁献给贝雅特丽齐的爱情诗集。8.《神曲》的主题思想：／从字面意义论，全部作品写的是“亡灵的遭遇”，即人死后在三界当中的情况。／从寓言意义上看，“其主题是人”。／《神曲》实际上是一部以神学宗教意识作为形式而把人学内涵作为本质"},{"id":"s00032","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["1604 简答"],"stem":"简述《神曲》的思想内容","points":["宗教性。结构框架和思想观念都传达着基督教的宗教意识；","人学内涵。但丁笔下的上帝在代表了基督教的爱与信仰的同时，又代表了人间的爱与正义。在上帝的权威背后隐藏的是世俗原则和人性角度。"],"src":"宗教性。结构框架和思想观念都传达着基督教的宗教意识；／人学内涵。但丁笔下的上帝在代表了基督教的爱与信仰的同时，又代表了人间的爱与正义。在上帝的权威背后隐藏的是世俗原则和人性角度。"},{"id":"s00033","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["1404 论述","2410 多选"],"stem":"试述《神曲》的人学内涵","points":["但丁笔下的上帝，代表了基督教的爱与信仰，又代表了人间的爱与正义。","其人学内涵还表现在两个主要的人物形象即维吉尔和贝雅特丽齐身上：维吉尔象征智慧和理性，贝雅特丽齐则是世俗之爱与信仰之爱的结合。","这种人类模式的设计，体现了但丁对人的本质的探索，对个体人格的肯定，对主体性的高扬。"],"src":"但丁笔下的上帝，代表了基督教的爱与信仰，又代表了人间的爱与正义。／其人学内涵还表现在两个主要的人物形象即维吉尔和贝雅特丽齐身上：维吉尔象征智慧和理性，贝雅特丽齐则是世俗之爱与信仰之爱的结合。／这种人类模式的设计，体现了但丁对人的本质的探索，对个体人格的肯定，对主体性的高扬。"},{"id":"s00034","type":"short","ch":"第一部分 西方文学 · 第二章 中古文学","sec":"","tags":["1704","1110 简答题"],"stem":"简述《神曲》的艺术特色","points":["构思严谨，结构完整。","象征手法。黑森林象征邪恶的世界，维吉尔象征理性，贝雅特丽齐象征爱。","虚构与写实结合。","人物形象丰富多彩。","俗语写作。"],"src":"构思严谨，结构完整。／象征手法。黑森林象征邪恶的世界，维吉尔象征理性，贝雅特丽齐象征爱。／虚构与写实结合。／人物形象丰富多彩。／俗语写作。"},{"id":"s00035","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1201","1101","2204 名词"],"stem":"名词解释：文艺复兴","points":["14至16世纪发生在欧洲的一场资产阶级思想文化运动。","（新兴资产阶级）以人文主义为中心思想，借助于古希腊文化和自然科学，以世俗的形式反对封建制度和宗教势力。 [发端于意大利]","目的：摆脱封建思想的桎梏，建立起适应资本主义生产关系的新的意识形态。"],"src":"14至16世纪发生在欧洲的一场资产阶级思想文化运动。／（新兴资产阶级）以人文主义为中心思想，借助于古希腊文化和自然科学，以世俗的形式反对封建制度和宗教势力。 [发端于意大利]／目的：摆脱封建思想的桎梏，建立起适应资本主义生产关系的新的意识形态。"},{"id":"s00036","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["名词要答特征"],"stem":"名词解释：人文主义","points":["是文艺复兴时期资产阶级进步文学的中心思想，核心是对“人”的肯定"],"src":"是文艺复兴时期资产阶级进步文学的中心思想，核心是对“人”的肯定"},{"id":"s00037","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["0910","1710","2310 简答","1301 名词","1404 多选"],"stem":"简述人文主义的基本特征","points":["人文主义思想的核心是对人的肯定，具体表现为：","以人性反对神性。","提倡科学，以理性反对蒙昧主义。","以个性解放反对禁欲主义。","主张统一，反对封建割据。"],"src":"人文主义思想的核心是对人的肯定，具体表现为：／以人性反对神性。／提倡科学，以理性反对蒙昧主义。／以个性解放反对禁欲主义。／主张统一，反对封建割据。"},{"id":"s00038","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["选择","简答","2510 简答"],"stem":"简述：人文主义文学的基本特征","points":["以人文主义思想为内容，具有鲜明的反封建、反教会色彩。","注重创作手法的写实性。","表现民族意识的觉醒与民族性的追求。"],"src":"以人文主义思想为内容，具有鲜明的反封建、反教会色彩。／注重创作手法的写实性。／表现民族意识的觉醒与民族性的追求。"},{"id":"s00039","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1904 简答","2210 名词","2404 单选"],"stem":"名词解释：《十日谈》","points":["简述薄伽丘《十日谈》的思想内容","代表作是《十日谈》，以反对禁欲主义为主要思想。","表现反教会、教权的思想，揭露教士们的荒唐丑恶的行径和伪善的品性。","热情赞美人性，表达崇尚爱情、肯定世俗生活的思想，宣扬个性解放的主张，抨击封建社会中的等级门第观念，揭露扼杀破坏/摧残人生幸福和爱情自由的封建力量。","赞美商人、手工业者的聪明、勇敢，肯定了新兴资产阶级的生活态度。","《十日谈》结构一框形结构。10个男女青年[逃黑死病住乡间]每人每天讲一个故事，十天讲一百个故事。"],"src":"简述薄伽丘《十日谈》的思想内容／代表作是《十日谈》，以反对禁欲主义为主要思想。／表现反教会、教权的思想，揭露教士们的荒唐丑恶的行径和伪善的品性。／热情赞美人性，表达崇尚爱情、肯定世俗生活的思想，宣扬个性解放的主张，抨击封建社会中的等级门第观念，揭露扼杀破坏/摧残人生幸福和爱情自由的封建力量。／赞美商人、手工业者的聪明、勇敢，肯定了新兴资产阶级的生活态度。／《十日谈》结构一框形结构。10个男女青年["},{"id":"s00040","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1210 名词","1804 名词","2404 单选"],"stem":"名词解释：七星诗社","points":["“七星诗社”是文艺复兴时期法国的诗人团体。[表现脱离普通大众的贵族倾向]","由七个诗人组成，研究借鉴古希腊罗马文学，革新法兰西诗歌形式。","代表诗人是龙沙。"],"src":"“七星诗社”是文艺复兴时期法国的诗人团体。[表现脱离普通大众的贵族倾向]／由七个诗人组成，研究借鉴古希腊罗马文学，革新法兰西诗歌形式。／代表诗人是龙沙。"},{"id":"s00041","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["选择","名词题"],"stem":"名词解释：拉伯雷《巨人传》","points":["作品：法国人文主义文学平民倾向的杰出代表，5 卷集长篇小说《巨人传》。","主题：赞美人的世俗幸福追求，肯定人文主义教育和知识对人精神发展的重要作用，展示人文主义理想；通过两个巨人的见闻，批判封建教会的虚伪和封建国家上层建筑的腐朽。体现人文主义者对个性解放的追求，对平等、自由、理想社会的向往。","人物：格朗古杰、卡冈都亚和庞大固埃为代表的三代巨人形象。【1504 多选/2210 多选】","特点：情节滑稽可笑、荒诞不经，有的地方粗野鄙俗，但思想内涵严肃深邃。"],"src":"作品：法国人文主义文学平民倾向的杰出代表，5 卷集长篇小说《巨人传》。／主题：赞美人的世俗幸福追求，肯定人文主义教育和知识对人精神发展的重要作用，展示人文主义理想；通过两个巨人的见闻，批判封建教会的虚伪和封建国家上层建筑的腐朽。体现人文主义者对个性解放的追求，对平等、自由、理想社会的向往。／人物：格朗古杰、卡冈都亚和庞大固埃为代表的三代巨人形象。【1504 多选/2210 多选】／特点：情节滑稽可"},{"id":"s00042","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["简答","论述题考点","1505","2210 多选"],"stem":"简述：拉伯雷《巨人传》中的巨人形象","points":["《巨人传》塑造了以格朗古杰、卡冈都亚和庞大固埃为代表的三代巨人形象。【2210 多选】","巨人形体的高大象征着人的伟大，三个巨人食量过人，饕餮 tāo tiè好酒，纵情享乐、百无禁忌，体现了人追求肉体感官幸福、快乐，看重今生的崭新的人生观。","经过人文主义教育的卡冈都亚和庞大固埃知识渊博、充满智慧，有许多优秀品质。卡冈都亚爱好和平，爱护民众，蔑视宗教权威。庞大固埃按照巨人父亲的教育思想成长，他努力探索各种奥秘，游历各地，探寻真理，最终从“神壶”处得到答案：畅饮知识、真理和爱情。表现了文艺复兴时期的巨人思想。"],"src":"《巨人传》塑造了以格朗古杰、卡冈都亚和庞大固埃为代表的三代巨人形象。【2210 多选】／巨人形体的高大象征着人的伟大，三个巨人食量过人，饕餮 tāo tiè好酒，纵情享乐、百无禁忌，体现了人追求肉体感官幸福、快乐，看重今生的崭新的人生观。／经过人文主义教育的卡冈都亚和庞大固埃知识渊博、充满智慧，有许多优秀品质。卡冈都亚爱好和平，爱护民众，蔑视宗教权威。庞大固埃按照巨人父亲的教育思想成长，他努力探索"},{"id":"s00043","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1910 名词","1010 名词"],"stem":"名词解释：流浪汉小说","points":["16 世纪中叶出现于西班牙的一种新型小说。","基本上取材于现实生活，主人公大多为无业游民。","通过主人公的经历和所见所闻来安排各种生活场景。","代表作是无名氏的《小癞子》（西班牙 16 世纪最著名的流浪汉小说）。"],"src":"16 世纪中叶出现于西班牙的一种新型小说。／基本上取材于现实生活，主人公大多为无业游民。／通过主人公的经历和所见所闻来安排各种生活场景。／代表作是无名氏的《小癞子》（西班牙 16 世纪最著名的流浪汉小说）。"},{"id":"s00044","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1610 名词"],"stem":"名词解释：乔叟《坎特伯雷故事集》","points":["《坎特伯雷故事集》是文艺复兴时期英国作家乔叟的代表作。","作品以每人讲一个故事的形式把 24 个故事组成一个有机的整体。","反映了 14 世纪英国的社会生活，批判封建阶层和教会，肯定对世俗爱情的追求。"],"src":"《坎特伯雷故事集》是文艺复兴时期英国作家乔叟的代表作。／作品以每人讲一个故事的形式把 24 个故事组成一个有机的整体。／反映了 14 世纪英国的社会生活，批判封建阶层和教会，肯定对世俗爱情的追求。"},{"id":"s00045","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1510 名词","1010 名词","1710","2008 多选"],"stem":"名词解释：“大学才子派”","points":["“大学才子派”是 16 世纪后期在英国出现的一批人文主义剧作家。","他们大都受过大学教育，具有人文主义思想，学识渊博，在戏剧创作上颇有创新。","代表人物有约翰·李利、马洛、罗伯特·格林、基德。"],"src":"“大学才子派”是 16 世纪后期在英国出现的一批人文主义剧作家。／他们大都受过大学教育，具有人文主义思想，学识渊博，在戏剧创作上颇有创新。／代表人物有约翰·李利、马洛、罗伯特·格林、基德。"},{"id":"s00046","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["简答","论述考点","1410 名词"],"stem":"论述《堂吉诃德》的思想内容/主题","points":["文艺复兴时期西班牙作家塞万提斯的长篇小说。 [讽刺骑士制度]","堂吉诃德三次行侠冒险的经历，以史诗般的手笔，描绘 16 世纪末-17 世纪初西班牙社会的广阔生活画面。上层统治阶级豪华奢侈的生活场景，官僚统治集团的贪赃枉法、草菅人命的罪恶行径。","表达了作者改造罪恶现实、创造自由、平等的世界的理想，要扫尽人间不平，实现理想。","借堂吉诃德貌似空幻无实的梦想与苦难中的西班牙社会现实进行了鲜明的对照，突显了现实社会的罪恶，也表达了作者对理想社会的向往。"],"src":"文艺复兴时期西班牙作家塞万提斯的长篇小说。 [讽刺骑士制度]／堂吉诃德三次行侠冒险的经历，以史诗般的手笔，描绘 16 世纪末-17 世纪初西班牙社会的广阔生活画面。上层统治阶级豪华奢侈的生活场景，官僚统治集团的贪赃枉法、草菅人命的罪恶行径。／表达了作者改造罪恶现实、创造自由、平等的世界的理想，要扫尽人间不平，实现理想。／借堂吉诃德貌似空幻无实的梦想与苦难中的西班牙社会现实进行了鲜明的对照，突显了现"},{"id":"s00047","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1101","1704论述","1604","2110论述","2410名词"],"stem":"名词解释：《堂吉诃德》的人物形象","points":["堂吉诃德：堂吉诃德是一个既有悲剧因素，又有喜剧因素的复杂形象：[患有“游侠狂想症”的人文主义者]","堂吉诃德是人文主义者形象。","他身上具有许多喜剧人物的因素。","充满悲剧精神的人物。","人文主义思想的直接传播者。"],"src":"堂吉诃德：堂吉诃德是一个既有悲剧因素，又有喜剧因素的复杂形象：[患有“游侠狂想症”的人文主义者]／堂吉诃德是人文主义者形象。／他身上具有许多喜剧人物的因素。／充满悲剧精神的人物。／人文主义思想的直接传播者。"},{"id":"s00048","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1704论述"],"stem":"简述：桑丘·潘沙","points":["分析堂吉诃德和桑丘·潘沙形象","桑丘·潘沙是与堂吉诃德既对立又互为补充的形象，外表和性格都形成鲜明对照。","讲求实际，目光短浅，狭隘自私，但又不失西班牙农民的机智、善良和乐观精神。","对现实有正确的判断力，对友谊十分忠诚。","他和堂吉诃德从不同侧面代表了人类所具有的善良正义的思想感情。"],"src":"分析堂吉诃德和桑丘·潘沙形象／桑丘·潘沙是与堂吉诃德既对立又互为补充的形象，外表和性格都形成鲜明对照。／讲求实际，目光短浅，狭隘自私，但又不失西班牙农民的机智、善良和乐观精神。／对现实有正确的判断力，对友谊十分忠诚。／他和堂吉诃德从不同侧面代表了人类所具有的善良正义的思想感情。"},{"id":"s00049","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1210简答"],"stem":"简述《堂吉诃德》的艺术成就","points":["运用讽刺艺术，采取对比、夸张等手法塑造人物形象，突出人物个性。","利用骑士小说的模式，进行了巧妙的替换，将骑士小说的讽刺改造成人文主义思想的宣传。","塑造了堂吉诃德等人物典型。[小蒋说可分析堂吉诃德形象]塞万提斯成为欧洲近代现实主义小说的先驱。"],"src":"运用讽刺艺术，采取对比、夸张等手法塑造人物形象，突出人物个性。／利用骑士小说的模式，进行了巧妙的替换，将骑士小说的讽刺改造成人文主义思想的宣传。／塑造了堂吉诃德等人物典型。[小蒋说可分析堂吉诃德形象]塞万提斯成为欧洲近代现实主义小说的先驱。"},{"id":"s00050","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["简答题考点"],"stem":"简述：莎士比亚喜剧的主题和主要特征","points":["主要表达人文主义的正面理想，歌颂美好、忠贞的爱情、赞美纯洁、忠诚的友谊，颂扬人性中的仁爱无私精神和机智勇敢的品行，尤其是热烈地赞美女性的仁善、美丽、聪明和智慧。","剧中理想主义色彩极浓，表现出作家对前途充满乐观精神。","喜剧常常情节繁复交织，但主线鲜明，其他线索与剧作的主要情节线索相辅相成，每条线索既各自独立，又相互联系紧密。"],"src":"主要表达人文主义的正面理想，歌颂美好、忠贞的爱情、赞美纯洁、忠诚的友谊，颂扬人性中的仁爱无私精神和机智勇敢的品行，尤其是热烈地赞美女性的仁善、美丽、聪明和智慧。／剧中理想主义色彩极浓，表现出作家对前途充满乐观精神。／喜剧常常情节繁复交织，但主线鲜明，其他线索与剧作的主要情节线索相辅相成，每条线索既各自独立，又相互联系紧密。"},{"id":"s00051","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["简答题考点"],"stem":"简述：莎士比亚悲剧的主题和主要特征","points":["莎士比亚的悲剧揭示了正在兴起的资本主义社会关系的内在矛盾，抨击资本主义利益原则的邪恶性质，展现出广大劳动人民的痛苦，全面反映了人文主义理想遭受到的罪恶势力的破坏与摧残。","在艺术上，基调沉郁、悲怆、愤激。剧作对现实的反映深刻，感染力强，采用了多条情节线索并进的结构。","悲剧之中掺杂进喜剧的成分，具有悲喜交织、突出悲剧色彩的艺术效果。四大悲剧：《哈姆莱特》《奥赛罗》《李尔王》《麦克白》。"],"src":"莎士比亚的悲剧揭示了正在兴起的资本主义社会关系的内在矛盾，抨击资本主义利益原则的邪恶性质，展现出广大劳动人民的痛苦，全面反映了人文主义理想遭受到的罪恶势力的破坏与摧残。／在艺术上，基调沉郁、悲怆、愤激。剧作对现实的反映深刻，感染力强，采用了多条情节线索并进的结构。／悲剧之中掺杂进喜剧的成分，具有悲喜交织、突出悲剧色彩的艺术效果。四大悲剧：《哈姆莱特》《奥赛罗》《李尔王》《麦克白》。"},{"id":"s00052","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":[],"stem":"简述：莎士比亚《威尼斯商人》的形象与特点","points":["人物：夏洛克—狡猾、贪婪、吝啬、嗜钱如命的高利贷者，性格反映早期资产者唯利是图的本质。","浪漫主义色彩较浓，社会讽刺意味也较为强烈。 安东尼奥：商业资本家；人文主义道德原则和生活理想的人物战胜了贪婪奸诈、吝啬恶劣品质化身的夏洛克。"],"src":"人物：夏洛克—狡猾、贪婪、吝啬、嗜钱如命的高利贷者，性格反映早期资产者唯利是图的本质。／浪漫主义色彩较浓，社会讽刺意味也较为强烈。 安东尼奥：商业资本家；人文主义道德原则和生活理想的人物战胜了贪婪奸诈、吝啬恶劣品质化身的夏洛克。"},{"id":"s00053","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["2204论述题"],"stem":"简述：莎士比亚《哈姆莱特》的思想价值","points":["《哈姆莱特》：莎士比亚代表作。丹麦王子为父复仇的故事取材12世纪末的丹麦史。","以中世纪的丹麦宫廷为背景，通过哈姆莱特为父复仇的故事，借古喻今，真实地描绘了文艺复兴运动晚期欧洲和英国社会的现状及矛盾。","宫廷尔虞我诈，社会民怨沸腾，人文主义理想在这个罪恶当道的社会已无法实现。新旧社会力量和思想之间也进行着激烈的交锋，而新的社会力量和思想观念内部，也存在着善和恶两种力量的冲突和较量[新兴资产阶级一极端利己主义]，信仰的危机导致人们对人性本质的怀疑。","表现了作者对文艺复兴运动的深刻反思以及对人的命运和社会未来的关注和忧虑。> 论述《哈姆莱特》的思想价值。【2204论述题答案】【★★★★】","将哈姆莱特塑造为一个处于理想与现实矛盾中的人文主义者形象。","哈姆莱特复仇的延宕，反映了欧洲文艺复兴晚期信仰失落时人们进退两难的矛盾心理。","哈姆莱特对人性的思考，成为近代以来欧洲文学思考人性问题的开端。"],"src":"《哈姆莱特》：莎士比亚代表作。丹麦王子为父复仇的故事取材12世纪末的丹麦史。／以中世纪的丹麦宫廷为背景，通过哈姆莱特为父复仇的故事，借古喻今，真实地描绘了文艺复兴运动晚期欧洲和英国社会的现状及矛盾。／宫廷尔虞我诈，社会民怨沸腾，人文主义理想在这个罪恶当道的社会已无法实现。新旧社会力量和思想之间也进行着激烈的交锋，而新的社会力量和思想观念内部，也存在着善和恶两种力量的冲突和较量[新兴资产阶级一极端利"},{"id":"s00054","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["1201","2104论述","2504论述"],"stem":"分析哈姆莱特形象","points":["哈姆莱特是一个处于理想与现实矛盾中的人文主义者形象。","他曾经是以人文主义观念指导爱情和友谊的“快乐的王子”。","人文主义理想和信念破灭，使他成为行为犹豫的“延宕的王子”。","他还是一个深沉的思想家。 【小蒋说：可补充回答哈姆莱特的延宕实质】","哈姆莱特是莎士比亚代表作《哈姆莱特》中的悲剧主人公。【1810 名词】➢ 分析莎士比亚悲剧《哈姆莱特》的哈姆莱特形象。【2504 论述】➢ 哈姆莱特的人物形象分析：【2504 论述；简答/论述考点】【★★★★★★】","哈姆莱特是文艺复兴时期人文主义者的典型形象，由快乐王子变成了忧郁王子。","但忧郁并不是哈姆莱特的天性，而是人文主义理想与罪恶现实之间产生矛盾而呈现出的一种精神状态。","哈姆莱特的悲剧是人文主义者的悲剧，原因一是他所处时代的封建势力还很强大，对手奸诈毒辣，二是他不相信暴力，脱离群众，孤军奋战，因此他的悲剧也是时代的悲剧。","作为一个理想破灭的人文主义者，哈姆莱特在复仇行动上的犹豫，显示了他所代表的人文主义思想与封建势力之间力量的悬殊。在强大的封建势力面前，他无法胜任“重整乾坤”、改造社会的历史重任，因而他的复仇以及悲剧具有深刻的社会意义。哈姆莱特还是一个深沉的思想家。","哈姆莱特的延宕实际上是欧洲文艺复兴晚期信仰失落时人文主义者进退两难的矛盾心理的象征性表述。哈姆莱特对人性的深沉思考，也成为近代以来欧洲文学关于人的问题思索的一个开端。"],"src":"哈姆莱特是一个处于理想与现实矛盾中的人文主义者形象。／他曾经是以人文主义观念指导爱情和友谊的“快乐的王子”。／人文主义理想和信念破灭，使他成为行为犹豫的“延宕的王子”。／他还是一个深沉的思想家。 【小蒋说：可补充回答哈姆莱特的延宕实质】／哈姆莱特是莎士比亚代表作《哈姆莱特》中的悲剧主人公。【1810 名词】➢ 分析莎士比亚悲剧《哈姆莱特》的哈姆莱特形象。【2504 论述】➢ 哈姆莱特的人物形象分析"},{"id":"s00055","type":"short","ch":"第一部分 西方文学 · 第三章 文艺复兴时期文学","sec":"","tags":["2008 论述","1504 论述","1101 多选","2404 论述"],"stem":"论述《哈姆莱特》的艺术特点","points":["戏剧情节的生动性和丰富性。","通过内心矛盾冲突的描写揭示人物的内在性格。","运用对比手法用于人物塑造。","将无韵诗体与散文、有韵的诗句、抒情歌谣等融为一体。"],"src":"戏剧情节的生动性和丰富性。／通过内心矛盾冲突的描写揭示人物的内在性格。／运用对比手法用于人物塑造。／将无韵诗体与散文、有韵的诗句、抒情歌谣等融为一体。"},{"id":"s00056","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["2010 考期名词"],"stem":"名词解释：巴洛克文学","points":["17 世纪欧洲的一种文学创作。","内容上偏重表现宗教狂热，用词华丽，叙述风格扑朔迷离。","代表作品是卡尔德隆的《人生如梦》。","巴洛克文学以意大利“马里诺诗派”、西班牙“贡哥拉诗派”、卡尔德隆的剧作《人生如梦》等最著名。"],"src":"17 世纪欧洲的一种文学创作。／内容上偏重表现宗教狂热，用词华丽，叙述风格扑朔迷离。／代表作品是卡尔德隆的《人生如梦》。／巴洛克文学以意大利“马里诺诗派”、西班牙“贡哥拉诗派”、卡尔德隆的剧作《人生如梦》等最著名。"},{"id":"s00057","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1604","1610 多选"],"stem":"简述：弥尔顿","points":["英国资产阶级革命文学著名三部作品：长诗《失乐园》《复乐园》和诗剧《力士参孙》，都以圣经为题材。【2404 单选】《失乐园》：取材《旧约·创世记》。卢西弗被上帝打入地狱成为魔鬼撒旦，报复上帝。撒旦：双重性，体现英国资产阶级革命者的进步和局限；反抗者形象；战斗精神和英勇气概/骄傲专断和欺骗。《复乐园》：取材《圣经·新约全书》，耶稣在旷野绝食 40 天后被恶魔试探、抗拒诱惑的故事。《力士参孙》：取材《旧约·士师记》，参孙在身陷囹圄/双目失明下“忍耐”精神的发展过程，弥尔顿写照。"],"src":"英国资产阶级革命文学著名三部作品：长诗《失乐园》《复乐园》和诗剧《力士参孙》，都以圣经为题材。【2404 单选】《失乐园》：取材《旧约·创世记》。卢西弗被上帝打入地狱成为魔鬼撒旦，报复上帝。撒旦：双重性，体现英国资产阶级革命者的进步和局限；反抗者形象；战斗精神和英勇气概/骄傲专断和欺骗。《复乐园》：取材《圣经·新约全书》，耶稣在旷野绝食 40 天后被恶魔试探、抗拒诱惑的故事。《力士参孙》：取材《旧"},{"id":"s00058","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1410","2008 考期名词","1101","1504","2008 考期简答"],"stem":"名词解释：古典主义；古典主义文学的特征","points":["古典主义是 17 世纪法国形成的文学思潮。","政治上拥护王权，维护国家民族的利益。","哲学上推崇理性，对理性的绝对遵从。","戏剧创作模仿古人，重视创作规则。影响最大的是“三一律”。"],"src":"古典主义是 17 世纪法国形成的文学思潮。／政治上拥护王权，维护国家民族的利益。／哲学上推崇理性，对理性的绝对遵从。／戏剧创作模仿古人，重视创作规则。影响最大的是“三一律”。"},{"id":"s00059","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1710","2310 名词","2104 简答","2504 简答"],"stem":"名词解释：“三一律”","points":["简述“三一律”的主要内容","在古典主义戏剧的创作规则中，影响最大的是“三一律”。[“三一律”是古典主义戏剧的创作规则]","“三一律”要求一个剧本只能有一个情节线索，剧情只能发生在同一地点，时间不准超过一昼夜，24 小时。5.高乃依：是法国古典主义悲剧的创始人。《熙德》最有代表性。","《熙德》：表现罗狄克与施曼娜在义务与爱情、理智与感情之间的矛盾与冲突，宣扬国家民族利益高于一切的思想。 （2）只有得到理性控制而非盲目服从感情的摆布，才可能获得生活的幸福。","《熙德》是古典主义的第一部典范作品，也是古典主义戏剧的奠基作。没完全遵从“三一律”。"],"src":"简述“三一律”的主要内容／在古典主义戏剧的创作规则中，影响最大的是“三一律”。[“三一律”是古典主义戏剧的创作规则]／“三一律”要求一个剧本只能有一个情节线索，剧情只能发生在同一地点，时间不准超过一昼夜，24 小时。5.高乃依：是法国古典主义悲剧的创始人。《熙德》最有代表性。／《熙德》：表现罗狄克与施曼娜在义务与爱情、理智与感情之间的矛盾与冲突，宣扬国家民族利益高于一切的思想。 （2）只有得到理性"},{"id":"s00060","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["2110 名词"],"stem":"名词解释：拉辛","points":["17世纪法国古典主义悲剧的代表作家。","代表作是《安德洛玛克》。","严格遵循“三一律”的创作原则。 通过情欲淹没理性的人物的悲惨结局，强调理性的重要。"],"src":"17世纪法国古典主义悲剧的代表作家。／代表作是《安德洛玛克》。／严格遵循“三一律”的创作原则。 通过情欲淹没理性的人物的悲惨结局，强调理性的重要。"},{"id":"s00061","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1810 名词","2504 多选"],"stem":"名词解释：莫里哀","points":["莫里哀是17世纪法国古典主义喜剧的杰出代表。","其剧作具有现实主义精神，批判矛头指向封建贵族。","代表作是《伪君子》。"],"src":"莫里哀是17世纪法国古典主义喜剧的杰出代表。／其剧作具有现实主义精神，批判矛头指向封建贵族。／代表作是《伪君子》。"},{"id":"s00062","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1301 名词"],"stem":"名词解释：《吝啬鬼》","points":["法国作家莫里哀创作的喜剧。","塑造了贪婪吝啬的高利贷者阿巴贡的形象。贪婪吝啬、嗜钱如命，吝啬鬼的代名词。","揭示了拜金主义的罪恶，揭露了资本主义发展初级阶段被金钱扭曲的人性。"],"src":"法国作家莫里哀创作的喜剧。／塑造了贪婪吝啬的高利贷者阿巴贡的形象。贪婪吝啬、嗜钱如命，吝啬鬼的代名词。／揭示了拜金主义的罪恶，揭露了资本主义发展初级阶段被金钱扭曲的人性。"},{"id":"s00063","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["0710 简答","2304 论述","2510 名词"],"stem":"名词解释：《伪君子》的主题思想","points":["《伪君子》通过塑造伪装成虔诚的天主教徒的恶人答丢夫的形象，暴露了法国天主教会和贵族社会成员的伪善面目，充分揭示了宗教的欺骗性和危害性。","揭示了骗子共同的欺骗手段，即掌握人们内心最希望得到的东西，满足人最强烈的欲望，从而达到目的。","伪君子答丢夫是全剧的中心人物，他是伪善的化身，集中体现了伪善的恶习，具有高度的概括意义。"],"src":"《伪君子》通过塑造伪装成虔诚的天主教徒的恶人答丢夫的形象，暴露了法国天主教会和贵族社会成员的伪善面目，充分揭示了宗教的欺骗性和危害性。／揭示了骗子共同的欺骗手段，即掌握人们内心最希望得到的东西，满足人最强烈的欲望，从而达到目的。／伪君子答丢夫是全剧的中心人物，他是伪善的化身，集中体现了伪善的恶习，具有高度的概括意义。"},{"id":"s00064","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["1510","2008 简答","2410 简答"],"stem":"简述答丢夫形象","points":["答丢夫是伪善的化身，集中体现了伪善的恶习，他骗取人们的信任，以达到卑鄙目的。","他的丑恶嘴脸是通过“贪食、贪财、贪色”行径暴露出来的。","答丢夫的伪善具有巨大的危害性。揭示出宗教的欺骗性和危害性。"],"src":"答丢夫是伪善的化身，集中体现了伪善的恶习，他骗取人们的信任，以达到卑鄙目的。／他的丑恶嘴脸是通过“贪食、贪财、贪色”行径暴露出来的。／答丢夫的伪善具有巨大的危害性。揭示出宗教的欺骗性和危害性。"},{"id":"s00065","type":"short","ch":"第一部分 西方文学 · 第四章 17 世纪文学","sec":"","tags":["简答","论述题考点"],"stem":"简述：莫里哀《伪君子》的艺术成就","points":["《伪君子》基本符合古典主义的要求，人物性格扁平、概念化，戏剧结构严谨、矛盾冲突集中尖锐。","在一定程度上突破了古典主义喜剧的严格界限，已经带有明显的悲剧意味。","吸收各种民间戏剧、笑剧、闹剧、风俗喜剧、传奇喜剧等手法，增强了喜剧的艺术效果，使喜剧突破了古典喜剧的模式，走向近代喜剧。"],"src":"《伪君子》基本符合古典主义的要求，人物性格扁平、概念化，戏剧结构严谨、矛盾冲突集中尖锐。／在一定程度上突破了古典主义喜剧的严格界限，已经带有明显的悲剧意味。／吸收各种民间戏剧、笑剧、闹剧、风俗喜剧、传奇喜剧等手法，增强了喜剧的艺术效果，使喜剧突破了古典喜剧的模式，走向近代喜剧。"},{"id":"s00066","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["2304 名词"],"stem":"名词解释：启蒙运动","points":["启蒙运动是18世纪在欧洲影响深远的思想文化运动，是西方资产阶级继文艺复兴运动之后又一次反封建反教会的思想解放运动。","启蒙思想家鼓励运用理性或理智，去分析经验世界，以推动自身以及社会的进步。","他们往往借助于文学形式，以便更好地启迪民众。"],"src":"启蒙运动是18世纪在欧洲影响深远的思想文化运动，是西方资产阶级继文艺复兴运动之后又一次反封建反教会的思想解放运动。／启蒙思想家鼓励运用理性或理智，去分析经验世界，以推动自身以及社会的进步。／他们往往借助于文学形式，以便更好地启迪民众。"},{"id":"s00067","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["2410 简答"],"stem":"简述启蒙文学的基本特征","points":["具有鲜明的倾向性和教诲性。","启蒙文学具有民主性。","更加强调真实性，哲理性较强。18世纪英国现实主义小说：笛福、斯威夫特、菲尔丁。菲尔丁：18世纪英国最杰出的小说家，18世纪欧洲成就最大的现实主义小说家。《汤姆·琼斯》：菲尔丁的代表作，18世纪英国现实主义小说的最高成就的标志。"],"src":"具有鲜明的倾向性和教诲性。／启蒙文学具有民主性。／更加强调真实性，哲理性较强。18世纪英国现实主义小说：笛福、斯威夫特、菲尔丁。菲尔丁：18世纪英国最杰出的小说家，18世纪欧洲成就最大的现实主义小说家。《汤姆·琼斯》：菲尔丁的代表作，18世纪英国现实主义小说的最高成就的标志。"},{"id":"s00068","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["1110","1510 名词"],"stem":"名词解释：感伤主义文学","points":["感伤主义文学得名于英国作家斯特恩的小说《感伤的旅行》。","在创作上强调感情的力量，着力描写人物的不幸与痛苦，以引起读者的怜悯和同情。","为浪漫主义的兴起作了铺垫。 感伤主义小说：理查逊、劳伦斯·斯特恩、奥利弗·哥尔德斯密斯。"],"src":"感伤主义文学得名于英国作家斯特恩的小说《感伤的旅行》。／在创作上强调感情的力量，着力描写人物的不幸与痛苦，以引起读者的怜悯和同情。／为浪漫主义的兴起作了铺垫。 感伤主义小说：理查逊、劳伦斯·斯特恩、奥利弗·哥尔德斯密斯。"},{"id":"s00069","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["名词"],"stem":"名词解释：狄德罗“正剧”","points":["“正剧”又称“严肃剧”。是狄德罗尝试建立一种新的戏剧体裁，冲破古典主义理论在悲剧、喜剧之间划下的界线，用散文的方式表现普通人的日常生活"],"src":"“正剧”又称“严肃剧”。是狄德罗尝试建立一种新的戏剧体裁，冲破古典主义理论在悲剧、喜剧之间划下的界线，用散文的方式表现普通人的日常生活"},{"id":"s00070","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["1604","2104 名词","2410 多选"],"stem":"名词解释：“狂飙突进”运动","points":["德国启蒙运动达到高峰的标志。","主张个性解放，崇尚感情，提出“返回自然”，提倡民族意识。","青年歌德和席勒是代表，作品有《少年维特的烦恼》《阴谋与爱情》。> 什么是“狂飙突进”运动？简述狂飙突进运动的主要内容。【0810/1704 简答】【★★★★★】","狂飙突进运动是 18 世纪 70 年代初至 80 年代出现在德国的文学思潮。","主张个性解放，崇尚感情，提倡民族意识。","青年歌德和席勒是代表。歌德《少年维特的烦恼》，席勒的《强盗》《阴谋与爱情》。","名称源于克林格尔的同名剧本《狂飙突进》，领袖赫尔德。> 席勒的市民悲剧《阴谋与爱情》：通过斐迪南与路易斯的爱情悲剧，反映平民与贵族之间的矛盾和冲突，被称为“德国第一部有政治倾向性的戏剧”。"],"src":"德国启蒙运动达到高峰的标志。／主张个性解放，崇尚感情，提出“返回自然”，提倡民族意识。／青年歌德和席勒是代表，作品有《少年维特的烦恼》《阴谋与爱情》。> 什么是“狂飙突进”运动？简述狂飙突进运动的主要内容。【0810/1704 简答】【★★★★★】／狂飙突进运动是 18 世纪 70 年代初至 80 年代出现在德国的文学思潮。／主张个性解放，崇尚感情，提倡民族意识。／青年歌德和席勒是代表。歌德《少年"},{"id":"s00071","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["1704 名词","2210 名词"],"stem":"名词解释：歌德","points":["18-19 世纪德国作家","“狂飙突进”运动的代表","主要作品《少年维特的烦恼》《浮士德》。"],"src":"18-19 世纪德国作家／“狂飙突进”运动的代表／主要作品《少年维特的烦恼》《浮士德》。"},{"id":"s00072","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["2008 考期名词"],"stem":"名词解释：《少年维特的烦恼》","points":["歌德创作的书信体小说。","主人公维特因忍受不了爱情的失意和工作的枯燥沉闷而自杀。","维特的追求与烦恼暗含了当时追求个性解放与感情自由的时代精神。","取材歌德自己的生活体验，男主人公是维特，女主人公是绿蒂。"],"src":"歌德创作的书信体小说。／主人公维特因忍受不了爱情的失意和工作的枯燥沉闷而自杀。／维特的追求与烦恼暗含了当时追求个性解放与感情自由的时代精神。／取材歌德自己的生活体验，男主人公是维特，女主人公是绿蒂。"},{"id":"s00073","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["名词","2304 简答"],"stem":"名词解释：《少年维特的烦恼》维特的形象","points":["维特是 18 世纪德国进步青年的典型形象。他思维敏捷，才华出众，热情奔放，渴望自由。他崇拜大自然，热爱纯朴的村民和天真的儿童，向往人的自然天性能得到解放。","但围绕着他的环境却是腐朽、顽固、庸俗、鄙陋的社会，与周围的现实格格不入而孤独愁闷。","通过维特与周围环境的矛盾，批判当时德国的丑恶现实。维特对感情的推崇与执著，对美好心灵的赞美，又暗含了当时追求个性解放与感情自由的时代精神，成为德国“狂飙突进”运动最光辉的成果。"],"src":"维特是 18 世纪德国进步青年的典型形象。他思维敏捷，才华出众，热情奔放，渴望自由。他崇拜大自然，热爱纯朴的村民和天真的儿童，向往人的自然天性能得到解放。／但围绕着他的环境却是腐朽、顽固、庸俗、鄙陋的社会，与周围的现实格格不入而孤独愁闷。／通过维特与周围环境的矛盾，批判当时德国的丑恶现实。维特对感情的推崇与执著，对美好心灵的赞美，又暗含了当时追求个性解放与感情自由的时代精神，成为德国“狂飙突进”运"},{"id":"s00074","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["1410","2010","2310 论述","2204 简答"],"stem":"简述：浮士德的形象/精神","points":["《浮士德》的思想意义","浮士德在人生道路上经历了五个阶段。①五个阶段：知识悲剧、生活悲剧、政治悲剧、美的悲剧和事业悲剧的追求。②性格特点：他既受本能欲望的驱使，追求权势、名利、地位和女人等，又能摆脱诱惑，不断向更高的目标奋进。③形象的本质：这种“灵”与“肉”的矛盾，体现了普通人所具有的两重性特征，实质上是人类自身复杂性的体现。（歌德对浮士德人生经历的描写，实际上是对自文艺复兴以来至启蒙运动时期欧洲历史的概括。）","浮士德是一个自强不息的探索者形象，是一种积极进取精神的代表，是欧洲资产阶级上升时期的优秀知识分子形象的概括。 浮士德精神：这种自强不息、积极进取、勇于探索的精神。","浮士德精神：【★★★★★】①浮士德又是一种积极进取精神的代表，是一个自强不息的探索者形象。歌德对浮士德人生经历的描写，实际上是对自文艺复兴以来至启蒙运动时期欧洲历史的概括。体现了资产阶级思想家的觉醒过程。②歌德在浮士德形象中所概括的历史经验，实际上是资产阶级进步人士思想探索的历程，体现了从文艺复兴、宗教改革、启蒙运动的反封建精神。浮士德又是处在上升时期的欧洲资产阶级优秀知识分子形象的概括。"],"src":"《浮士德》的思想意义／浮士德在人生道路上经历了五个阶段。①五个阶段：知识悲剧、生活悲剧、政治悲剧、美的悲剧和事业悲剧的追求。②性格特点：他既受本能欲望的驱使，追求权势、名利、地位和女人等，又能摆脱诱惑，不断向更高的目标奋进。③形象的本质：这种“灵”与“肉”的矛盾，体现了普通人所具有的两重性特征，实质上是人类自身复杂性的体现。（歌德对浮士德人生经历的描写，实际上是对自文艺复兴以来至启蒙运动时期欧洲历"},{"id":"s00075","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["1804 简答","1910 论述","2404 简答"],"stem":"简述：浮士德与靡菲斯特之间的辩证关系","points":["歌德对浮士德形象的描写，是以浮士德与靡菲斯特的辩证关系为基础的。","浮士德不断地寻求真、善、美，体现了肯定的精神。","而靡菲斯特一再通过诱惑使浮士德堕落，是恶的代表，体现了否定的精神。正如他自己所说的“你们所谓罪过啊，破坏啊，简言之，被称作恶的一切，正是我的本质特性”。","但他的主观作恶在客观上却具有造福的功能，即从反面推动浮士德从错误中摸索到正途，促成了浮士德不断向上向善，引导浮士德最终找到了人生的真谛。这样，靡菲斯特又成为浮士德前进道路上不可缺少的动力。借用靡菲斯特自己的话来说，“老想作恶却总是把善促成，我便是这种力量的一部分”。"],"src":"歌德对浮士德形象的描写，是以浮士德与靡菲斯特的辩证关系为基础的。／浮士德不断地寻求真、善、美，体现了肯定的精神。／而靡菲斯特一再通过诱惑使浮士德堕落，是恶的代表，体现了否定的精神。正如他自己所说的“你们所谓罪过啊，破坏啊，简言之，被称作恶的一切，正是我的本质特性”。／但他的主观作恶在客观上却具有造福的功能，即从反面推动浮士德从错误中摸索到正途，促成了浮士德不断向上向善，引导浮士德最终找到了人生的真"},{"id":"s00076","type":"short","ch":"第一部分 西方文学 · 第五章 18世纪文学","sec":"","tags":["简答","论述考点"],"stem":"简述：歌德《浮士德》的艺术特点","points":["最重要的艺术特点是大量使用象征、典故与比喻，从人物原型、故事模式到文学意象，贯穿全书。艺术形式上不拘一格，以诗体写成的戏剧，既具有戏剧与诗歌的特点，又拓宽了戏剧的表现力。它的诗体与格律多种多样，既有古希腊无韵的自由体颂歌和哀歌，也有德国的民歌体；古希腊悲剧的诗韵，北欧古典的长短格无韵诗，全剧结束时的“神秘合唱”更丰富了这部诗剧的寓言意味。","诗剧还善于运用矛盾对比的方法来安排场面，配置人物。以浮士德为中心，其他的人物如靡菲斯特、玛甘泪、瓦格纳、海伦等都与他形成对比。场面的安排上如阴暗的书斋与春光明媚的城郊的对比，古代帝国宫廷的奢侈腐败与海边开拓领地的自由平等的映衬等，构成黑暗与光明、卑劣与崇高、混乱与和谐的对应关系。","《浮士德》是德国文学史上，也是世界文学史上—笔珍贵的遗产。它激励着后人锐意开拓，或从事社会实践，或进行文学写作。"],"src":"最重要的艺术特点是大量使用象征、典故与比喻，从人物原型、故事模式到文学意象，贯穿全书。艺术形式上不拘一格，以诗体写成的戏剧，既具有戏剧与诗歌的特点，又拓宽了戏剧的表现力。它的诗体与格律多种多样，既有古希腊无韵的自由体颂歌和哀歌，也有德国的民歌体；古希腊悲剧的诗韵，北欧古典的长短格无韵诗，全剧结束时的“神秘合唱”更丰富了这部诗剧的寓言意味。／诗剧还善于运用矛盾对比的方法来安排场面，配置人物。以浮士德"},{"id":"s00077","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1610","1201简答","1301多选","2504名词"],"stem":"名词解释：浪漫主义文学的基本特征","points":["浪漫主义：18世纪末兴起于欧洲，19世纪上半叶盛行欧美各国的文学思潮。","强调主观情感，注重抒发自我。","推崇想象力。","热爱大自然，赞美大自然。","重视中世纪民间文学，提出“回到中世纪”的口号。","夸张的手法、强烈的对比、离奇的情节。"],"src":"浪漫主义：18世纪末兴起于欧洲，19世纪上半叶盛行欧美各国的文学思潮。／强调主观情感，注重抒发自我。／推崇想象力。／热爱大自然，赞美大自然。／重视中世纪民间文学，提出“回到中世纪”的口号。／夸张的手法、强烈的对比、离奇的情节。"},{"id":"s00078","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","名词"],"stem":"名词解释：德国“耶拿派”","points":["因活动中心是耶拿而得名。主要人物是施莱格尔兄弟，他们在《雅典娜神殿》上提出了浪漫主义。他们对“狂飙突进”有所继承，比如要求创作自由，重视情感，寻求神秘感。反封建的战斗精神相比狂飙精神减弱。","代表诗人诺瓦利斯和蒂克。前者《夜的颂歌》，后者民间文学方面《民间童话集》。"],"src":"因活动中心是耶拿而得名。主要人物是施莱格尔兄弟，他们在《雅典娜神殿》上提出了浪漫主义。他们对“狂飙突进”有所继承，比如要求创作自由，重视情感，寻求神秘感。反封建的战斗精神相比狂飙精神减弱。／代表诗人诺瓦利斯和蒂克。前者《夜的颂歌》，后者民间文学方面《民间童话集》。"},{"id":"s00079","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","名词"],"stem":"名词解释：海涅的长诗《德国——一个冬天的童话》","points":["对德国的检查制度、封建制度、教会等进行无情揭露和批判，对社会革命作出预言。德国36个腐朽的封建小邦国比做“36个粪坑”，用革命来清除这些腐朽发臭的“粪坑”，才有新的德国出现。","有浪漫主义和现实主义相结合的风格：夸张/讽刺/想象/比喻的手法，结合民间文学传统进行叙事和抒情。"],"src":"对德国的检查制度、封建制度、教会等进行无情揭露和批判，对社会革命作出预言。德国36个腐朽的封建小邦国比做“36个粪坑”，用革命来清除这些腐朽发臭的“粪坑”，才有新的德国出现。／有浪漫主义和现实主义相结合的风格：夸张/讽刺/想象/比喻的手法，结合民间文学传统进行叙事和抒情。"},{"id":"s00080","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1010","1504","2010考期名词","2310多选","2410名词"],"stem":"名词解释：“湖畔派诗人”","points":["是19世纪英国浪漫主义的文学流派，湖畔派三诗人：华兹华斯、柯勒律治和骚塞。","他们厌恶城市文明，隐居在英国西北部的昆布兰湖区，缅怀中世纪，赞美宗法制农村生活。","代表作：《抒情歌谣集》（华兹华斯和柯勒律治部分诗歌）。其他：“撒旦派”或“恶魔派”：【2010/1510/2404多选】【★★★★★】","代表作家：拜伦、雪莱、济慈。英国19世纪浪漫主义文学。","雪莱被恩格斯称为“天才的预言家”，作品《西风颂》等。"],"src":"是19世纪英国浪漫主义的文学流派，湖畔派三诗人：华兹华斯、柯勒律治和骚塞。／他们厌恶城市文明，隐居在英国西北部的昆布兰湖区，缅怀中世纪，赞美宗法制农村生活。／代表作：《抒情歌谣集》（华兹华斯和柯勒律治部分诗歌）。其他：“撒旦派”或“恶魔派”：【2010/1510/2404多选】【★★★★★】／代表作家：拜伦、雪莱、济慈。英国19世纪浪漫主义文学。／雪莱被恩格斯称为“天才的预言家”，作品《西风颂》等"},{"id":"s00081","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","名词","简答"],"stem":"名词解释：惠特曼《草叶集》","points":["是美国浪漫主义文学的高峰。草叶是民主、自由/生命力/发展的象征。","《草叶集》贯穿全诗集的主题是歌唱自我、民主、自由。诗作应用了自由体诗的新形式，对后来的“垮掉的一代”很有影响。"],"src":"是美国浪漫主义文学的高峰。草叶是民主、自由/生命力/发展的象征。／《草叶集》贯穿全诗集的主题是歌唱自我、民主、自由。诗作应用了自由体诗的新形式，对后来的“垮掉的一代”很有影响。"},{"id":"s00082","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1904 多选，名词考点"],"stem":"名词解释：拜伦《东方叙事诗》","points":["是拜伦在 1813—1816 年创作的以东方故事为题材的富有浪漫主义色彩的一组传奇诗，包括《异教徒》《阿比道斯的新娘》《海盗》《莱拉》《柯林斯的围攻》《巴里·西娜》。[小蒋老师助记：新娘被海盗异教徒拉一巴围攻]","拜伦式英雄：【1610 名词/1210 名词/1804 简答；2304/2510 名词】【★★★★★】①“拜伦式英雄”是拜伦在《东方叙事诗》中塑造的一系列形象。②共同特征：高傲/孤独/倔强/个性独特，蔑视文明，反抗现存社会制度，敢和罪恶社会进行毫不妥协的斗争。③《海盗》中的主人公康拉特就很有代表性。","特点：拜伦通过这类人物表示自己对社会绝不妥协的反抗精神；情节离奇，情绪激烈，叙事抒情结合，以大海/原野/古堡为背景，充满异国情调，风格恣肆狂放/潇洒自如。"],"src":"是拜伦在 1813—1816 年创作的以东方故事为题材的富有浪漫主义色彩的一组传奇诗，包括《异教徒》《阿比道斯的新娘》《海盗》《莱拉》《柯林斯的围攻》《巴里·西娜》。[小蒋老师助记：新娘被海盗异教徒拉一巴围攻]／拜伦式英雄：【1610 名词/1210 名词/1804 简答；2304/2510 名词】【★★★★★】①“拜伦式英雄”是拜伦在《东方叙事诗》中塑造的一系列形象。②共同特征：高傲/孤独/倔强"},{"id":"s00083","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1804 名词","2410 多选"],"stem":"名词解释：拜伦","points":["拜伦是 19 世纪英国和欧洲浪漫主义文学代表作家塑造了一系列高傲、孤独、倔强的叛逆者形象——拜伦式英雄。代表作品有《东方叙事诗》《唐璜》等。"],"src":"拜伦是 19 世纪英国和欧洲浪漫主义文学代表作家塑造了一系列高傲、孤独、倔强的叛逆者形象——拜伦式英雄。代表作品有《东方叙事诗》《唐璜》等。"},{"id":"s00084","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答","论述考点"],"stem":"简述：拜伦《唐璜》中唐璜的人物形象","points":["作者写他许多风流韵事，但着力强调和侧重唐璜性格中美好善良的一面，极力挖掘性格中的积极因素。","唐璜是 18 世纪末的一个天真、善良、勇敢、热情，热爱自由，厌恶虚伪的贵族青年。","他顺从人的自然本性而生活，不愿同上流社会同流合污，无视贵族资产阶级社会的传统习俗和虚伪道德，勇于反抗压迫和奴役，极力追求个人的自由和个性解放。","他性格中消极的一面是玩世不恭、任性放纵、意志薄弱，随波逐流，缺乏明确的生活目标。这是一个在生活的磨炼中不断发展成熟的贵族知识分子形象。在他身上带有作者拜伦自身的影子。"],"src":"作者写他许多风流韵事，但着力强调和侧重唐璜性格中美好善良的一面，极力挖掘性格中的积极因素。／唐璜是 18 世纪末的一个天真、善良、勇敢、热情，热爱自由，厌恶虚伪的贵族青年。／他顺从人的自然本性而生活，不愿同上流社会同流合污，无视贵族资产阶级社会的传统习俗和虚伪道德，勇于反抗压迫和奴役，极力追求个人的自由和个性解放。／他性格中消极的一面是玩世不恭、任性放纵、意志薄弱，随波逐流，缺乏明确的生活目标。这"},{"id":"s00085","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答","论述考点"],"stem":"简述：拜伦《唐璜》的主题","points":["《唐璜》是一部辛辣的社会讽刺杰作。","诗作对封建专制制度及其统治之下的种种社会黑暗和丑恶的揭露批判淋漓尽致。 （3）基本格调：热爱自由、反抗压迫。"],"src":"《唐璜》是一部辛辣的社会讽刺杰作。／诗作对封建专制制度及其统治之下的种种社会黑暗和丑恶的揭露批判淋漓尽致。 （3）基本格调：热爱自由、反抗压迫。"},{"id":"s00086","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1301 论述题"],"stem":"论述拜伦《唐璜》的艺术成就","points":["辛辣的讽刺。 自称为“讽刺史诗”，使用了夸张、变形、对比、反语、谐谑等手法。","作品富于浪漫传奇色彩。","诗作具有浓烈的抒情性。","作品采用了兼叙兼议的表现手法，即在第三人称的叙述中插入第一人称的谈话。","作品在格律、诗歌语言等方面进行创新，是英国诗歌史上运用口语体取得最高成就的诗篇。"],"src":"辛辣的讽刺。 自称为“讽刺史诗”，使用了夸张、变形、对比、反语、谐谑等手法。／作品富于浪漫传奇色彩。／诗作具有浓烈的抒情性。／作品采用了兼叙兼议的表现手法，即在第三人称的叙述中插入第一人称的谈话。／作品在格律、诗歌语言等方面进行创新，是英国诗歌史上运用口语体取得最高成就的诗篇。"},{"id":"s00087","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","名词考点"],"stem":"名词解释：《欧那尼》决战","points":["剧本《欧那尼》以 16 世纪西班牙为背景，叙述一个贵族出身的强盗，为父报仇、反对国王的故事，表现反对封建暴君的进步主题，反映七月革命前夕人民高涨的反封建情绪。","艺术：剧本完全打破了“三一律”的限制，地点随意变换，大量采用奇情剧的手法，充满浪漫的奇异构想。围绕它的上演引起浪漫主义与古典主义阵营之间的一场决战。上演成功标志着浪漫主义彻底战胜了古典主义。"],"src":"剧本《欧那尼》以 16 世纪西班牙为背景，叙述一个贵族出身的强盗，为父报仇、反对国王的故事，表现反对封建暴君的进步主题，反映七月革命前夕人民高涨的反封建情绪。／艺术：剧本完全打破了“三一律”的限制，地点随意变换，大量采用奇情剧的手法，充满浪漫的奇异构想。围绕它的上演引起浪漫主义与古典主义阵营之间的一场决战。上演成功标志着浪漫主义彻底战胜了古典主义。"},{"id":"s00088","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["2010 考期简答"],"stem":"简述雨果《悲惨世界》的主题","points":["《悲惨世界》是雨果现实主义文学的代表作，共 5 部：①芳汀，②珂赛特，③马吕斯，④卜吕梅街的儿女情和圣丹尼街的英雄血，第 5 部冉阿让（贯穿整部小说的中心人物）。","从人道主义出发，对劳动人民的苦难命运表示关注和同情。","对资本主义社会的法律进行了猛烈批判。","对共和主义英雄和巴黎人民起义进行热情赞颂。","宣扬了作者企图以仁爱感化、开办慈善事业解决社会矛盾的人道主义理想。➢ 雨果的人道主义。【简答题考点】【★★★】","雨果的人道主义思想既有进步性，又有局限性。","在《悲惨世界》中，作者同情关注劳动人民的苦难，批判资本主义社会法律的反动，歌颂共和主义者的英勇斗争，反映了雨果人道主义的进步性；而他企图以道德感化、开办慈善事业解决社会矛盾的设想则是其人道主义局限性的表现。","他批判封建专制王朝、天主教会的黑暗势力和资产阶级法律的残酷性，同情劳动人民的苦难，歌颂共和主义者的英勇斗争，肯定法国大革命。","同时极力夸大爱和美的感化力量，幻想以仁爱感化、开办慈善事业来解决社会矛盾，把以仁慈宽恕为中心的人道主义置于“绝对正确的革命”之上。","雨果的人道主义思想体系中的矛盾和局限，是受当时社会历史条件的限制而难以避免的。"],"src":"《悲惨世界》是雨果现实主义文学的代表作，共 5 部：①芳汀，②珂赛特，③马吕斯，④卜吕梅街的儿女情和圣丹尼街的英雄血，第 5 部冉阿让（贯穿整部小说的中心人物）。／从人道主义出发，对劳动人民的苦难命运表示关注和同情。／对资本主义社会的法律进行了猛烈批判。／对共和主义英雄和巴黎人民起义进行热情赞颂。／宣扬了作者企图以仁爱感化、开办慈善事业解决社会矛盾的人道主义理想。➢ 雨果的人道主义。【简答题考点】"},{"id":"s00089","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答","论述考点"],"stem":"简述：雨果《巴黎圣母院》的主题/思想内容","points":["《巴黎圣母院》以 15 世纪的巴黎为背景，但作品写于 1830 年七月革命时期，与当时法国人民的反封建斗争有着密切的联系，有着强烈的反封建反教会的思想倾向。对路易十一统治下封建王朝的专制残暴予以猛烈批判，对天主教会的黑暗伪善也进行了深刻揭露。","对下层人民的悲惨生活命运表示深切同情，赞美这些“低贱者”美好的心灵和品德。","小说在描写下层人民苦难的同时，对于他们的反抗斗争精神也予以一定反映。通过弗兰德使者的预言：预示着封建势力的灭亡，人民革命时代的必然到来，表明作者政治态度转变后坚定的共和立场。"],"src":"《巴黎圣母院》以 15 世纪的巴黎为背景，但作品写于 1830 年七月革命时期，与当时法国人民的反封建斗争有着密切的联系，有着强烈的反封建反教会的思想倾向。对路易十一统治下封建王朝的专制残暴予以猛烈批判，对天主教会的黑暗伪善也进行了深刻揭露。／对下层人民的悲惨生活命运表示深切同情，赞美这些“低贱者”美好的心灵和品德。／小说在描写下层人民苦难的同时，对于他们的反抗斗争精神也予以一定反映。通过弗兰德使"},{"id":"s00090","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","简答","2510 多选"],"stem":"简述：《巴黎圣母院》的人物形象","points":["克罗德：是天主教会恶势力的代表；禁欲主义的牺牲品。批判了天主教恶势力对人民生活的危害作用，宗教清规戒律的约束与人的本能欲求在他身上产生的激烈冲突。","加西莫多：另一种类型的“低贱者”的代表，是作者赞美的对象。外貌奇丑；心灵美好、性格善良、坚强勇敢、富于牺牲精神，渲染了爱的感化力量和作用。"],"src":"克罗德：是天主教会恶势力的代表；禁欲主义的牺牲品。批判了天主教恶势力对人民生活的危害作用，宗教清规戒律的约束与人的本能欲求在他身上产生的激烈冲突。／加西莫多：另一种类型的“低贱者”的代表，是作者赞美的对象。外貌奇丑；心灵美好、性格善良、坚强勇敢、富于牺牲精神，渲染了爱的感化力量和作用。"},{"id":"s00091","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["选择","简答"],"stem":"简述：《巴黎圣母院》中爱斯梅哈尔达的形象","points":["是一个封建制度下无辜遭受侮辱迫害的下层妇女形象和人性美的化身。","她身处社会底层，心地善良，富于同情心和反抗性格。她不计前嫌，给加西莫多在刑台喂水；为救穷诗人甘果瓦，自愿同他“结婚”；真诚爱曾救过她的侍卫长法比，对克罗德的威胁利诱坚贞不屈。","在她身上外貌的美与心灵的美和谐地统一，成为美的化身。通过她赞美“低贱者”美好的心灵和品德。"],"src":"是一个封建制度下无辜遭受侮辱迫害的下层妇女形象和人性美的化身。／她身处社会底层，心地善良，富于同情心和反抗性格。她不计前嫌，给加西莫多在刑台喂水；为救穷诗人甘果瓦，自愿同他“结婚”；真诚爱曾救过她的侍卫长法比，对克罗德的威胁利诱坚贞不屈。／在她身上外貌的美与心灵的美和谐地统一，成为美的化身。通过她赞美“低贱者”美好的心灵和品德。"},{"id":"s00092","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1710 论述"],"stem":"论述《巴黎圣母院》的艺术特色","points":["运用“美丑对照原则”进行创作。","恢宏的史诗性质。","曲折离奇、跌宕引人的情节。","精彩的心理描写。","善于将无生命的事物描绘得庄重神奇、动人心魄，仿佛是富有灵性的活物。"],"src":"运用“美丑对照原则”进行创作。／恢宏的史诗性质。／曲折离奇、跌宕引人的情节。／精彩的心理描写。／善于将无生命的事物描绘得庄重神奇、动人心魄，仿佛是富有灵性的活物。"},{"id":"s00093","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1404 简答","2410 单选"],"stem":"简述《巴黎圣母院》中“美丑对照”原则的运用","points":["运用美与丑、善与恶的对比手法。","主要体现在情节、场景和人物形象对照方面。➢ 论述《巴黎圣母院》美丑对照原则的运用。【0910 论述--详细版答案】【★★★★★】","雨果从哲学和美学的高度，运用了美与丑、善与恶强烈对照的艺术原则，编织惊心动魄的故事情节，塑造异乎寻常的人物，展现了光明与黑暗殊死搏斗的画面。对照艺术在《巴黎圣母院》中主要体现在情节、场景对照与人物形象对照两个方面。","首先：在情节、场景方面，爱斯梅哈尔达被抢与被救、爱情幽会与被诬告判刑以及被救入圣母院与被出卖杀害等悲喜强烈对照；愚人节歌舞的喜剧性开场与被陷害情的悲剧性结局遥相呼应，封建宗教节日“主显节”的死气沉沉与贫民狂欢节“愚人节”的生气勃勃，以路易十一为代表的封建王朝的专制残暴与以克罗班为首的乞丐“奇迹王朝”的平等人道等强烈对照。情节场景的强烈对照，使小说的布局结构显得紧凑、匀称，揭示社会斗争的复杂性，富有紧张的戏剧性。","其次：人物形象的对照，是《巴黎圣母院》对照艺术的精髓，主要通过人物自身的对比以及对爱情的态度构成对比表现出来。比如，加西莫多外貌的丑陋和心灵的美好、弗比斯外表的潇洒和内心的丑恶、克罗德外表的道貌岸然和内心的邪恶自身形成强烈的对照。作家还通过爱斯梅哈尔达与弗比斯、克罗德、加西莫多、甘果瓦四个男性人物的相互关系的描写，形成彼此间的强烈对照，深刻揭示了人物的灵魂和本质。从弗比斯的虚情假意与爱斯梅哈尔达爱情真挚、克罗德的邪恶与爱斯梅哈尔达的美好、甘果瓦的懦弱无能与爱斯梅哈尔达的爱憎分明等相互对照中，雨果揭示了美与丑、善与恶、灵魂与躯体、情与欲之间的内在矛盾，体现了自己的爱情观点和美学思想。"],"src":"运用美与丑、善与恶的对比手法。／主要体现在情节、场景和人物形象对照方面。➢ 论述《巴黎圣母院》美丑对照原则的运用。【0910 论述--详细版答案】【★★★★★】／雨果从哲学和美学的高度，运用了美与丑、善与恶强烈对照的艺术原则，编织惊心动魄的故事情节，塑造异乎寻常的人物，展现了光明与黑暗殊死搏斗的画面。对照艺术在《巴黎圣母院》中主要体现在情节、场景对照与人物形象对照两个方面。／首先：在情节、场景方面"},{"id":"s00094","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["0801 名词","2410 单选"],"stem":"名词解释：“美丑对照原则”","points":["《〈克伦威尔〉序言》中，提出艺术上丑恶滑稽和典雅高尚相结合的美学原则。","雨果从哲学和美学的高度，运用了美与丑、善与恶强烈对照的艺术原则，编织惊心动魄的故事情节，塑造异乎寻常的人物，展现了光明与黑暗殊死搏斗的画面。19.普希金《驿站长》：","《别尔金小说集》中最有代表性的作品。驿站长维林和女儿杜尼亚相依为命。","作品谴责贵族阶级的自私、冷酷，对维林的不幸，表示了深切的同情。","塑造了俄国文学史上第一个“小人物”维林的形象，开创了俄国文学写“小人物”的传统。"],"src":"《〈克伦威尔〉序言》中，提出艺术上丑恶滑稽和典雅高尚相结合的美学原则。／雨果从哲学和美学的高度，运用了美与丑、善与恶强烈对照的艺术原则，编织惊心动魄的故事情节，塑造异乎寻常的人物，展现了光明与黑暗殊死搏斗的画面。19.普希金《驿站长》：／《别尔金小说集》中最有代表性的作品。驿站长维林和女儿杜尼亚相依为命。／作品谴责贵族阶级的自私、冷酷，对维林的不幸，表示了深切的同情。／塑造了俄国文学史上第一个“小"},{"id":"s00095","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["1210","1110 论述","2210 论述"],"stem":"简述：结合作品，分析叶甫盖尼·奥涅金的形象","points":["奥涅金是俄国文学史上第一个“多余人”形象，是开始觉醒的贵族青年的典型。","他厌恶上流社会，又远离人民，缺少实际工作的能力，缺乏对抗习惯势力的勇气。","他找不到自己生活中的位置，性格极其复杂和矛盾。","小说通过奥涅金的形象，反映了俄国贵族社会的腐朽和堕落，揭示了“多余人”形象的致命弱点。➤ 奥涅金：【1310 名词】【★★★★★】","俄国作家普希金的诗体长篇小说《叶甫盖尼·奥涅金》的主人公。","俄国文学史上第一个“多余人”形象。","出身贵族，受西欧进步思想的影响，厌恶上流社会，但又无所作为。"],"src":"奥涅金是俄国文学史上第一个“多余人”形象，是开始觉醒的贵族青年的典型。／他厌恶上流社会，又远离人民，缺少实际工作的能力，缺乏对抗习惯势力的勇气。／他找不到自己生活中的位置，性格极其复杂和矛盾。／小说通过奥涅金的形象，反映了俄国贵族社会的腐朽和堕落，揭示了“多余人”形象的致命弱点。➤ 奥涅金：【1310 名词】【★★★★★】／俄国作家普希金的诗体长篇小说《叶甫盖尼·奥涅金》的主人公。／俄国文学史上第"},{"id":"s00096","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答考点","2404 单选"],"stem":"简析达吉亚娜的形象","points":["达吉亚娜是普希金心目中的理想贵族妇女形象，诗人称她“灵魂上的俄罗斯人”。","她美好的品德和性情同人民的影响联系在一起，纯朴善良，对理想真诚与执著。","在这一形象中，包含着诗人对人民的理解，体现着诗人创作的高度人民性。"],"src":"达吉亚娜是普希金心目中的理想贵族妇女形象，诗人称她“灵魂上的俄罗斯人”。／她美好的品德和性情同人民的影响联系在一起，纯朴善良，对理想真诚与执著。／在这一形象中，包含着诗人对人民的理解，体现着诗人创作的高度人民性。"},{"id":"s00097","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答","论述考点"],"stem":"简述：《叶甫盖尼·奥涅金》的思想意义","points":["小说以彼得堡和外省乡村为背景，广泛地展现了19世纪初俄国社会生活画面，揭示了上流社会贵族生活的罪恶，表明贵族阶级已经走向没落、衰亡。","小说通过奥涅金这个“多余人”的形象，既批判了专制的沙皇农奴制度，也指出了他们远离人民、脱离实际的致命弱点。","通过达吉亚娜的形象，赞美纯洁、善良、真诚等优美的品德，批判了沙皇专制制度对人类社会美的亵渎。","小说对农奴的悲惨生活也作了一定的描写，表现了作者人道主义的同情。"],"src":"小说以彼得堡和外省乡村为背景，广泛地展现了19世纪初俄国社会生活画面，揭示了上流社会贵族生活的罪恶，表明贵族阶级已经走向没落、衰亡。／小说通过奥涅金这个“多余人”的形象，既批判了专制的沙皇农奴制度，也指出了他们远离人民、脱离实际的致命弱点。／通过达吉亚娜的形象，赞美纯洁、善良、真诚等优美的品德，批判了沙皇专制制度对人类社会美的亵渎。／小说对农奴的悲惨生活也作了一定的描写，表现了作者人道主义的同情。"},{"id":"s00098","type":"short","ch":"第一部分 西方文学 · 第六章 19世纪文学（上）","sec":"","tags":["简答","论述考点"],"stem":"简述：《叶甫盖尼·奥涅金》的艺术特色","points":["人物与环境的典型性。","鲜明的对比手法。如奥涅金的冷漠与连斯基的热烈浪漫；奥涅金的感情虚假与达吉亚娜的感情诚挚；达吉亚娜平凡的外貌和优美的精神世界与奥尔加娇艳的外表和空虚的内心世界等。","诗体小说的独特体裁。现实主义长篇的典型特色+诗歌的凝练笔法-诗的意境，抒情插笔。"],"src":"人物与环境的典型性。／鲜明的对比手法。如奥涅金的冷漠与连斯基的热烈浪漫；奥涅金的感情虚假与达吉亚娜的感情诚挚；达吉亚娜平凡的外貌和优美的精神世界与奥尔加娇艳的外表和空虚的内心世界等。／诗体小说的独特体裁。现实主义长篇的典型特色+诗歌的凝练笔法-诗的意境，抒情插笔。"},{"id":"s00099","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1310 论述","0401 多选"],"stem":"论述十九世纪现实主义文学的基本特征","points":["思想特征：①把文学作为分析与研究社会的手段，为人们提供了特定时代丰富多彩的社会历史画面，具有很高的认识价值。②以人道主义思想为基本的价值取向。","艺术特征：①强调客观真实地反映生活，注重细节的真实。②重视人与社会环境的关系的描写，塑造典型环境中的典型性格。"],"src":"思想特征：①把文学作为分析与研究社会的手段，为人们提供了特定时代丰富多彩的社会历史画面，具有很高的认识价值。②以人道主义思想为基本的价值取向。／艺术特征：①强调客观真实地反映生活，注重细节的真实。②重视人与社会环境的关系的描写，塑造典型环境中的典型性格。"},{"id":"s00100","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["名词考点"],"stem":"名词解释：“宪章派文学”","points":["英国1838年至1848年爆发的“宪章运动”中出现的文学流派。[劳资矛盾]","主要成就是诗歌，反映了工人的呼声，政治倾向明确。","语言晓畅，充满激情，流传广，影响大。代表诗人主要有琼斯和林顿。"],"src":"英国1838年至1848年爆发的“宪章运动”中出现的文学流派。[劳资矛盾]／主要成就是诗歌，反映了工人的呼声，政治倾向明确。／语言晓畅，充满激情，流传广，影响大。代表诗人主要有琼斯和林顿。"},{"id":"s00101","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1410","2104","2204名词","2504名词"],"stem":"名词解释：“多余人”","points":["“多余人”是19世纪俄国文学中贵族知识分子的一种典型。","大多有较高的文化修养，接受启蒙思想的影响，厌倦上流社会的生活，渴望有所作为。","但这类形象往往以自我为中心，没有明确的生活目标，缺乏行动的能力和勇气。因此在社会上无所适从，结局是悲剧性的。","代表人物有奥涅金、毕巧林、罗亭、奥勃洛摩夫等。"],"src":"“多余人”是19世纪俄国文学中贵族知识分子的一种典型。／大多有较高的文化修养，接受启蒙思想的影响，厌倦上流社会的生活，渴望有所作为。／但这类形象往往以自我为中心，没有明确的生活目标，缺乏行动的能力和勇气。因此在社会上无所适从，结局是悲剧性的。／代表人物有奥涅金、毕巧林、罗亭、奥勃洛摩夫等。"},{"id":"s00102","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1210名词","0401名词"],"stem":"名词解释：“小人物”","points":["“小人物”是19世纪俄国文学中塑造的一系列典型。","他们是性格懦弱、胆小怕事的被欺凌与侮辱者。","通过这类形象的塑造表现了作者的人道主义思想。","继普希金之后，果戈理、陀思妥耶夫斯基、契诃夫等都塑造过此类人物。"],"src":"“小人物”是19世纪俄国文学中塑造的一系列典型。／他们是性格懦弱、胆小怕事的被欺凌与侮辱者。／通过这类形象的塑造表现了作者的人道主义思想。／继普希金之后，果戈理、陀思妥耶夫斯基、契诃夫等都塑造过此类人物。"},{"id":"s00103","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1604名词","1110名词"],"stem":"名词解释：自然派","points":["“自然派”是俄国现实主义文学的别称，是指19世纪40年代俄国文坛上出现的以果戈理为代表的一批现实主义作家。","他们的创作真实地反映生活，揭露了农奴制的腐朽黑暗，描写下层人们的苦难命运，表达了劳动人民要求变革社会的愿望。别林斯基从理论上论证了自然派文学批判现实的创作倾向。","果戈理继承并发展了普希金开创的现实主义传统。（《钦差大臣》《外套》《死魂灵》）"],"src":"“自然派”是俄国现实主义文学的别称，是指19世纪40年代俄国文坛上出现的以果戈理为代表的一批现实主义作家。／他们的创作真实地反映生活，揭露了农奴制的腐朽黑暗，描写下层人们的苦难命运，表达了劳动人民要求变革社会的愿望。别林斯基从理论上论证了自然派文学批判现实的创作倾向。／果戈理继承并发展了普希金开创的现实主义传统。（《钦差大臣》《外套》《死魂灵》）"},{"id":"s00104","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["选择","名词"],"stem":"名词解释：“新人”","points":["19世纪中叶在俄国文学中出现具有民主主义思想倾向的平民知识分子形象。尽管个性相异，但大多出身平民，具有坚定的意志、明确的理想，以及实干精神和自我牺牲精神。","如《父与子》中的巴扎洛夫、《怎么办？》中的罗普霍夫等。"],"src":"19世纪中叶在俄国文学中出现具有民主主义思想倾向的平民知识分子形象。尽管个性相异，但大多出身平民，具有坚定的意志、明确的理想，以及实干精神和自我牺牲精神。／如《父与子》中的巴扎洛夫、《怎么办？》中的罗普霍夫等。"},{"id":"s00105","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["名词考点"],"stem":"名词解释：“意大利性格”","points":["斯丹达尔作品中的人物形象，他们富于激情，追求纯洁爱情，不求虚荣，不受封建礼教束缚。","《瓦尼娜·瓦尼尼》中的瓦尼娜·瓦尼尼和烧炭党人富于激情，《巴马修道院》中的法布里斯大胆、果断、富于冒险精神，全凭激情行事。吉娜更似一座“热情的宝山”，蕴藏着最优美女性感情的“泉源和琼玉”。"],"src":"斯丹达尔作品中的人物形象，他们富于激情，追求纯洁爱情，不求虚荣，不受封建礼教束缚。／《瓦尼娜·瓦尼尼》中的瓦尼娜·瓦尼尼和烧炭党人富于激情，《巴马修道院》中的法布里斯大胆、果断、富于冒险精神，全凭激情行事。吉娜更似一座“热情的宝山”，蕴藏着最优美女性感情的“泉源和琼玉”。"},{"id":"s00106","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["简答考点"],"stem":"简述：斯丹达尔心理描写的特点","points":["表现为激动的心灵和外表的冷漠、内在抒情和外在“生硬”的统一。他被称为“近代小说之父”。","既是作者“自爱”的表现，也是理性的思维方式，是通过认识自己从而认识他人乃至“整个人类心灵”的独特艺术手法。","运用内心独白展现人物的内心世界，心理描写是分析性的，又有某些现代的因素。"],"src":"表现为激动的心灵和外表的冷漠、内在抒情和外在“生硬”的统一。他被称为“近代小说之父”。／既是作者“自爱”的表现，也是理性的思维方式，是通过认识自己从而认识他人乃至“整个人类心灵”的独特艺术手法。／运用内心独白展现人物的内心世界，心理描写是分析性的，又有某些现代的因素。"},{"id":"s00107","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["1210简答"],"stem":"简述：斯丹达尔《红与黑》的象征意义","points":["“红”象征着拿破仑时代，法国资产阶级革命的热血和丰功伟绩；“黑”意味着复辟时期的王朝和教会的黑暗统治。","“红”象征着有抱负才华的于连希望立功战绩而升将军的愿望；“黑”象征着于连希望通过披上教士的黑袍跻身上层社会。"],"src":"“红”象征着拿破仑时代，法国资产阶级革命的热血和丰功伟绩；“黑”意味着复辟时期的王朝和教会的黑暗统治。／“红”象征着有抱负才华的于连希望立功战绩而升将军的愿望；“黑”象征着于连希望通过披上教士的黑袍跻身上层社会。"},{"id":"s00108","type":"short","ch":"第一部分 西方文学 · 第七章 19 世纪文学（中）","sec":"","tags":["简答","论述题","2404简答"],"stem":"简述：斯丹达尔《红与黑》的思想内容","points":["《红与黑》全面地展现了19世纪法国从小城到省城直至京城的贵族、教会、资产阶级和平民的精神面貌和心理状态，描绘了王政复辟时期激烈的政治斗争，批判了复辟王朝时期的贵族社会，讽刺了传统宗教及其罪恶。","《红与黑》描绘了王政复辟时期激烈的政治斗争，具有强烈的政治倾向。①对侯爵府第的描写，广泛地展现了复辟王朝时期贵族社会的画面。②对神学院的描写，是作者对传统宗教及其罪恶的绝妙讽刺，神学院和教区内充满着阴谋及钩心斗角。③对外省小城的描写富讽刺意味。德·瑞那市长是王政复辟时期的贵族典型，兼有贵族狂妄和资产者贪得无厌。"],"src":"《红与黑》全面地展现了19世纪法国从小城到省城直至京城的贵族、教会、资产阶级和平民的精神面貌和心理状态，描绘了王政复辟时期激烈的政治斗争，批判了复辟王朝时期的贵族社会，讽刺了传统宗教及其罪恶。／《红与黑
